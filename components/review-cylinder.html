<!doctype html>
<!-- meta: {"name":"후기 Cylinder","cat":"갤러리","desc":"사용자 후기 카드가 원통을 따라 천천히 돌고, 정면에 온 카드만 하얗게 밝아지며 끌었다 놓으면 가까운 카드에 맞춰 멈추는 캐러셀","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>후기 원통</title>
<style>
  :root{--ink:#f1ede6;--mute:#77726b;--card:#141414;--line:rgba(255,255,255,.08);--star:#f5b83d}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(70% 50% at 50% 60%,#0f0f0f,#000 72%);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none}
  .stage{position:fixed;inset:0;cursor:grab;touch-action:none;perspective-origin:50% 35%}
  .stage.drag{cursor:grabbing}
  .scene,.ring{position:absolute;left:50%;top:54%;transform-style:preserve-3d}
  .ring{left:0;top:0}
  .card{position:absolute;left:0;top:0;padding:1.3em 1.4em;border-radius:1em;
    background:var(--card);color:var(--ink);border:1px solid var(--line);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;gap:.9em;
    transition:background .45s,color .45s,border-color .45s,box-shadow .45s}
  .card.on{background:#fff;color:#151515;border-color:#fff;box-shadow:0 1.6em 3.5em rgba(0,0,0,.55)}
  .who{display:flex;align-items:center;gap:.75em}
  .av{flex:none;width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95em;color:#fff}
  .nm{font-weight:700;font-size:1em;letter-spacing:-.02em}
  .rl{font-size:.78em;opacity:.55;margin-top:.15em}
  .q{font-size:.95em;line-height:1.55;letter-spacing:-.015em;opacity:.85;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.on .q{opacity:1}
  .st{font-size:.85em;letter-spacing:.12em;color:var(--star)}
  .st i{font-style:normal;opacity:.25}
  .dim{position:absolute;inset:-1px;border-radius:1em;background:#000;pointer-events:none;opacity:0}
  .ui{position:fixed;left:clamp(14px,3vw,32px);right:clamp(14px,3vw,32px);display:flex;justify-content:space-between;font-size:12px;color:var(--mute);pointer-events:none}
  .ui b{color:var(--ink);font-weight:600}
  .top{top:clamp(12px,3vh,26px)} .bot{bottom:clamp(12px,3vh,26px)}
  .num{font-variant-numeric:tabular-nums;color:var(--ink)}
  @media (max-height:320px){.top{display:none}}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" aria-label="사용자 후기, 좌우 화살표로 넘기기">
  <div class="scene" id="scene"><div class="ring" id="ring"></div></div>
</div>
<div class="ui top"><b>사용자 후기</b><span>평균 4.8점</span></div>
<div class="ui bot"><span>끌어서 돌리기 · 휠 · ← →</span><span class="num" id="num">01 / 10</span></div>
<script>
const REVIEWS=[
  ['김서윤','프로덕트 디자이너','처음 써본 날부터 회의가 짧아졌어요. 정리가 저절로 됩니다.',5,['#ff8a5c','#d1456b']],
  ['박지훈','스타트업 대표','팀 전체가 같은 화면을 보니 말이 줄고 일이 빨라졌어요.',5,['#5c9dff','#3b4bd1']],
  ['이하은','마케터','캠페인 일정을 한눈에 보게 돼서 야근이 확 줄었습니다.',4,['#5fd3a0','#1f8a6b']],
  ['정민재','개발자','단축키가 손에 착 붙어요. 마우스를 거의 안 씁니다.',5,['#b58cff','#6a3fd1']],
  ['최유나','작가','원고 초안을 모아두기 좋아요. 흐름이 끊기지 않습니다.',5,['#ffc85c','#e0832b']],
  ['한도윤','사진가','촬영 일정과 보정 메모를 한곳에 두니 마음이 편해요.',4,['#8fd0e0','#3a7f9e']],
  ['오세린','교사','수업 자료를 학생들과 나누기가 정말 쉬워졌어요.',5,['#ff9cc2','#c2457f']],
  ['윤태오','UX 리서처','인터뷰 기록을 태그로 묶으니 패턴이 바로 보입니다.',5,['#9be07a','#4a9b3a']],
  ['강나래','카페 운영','재고와 근무표를 같이 보니 아침 준비가 빨라졌어요.',4,['#f2a37a','#a3553a']],
  ['임준서','대학생','과제 마감을 놓친 적이 없어요. 알림이 딱 적당해요.',5,['#7ab8ff','#4a6fe0']]];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=REVIEWS.length,STEP=360/N;
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),ring=document.getElementById('ring'),num=document.getElementById('num');
const cards=REVIEWS.map(([n,r,q,s,[c1,c2]])=>{
  const el=document.createElement('article');el.className='card';
  el.innerHTML=`<div class="who"><div class="av" style="background:radial-gradient(circle at 30% 25%,${c1},${c2})">${n[0]}</div>
    <div><div class="nm">${n}</div><div class="rl">${r}</div></div></div>
    <p class="q">${q}</p><div class="st" aria-label="별점 ${s}점">${'★'.repeat(s)}<i>${'★'.repeat(5-s)}</i></div><div class="dim"></div>`;
  ring.appendChild(el);return {el,dim:el.querySelector('.dim')};
});

let W,H,R;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  W=Math.max(170,Math.min(vw*.34,vh*.55/.62,340));H=W*.62;R=N*W*1.08/(2*Math.PI);
  stage.style.perspective=Math.round(R*3.2)+'px';
  scene.style.transform=`translateZ(${-R}px) rotateX(-9deg)`;
  cards.forEach((c,i)=>Object.assign(c.el.style,{width:W+'px',height:H+'px',marginLeft:-W/2+'px',marginTop:-H/2+'px',fontSize:(W/19)+'px',
    transform:`rotateY(${i*STEP}deg) translateZ(${R}px)`}));
}

let ang=0,vel=0,target=null,drag=null,lastInput=-1e9,prev=performance.now(),front=-1;
const clamp=(v,a)=>Math.max(-a,Math.min(a,v));
const snap=a=>Math.round(a/STEP)*STEP;
function render(){
  ring.style.transform=`rotateY(${(-ang).toFixed(3)}deg)`;
  cards.forEach((c,i)=>{const rel=(i*STEP-ang)*Math.PI/180;c.dim.style.opacity=Math.min(.85,(1-Math.cos(rel))*.9).toFixed(3)});
  const f=((Math.round(ang/STEP)%N)+N)%N;
  if(f!==front){
    if(front>=0)cards[front].el.classList.remove('on');
    front=f;cards[f].el.classList.add('on');
    num.textContent=String(f+1).padStart(2,'0')+' / '+N;
  }
}
function tick(now){
  const dt=Math.min(3,(now-prev)/16.67);prev=now;
  if(!drag){
    if(target!==null){
      ang+=(target-ang)*Math.min(1,(reduce?1:.12)*dt);
      if(Math.abs(target-ang)<.02){ang=target;target=null}
    }else if(!reduce&&now-lastInput>2800)ang+=.06*dt;
  }
  render();requestAnimationFrame(tick);
}
const degPerPx=()=>180/(Math.PI*R)*.9;
stage.addEventListener('pointerdown',e=>{
  if(e.button)return;
  drag={x:e.clientX,lx:e.clientX,lt:e.timeStamp,a:ang,moved:0,card:e.target.closest('.card')};
  vel=0;target=null;lastInput=performance.now();stage.setPointerCapture(e.pointerId);stage.classList.add('drag');
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));
  ang=drag.a-dx*degPerPx();
  const dt=Math.max(1,e.timeStamp-drag.lt);
  vel=clamp(vel*.3-(e.clientX-drag.lx)*degPerPx()/(dt/16.67)*.7,10);
  drag.lx=e.clientX;drag.lt=e.timeStamp;lastInput=performance.now();
});
function endDrag(e){
  if(!drag)return;stage.classList.remove('drag');
  if(drag.moved<6){const i=cards.findIndex(c=>c.el===drag.card);
    if(i>=0){const d=((i*STEP-ang)%360+540)%360-180;target=snap(ang+d)}else target=snap(ang)}
  else{const fling=(reduce||e.timeStamp-drag.lt>90)?0:vel*12;target=snap(ang+clamp(fling,STEP*2))}
  vel=0;drag=null;lastInput=performance.now();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
let wheelAcc=0,wheelT=0;
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  wheelAcc+=e.deltaMode?d*30:d;lastInput=performance.now();
  if(Math.abs(wheelAcc)>=60&&performance.now()-wheelT>140){
    target=snap((target??ang))+Math.sign(wheelAcc)*STEP;wheelAcc=0;wheelT=performance.now();
  }
},{passive:false});
addEventListener('keydown',e=>{
  let n=0;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')n=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=-1;
  if(!n)return;e.preventDefault();target=snap(target??ang)+n*STEP;lastInput=performance.now();
});
addEventListener('resize',layout);
layout();render();requestAnimationFrame(tick);
</script>
</body>
</html>
