<!doctype html>
<!-- meta: {"name":"작은 날씨들 Book","cat":"화면","desc":"천 표지 책을 누르면 3D로 펼쳐지고, 한 장씩 넘기며 날씨 그림과 짧은 글을 읽어요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<title>작은 날씨들</title>
<style>
  :root{--dur:.9s;--gold:#e9cf86;--ink:#e8dcc0;--serif:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(ellipse 75% 70% at 50% 44%,#26211c 0%,#141210 58%,#090807 100%);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .fit{position:absolute;left:50%;top:calc(50% - 28px);width:640px;height:450px;margin:-225px 0 0 -320px}
  .persp{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 40%}
  .tilt{position:absolute;left:320px;top:15px;width:0;height:420px;transform-style:preserve-3d;transform-origin:0 210px 9px;
    transition:transform .8s cubic-bezier(.2,.7,.3,1)}
  .book{position:absolute;left:0;top:0;width:300px;height:420px;transform-style:preserve-3d;transform-origin:-150px 210px 9px;
    transition:transform 1.05s cubic-bezier(.55,.05,.3,1)}
  .leaf{position:absolute;left:0;top:0;width:300px;height:420px;transform-origin:0 50%;transform-style:preserve-3d;
    transition:transform var(--dur) cubic-bezier(.5,.08,.3,1)}
  .leaf.pagel{top:5px;width:294px;height:410px}
  .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{transform:rotateY(180deg)}
  .pagel .front,.endp.front{border-radius:0 3px 3px 0}
  .pagel .back,.endp.back{border-radius:3px 0 0 3px}
  .pg::after,.paper::after,.endp::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
  .front.pg::after,.front.endp::after{background:linear-gradient(90deg,rgba(60,38,15,.26),rgba(60,38,15,.06) 5%,transparent 12%,transparent 95%,rgba(60,38,15,.05))}
  .back.paper::after,.back.endp::after{background:linear-gradient(270deg,rgba(60,38,15,.26),rgba(60,38,15,.06) 5%,transparent 12%,transparent 95%,rgba(60,38,15,.05))}
  .shade{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:3}
  /* 넘기는 동안의 그림자: 검정 대신 종이와 어울리는 따뜻한 갈색을 옅게 (크림색이 회색으로 탁해지지 않게) */
  .front .shade{background:linear-gradient(90deg,rgba(70,45,20,.04),rgba(70,45,20,.2) 72%,rgba(255,246,224,.14) 90%,rgba(70,45,20,.12))}
  .back .shade{background:linear-gradient(270deg,rgba(70,45,20,.04),rgba(70,45,20,.2) 72%,rgba(255,246,224,.14) 90%,rgba(70,45,20,.12))}
  .turning .shade{animation:shade var(--dur) var(--dl,0s) both}
  @keyframes shade{0%,100%{opacity:0}50%{opacity:1}}

  /* 천 표지 */
  .cloth{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px),
      radial-gradient(130% 100% at 30% 18%,#3b5c48,#2f4a3a 55%,#223628);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 0 40px rgba(0,0,0,.35)}
  .coverF::before,.coverB::before{content:"";position:absolute;top:0;bottom:0;width:22px;
    background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.1) 60%,rgba(255,255,255,.07) 70%,rgba(0,0,0,.25) 78%,transparent)}
  .coverF{border-radius:2px 6px 6px 2px;display:flex;flex-direction:column;align-items:center;padding-top:76px}
  .coverF::before{left:0}
  .coverB{border-radius:6px 2px 2px 6px;display:flex;flex-direction:column;align-items:center;padding:58px 34px 0}
  .coverB::before{right:0;transform:scaleX(-1)}
  .emb{width:66px;height:50px;fill:none;stroke:#1c3024;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.13))}
  .title{margin-top:26px;font:700 36px/1.2 var(--serif);letter-spacing:.04em;
    background:linear-gradient(110deg,#8a682c 0%,#e3c47a 22%,#b38b41 40%,#fff1c2 50%,#b38b41 60%,#e3c47a 78%,#8a682c 100%);
    background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
    transition:background-position 1.4s ease;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
  .shine .title{background-position:0 0}
  .sub{margin-top:14px;font-size:10.5px;letter-spacing:.42em;padding-left:.42em;color:rgba(233,207,134,.72)}
  .rule{position:absolute;bottom:50px;width:40px;height:1px;background:rgba(233,207,134,.45)}
  .bt{font:700 14px var(--serif);letter-spacing:.24em;color:#d3b46a}
  .blurb{margin-top:70px;font:400 17px/1.95 var(--serif);color:rgba(236,226,200,.88);text-align:center;word-break:keep-all}
  .bc{position:absolute;right:26px;bottom:28px;background:#efe7d6;padding:7px 9px 5px;border-radius:2px;text-align:center}
  .bc svg{display:block;width:104px;height:38px}
  .bc span{display:block;margin-top:2px;font:9px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.08em;color:#2a2620}

  /* 면지와 본문 */
  .endp{background:radial-gradient(circle,rgba(120,96,60,.22) 1px,transparent 1.5px) 0 0/11px 11px,#efe7d6;
    display:grid;place-items:center;color:#6d5f48}
  .exl{border:1px solid rgba(109,95,72,.4);background:#efe6d2;padding:16px 24px;text-align:center;font:13px/1.7 var(--serif)}
  .exl small{display:block;font-size:10.5px;letter-spacing:.16em;color:#8e7f63}
  .exl .ln{display:block;width:110px;height:1px;background:rgba(109,95,72,.45);margin:18px auto 10px}
  .paper{padding:36px 28px 0 30px;color:#5b4f3d;
    background:repeating-linear-gradient(180deg,transparent 0 25px,rgba(120,100,70,.13) 25px 26px) 0 92px/100% 100% no-repeat,#efe7d6}
  .mk{font-size:10px;letter-spacing:.3em;color:#9a8a6d}
  .mt{display:block;margin-top:14px;font-size:12px;color:#6b5d48}
  .paper p{margin-top:26px;font:400 15px/26px var(--serif);color:#4a3f30;word-break:keep-all}
  .mn{position:absolute;bottom:18px;left:26px;font-size:10px;letter-spacing:.15em;color:#a39377}
  .pg{background:#efe7d6}
  .art{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap{position:absolute;top:22px;left:26px;right:20px;z-index:1}
  .no{font-size:10px;letter-spacing:.3em;opacity:.75}
  .cap h2{margin-top:6px;font:700 25px/1.25 var(--serif);letter-spacing:.02em}
  .cap p{margin-top:6px;font-size:12.5px;line-height:1.5;word-break:keep-all}
  .dark .cap{color:#1e2420;text-shadow:0 0 10px rgba(255,255,255,.5)}
  .light .cap{color:#f4eee2;text-shadow:0 1px 10px rgba(0,0,0,.6)}

  .edge{position:absolute;top:5px;height:410px;width:0;transform-origin:0 50%;
    /* 아주 얇게 보이는 면이라 촘촘한 줄무늬는 점선처럼 깨져 보여서, 부드러운 종이색 그라데이션으로 */
    background:linear-gradient(90deg,#e6dcc4,#f1e9d6 50%,#e6dcc4);transition:width var(--dur),transform var(--dur)}
  #edgeR{left:294px}#edgeL{left:-294px}
  /* 위·아래 종이 단면: 책을 위아래로 기울여도 빈틈(안쪽 갈색)이 보이지 않게 채운다 */
  .edgeh{position:absolute;width:294px;height:0;transform-origin:0 0;transform:rotateX(90deg);
    background:linear-gradient(0deg,#e6dcc4,#f1e9d6 50%,#e6dcc4);transition:height var(--dur)}
  #edgeRT,#edgeRB{left:0}#edgeLT,#edgeLB{left:-294px}
  #edgeRT,#edgeLT{top:5px}#edgeRB,#edgeLB{top:415px}
  .shadow{position:absolute;top:15px;left:170px;width:300px;height:420px;border-radius:6px;
    box-shadow:0 46px 70px -24px rgba(0,0,0,.9),0 16px 30px -8px rgba(0,0,0,.55);transition:left 1s,width 1s}
  .open .shadow{left:20px;width:600px}
  .hit{position:absolute;top:15px;width:300px;height:420px;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #hitCover{left:170px}#hitL{left:20px}#hitR{left:320px}

  .bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn,.close{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(233,207,134,.28);
    border-radius:999px;padding:7px 16px;cursor:pointer;transition:background .2s}
  .btn:hover,.close:hover{background:rgba(233,207,134,.13)}
  .btn:focus-visible,.close:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .ind{min-width:78px;text-align:center;font-size:13px;color:#bfb39a;font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .close{position:fixed;top:12px;right:12px;width:38px;height:38px;padding:0;font-size:20px;line-height:1}
  .rm *,.snap *{transition:none!important;animation:none!important}
</style>
</head>
<body>
<main>
  <div class="fit" id="fit">
    <div class="shadow"></div>
    <div class="persp"><div class="tilt" id="tilt"><div class="book" id="book">
      <div class="edge" id="edgeR"></div><div class="edge" id="edgeL"></div>
      <div class="edgeh" id="edgeRT"></div><div class="edgeh" id="edgeRB"></div><div class="edgeh" id="edgeLT"></div><div class="edgeh" id="edgeLB"></div>
    </div></div></div>
    <button class="hit" id="hitCover" tabindex="-1" aria-hidden="true"></button>
    <button class="hit" id="hitL" tabindex="-1" aria-hidden="true"></button>
    <button class="hit" id="hitR" tabindex="-1" aria-hidden="true"></button>
  </div>
</main>
<button class="close" id="closeB" type="button" aria-label="책 덮기" hidden>×</button>
<nav class="bar" aria-label="책 넘기기">
  <button class="btn" id="hint" type="button">펼치기</button>
  <button class="btn" id="prevB" type="button" hidden>‹ 이전</button>
  <span class="ind" id="ind" hidden></span>
  <button class="btn" id="nextB" type="button" hidden>다음 ›</button>
</nav>
<p class="sr" id="live" aria-live="polite"></p>

<script>
const $=id=>document.getElementById(id);
const root=document.documentElement,book=$('book'),tiltEl=$('tilt'),fitEl=$('fit'),eR=$('edgeR'),eL=$('edgeL');
const hint=$('hint'),prevB=$('prevB'),nextB=$('nextB'),ind=$('ind'),closeB=$('closeB'),live=$('live');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;if(RM)root.classList.add('rm');
const N=10,D=1.8,DUR=RM?0:900;
let t=0,busy=false,flipping=false,px=0,py=0,pending=0;const active=new Set([0]);

const PAGES=[
  ['서리','잎맥마다 소금이 내려앉았어요','dark','새벽 6시 10분 · 영하 3도 · 바람 없음','숨을 내쉬면 잠깐 하얘졌다가 사라졌다.'],
  ['아지랑이','멀리 도로가 물처럼 일렁여요','dark','오후 2시 · 31도 · 남서풍 약함','아스팔트 냄새가 신발 밑까지 올라왔다.'],
  ['비 오는 창','유리창에 항구가 번져 있어요','light','저녁 7시 · 비 12밀리미터','버스가 올 때까지 유리만 바라보았다.'],
  ['안개','오늘은 길이 조금 일찍 끝나요','dark','아침 7시 30분 · 가시거리 200미터','가로등이 평소보다 늦게 꺼졌다.'],
  ['첫눈','소리가 하나씩 지워져요','light','오후 5시 · 영하 1도','골목에 찍힌 발자국이 내 것뿐이었다.'],
  ['소나기','우산이 북처럼 울려요','light','오후 3시 · 20분 동안 30밀리미터','처마 밑에 모르는 사람 다섯이 나란히 섰다.'],
  ['무지개','비가 그친 자리에 다리가 놓였어요','dark','오후 4시 · 개었다가 다시 맑음','끝까지 다 보기 전에 희미해졌다.'],
  ['바람','빨래가 먼저 알려 줘요','dark','오전 11시 · 북서풍 초속 6미터','양말 한 짝을 찾으러 옆집 마당까지 갔다.']
];
const COVER=`<svg class="emb" viewBox="0 0 64 48" aria-hidden="true"><circle cx="40" cy="16" r="8"/>
  <path d="M40 3v3M53 16h-3M49.2 6.8l-2.1 2.1M30.8 6.8l2.1 2.1"/>
  <path fill="#2e4939" d="M16 40h30a9 9 0 0 0 0-18 12 12 0 0 0-22.5 3A7.5 7.5 0 0 0 16 40z"/></svg>
  <h1 class="title">작은 날씨들</h1><p class="sub">여덟 개의 짧은 예보</p><span class="rule"></span>`;
const EXL=`<div class="exl"><small>이 책의 주인</small><span class="ln"></span><small>창가 자리에서 읽기를 권해요</small></div>`;
const END=`<div class="exl">다 읽었어요.<br>이제 창밖을 한번 보세요.</div>`;
const BACK=`<p class="bt">작은 날씨들</p><p class="blurb">걷다가 멈춰 섰을 때만 보이는<br>날씨를 모은 작은 안내서.</p>
  <div class="bc"><svg viewBox="0 0 100 38" aria-hidden="true"></svg><span>979-11-2026-112-7</span></div>`;

/* ---------- 책 만들기 ---------- */
const face=(cls,html)=>`<div class="face ${cls}">${html}<i class="shade"></i></div>`;
const leaves=[];
for(let i=0;i<N;i++){
  const L=document.createElement('div');L.className='leaf'+(i&&i<N-1?' pagel':'');let f,b;
  if(i===0){f=face('front cloth coverF',COVER);b=face('back endp',EXL)}
  else if(i===N-1){f=face('front endp',END);b=face('back cloth coverB',BACK)}
  else{const p=PAGES[i-1],n=String(i).padStart(2,'0');
    f=face('front pg '+p[2],`<canvas class="art" width="600" height="840" aria-hidden="true"></canvas><div class="cap"><span class="no">${n}</span><h2>${p[0]}</h2><p>${p[1]}</p></div>`);
    b=face('back paper',`<span class="mk">관측 메모 · ${n}</span><span class="mt">${p[3]}</span><p>${p[4]}</p><span class="mn">${n}</span>`)}
  L.innerHTML=f+b;book.appendChild(L);leaves.push(L)}

/* ---------- 그림 도구 ---------- */
const W=300,H=420,HASF='filter' in CanvasRenderingContext2D.prototype;
const rng=s=>()=>{s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296};
(()=>{const R=rng(9);let x=2,s='';while(x<97){const w=(R()<.5?1:R()<.7?2:3)*.8,tall=x<5||x>93||Math.abs(x-50)<2;
  s+=`<rect x="${x.toFixed(2)}" y="0" width="${w}" height="${tall?38:33}" fill="#1d1a16"/>`;x+=w+(R()<.6?.9:1.8)}
  book.querySelector('.bc svg').innerHTML=s})();
const lg=(c,x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
const fillG=(c,g,x=0,y=0,w=W,h=H)=>{c.fillStyle=g;c.fillRect(x,y,w,h)};
const blob=(c,x,y,r,rgb,a)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)};
const poly=(c,pts,fill)=>{c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill()};
function daubs(c,R,n,x,y,w,h,cols,a,len,lw){c.lineCap='round';for(let i=0;i<n;i++){const px=x+R()*w,py=y+R()*h,an=(R()-.5)*.8;
  c.strokeStyle=`rgba(${cols[i%cols.length]},${a*(.4+R()*.6)})`;c.lineWidth=lw*(.5+R());c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.cos(an)*len,py+Math.sin(an)*len);c.stroke()}}
function grain(c,R,a){for(let i=0;i<2400;i++){c.fillStyle=R()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;c.fillRect(R()*W,R()*H,1,1)}}
function star(c,x,y,r,a){for(let k=0;k<3;k++){const an=a+k*Math.PI/3;c.beginPath();c.moveTo(x-Math.cos(an)*r,y-Math.sin(an)*r);c.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r);c.stroke()}}
function drop(c,x,y,r){c.fillStyle='rgba(10,16,24,.35)';c.beginPath();c.arc(x,y,r,0,7);c.fill();
  const g=c.createRadialGradient(x,y+r*.35,0,x,y+r*.35,r);g.addColorStop(0,'rgba(235,215,190,.55)');g.addColorStop(1,'rgba(235,215,190,0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,r*.85,0,7);c.fill();const s=Math.max(.6,r*.3);c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x-r*.4,y-r*.5,s,s)}
function umb(c){c.fillStyle='#121518';c.fillRect(165,252,22,80);c.fillRect(167,330,7,22);c.fillRect(179,330,7,22);
  c.beginPath();c.arc(175,252,66,Math.PI,0);for(let k=6;k>0;k--){const x0=109+22*k,x1=109+22*(k-1);c.quadraticCurveTo((x0+x1)/2,244,x1,252)}c.closePath();
  c.fillStyle=lg(c,110,190,240,250,[[0,'#8a4a3f'],[1,'#4e2724']]);c.fill();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;for(let k=0;k<=6;k++){c.beginPath();c.moveTo(175,187);c.quadraticCurveTo(175+(k-3)*12,215,109+22*k,252);c.stroke()}
  c.strokeStyle='#121518';c.lineWidth=2;c.beginPath();c.moveTo(175,187);c.lineTo(175,179);c.stroke()}

/* ---------- 여덟 장면 ---------- */
const SC=[
()=>{const tw=[],tf=c=>{c.translate(165,272);c.rotate(.45)};return{bg(c){const R=rng(12);   // 서리
  fillG(c,lg(c,0,0,0,H,[[0,'#d5dde2'],[.42,'#9fb0bb'],[1,'#536375']]));
  daubs(c,R,170,0,0,W,H,['222,231,237','150,168,182','92,110,128'],.16,24,9);blob(c,70,60,170,'236,241,244',.55);
  c.save();tf(c);c.beginPath();c.moveTo(0,-150);c.bezierCurveTo(92,-105,96,48,0,138);c.bezierCurveTo(-96,48,-92,-105,0,-150);
  c.fillStyle=lg(c,-80,-150,80,140,[[0,'#8c9b8e'],[.55,'#5f6e64'],[1,'#3c4943']]);c.fill();
  c.save();c.clip();daubs(c,R,110,-100,-150,200,290,['205,218,214','62,78,70'],.22,12,4);c.restore();

  tiltEl.style.transform=`rotateX(${(open?10:6)-py*a}deg) rotateY(${(front?-16:back?16:0)+px*a}deg)`}
function edges(){const r=(N-t)*D,l=t*D;eR.style.width=r+'px';eR.style.transform=`translateZ(${r}px) rotateY(90deg)`;eL.style.width=l+'px';eL.style.transform='rotateY(-90deg)';
  ['edgeRT','edgeRB'].forEach(id=>$(id).style.height=r+'px');['edgeLT','edgeLB'].forEach(id=>$(id).style.height=l+'px')}
function mark(lo,hi,ms){for(let i=lo;i<=hi;i++)active.add(i);pending++;
  setTimeout(()=>{if(--pending===0){active.clear();active.add(t)}},ms+60)}
function update(){const open=t>0&&t<N,ae=document.activeElement;
  document.body.classList.toggle('open',open);
  $('hitCover').hidden=open;$('hitL').hidden=$('hitR').hidden=!open;
  hint.hidden=open;hint.textContent=t===0?'펼치기':'앞표지로 뒤집기';
  prevB.hidden=nextB.hidden=ind.hidden=closeB.hidden=!open;
  nextB.textContent=t===N-1?'덮기 ›':'다음 ›';ind.textContent=t<N-1?`${t} / 8`:'마지막 장';
  live.textContent=t===0?'앞표지':t===N?'뒤표지':t<N-1?`${t}쪽, ${PAGES[t-1][0]}. ${PAGES[t-1][1]}`:'뒤표지 안쪽';
  book.style.transform=bookT();edges();applyTilt();
  if(ae&&ae!==document.body&&ae.hidden)(open?nextB:hint).focus()}
function go(n){if(busy)return;n=Math.max(0,Math.min(N,n));if(n===t)return;
  const from=t,dir=n>from?1:-1,lo=Math.min(from,n),hi=Math.max(from,n);let k=0;
  for(let i=dir>0?lo:hi-1;dir>0?i<hi:i>=lo;i+=dir){const L=leaves[i],dl=(RM?0:k*110)+'ms';
    L.style.transitionDelay=dl;L.style.setProperty('--dl',dl);L.classList.remove('turning');void L.offsetWidth;L.classList.add('turning');
    L.style.transform=leafT(i,dir>0);k++}
  t=n;mark(lo,hi,DUR+(k-1)*110);update()}
function flipOver(){if(busy||t!==N)return;busy=true;flipping=true;applyTilt();
  book.style.transform='translateX(150px) rotateY(180deg)';
  setTimeout(()=>{root.classList.add('snap');t=0;flipping=false;leaves.forEach((L,i)=>L.style.transform=leafT(i,false));
    active.clear();active.add(0);update();void book.offsetWidth;root.classList.remove('snap');busy=false},RM?0:1120)}
const next=()=>t===N?flipOver():go(t+1),prev=()=>{if(t>0)go(t-1)};

hint.onclick=()=>t===0?go(1):flipOver();
nextB.onclick=next;prevB.onclick=prev;closeB.onclick=()=>go(0);
$('hitCover').onclick=()=>t===0?go(1):flipOver();$('hitL').onclick=prev;$('hitR').onclick=next;
document.querySelectorAll('.hit').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()));
$('hitCover').addEventListener('pointerenter',()=>root.classList.add('shine'));
$('hitCover').addEventListener('pointerleave',()=>root.classList.remove('shine'));
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key==='Escape'&&t>0&&t<N)go(0)});
let raf=0;addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1;py=e.clientY/innerHeight*2-1;
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;applyTilt()})});
document.addEventListener('pointerleave',()=>{px=py=0;applyTilt()});
function fit(){const s=Math.max(.2,Math.min((innerWidth-20)/640,(innerHeight-66)/460,1.8));fitEl.style.transform=`scale(${s})`}
addEventListener('resize',fit);

root.classList.add('snap');leaves.forEach((L,i)=>L.style.transform=leafT(i,false));update();fit();
void book.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('snap')));
</script>
</body>
</html>
