<!doctype html>
<!-- meta: {"name":"고리 Tunnel","cat":"갤러리","desc":"동심원 고리들이 서로 다른 방향으로 돌며 사진 조각이 소용돌이처럼 빨려 들어가요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>고리 터널</title>
<style>
  :root{--ink:#1b1b1d;--mute:#8a8a90}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:#fff;color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  body.drag{cursor:grabbing}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;left:0;right:0;bottom:clamp(10px,3vh,24px);display:flex;justify-content:center;pointer-events:none}
  .pill{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 6px 20px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.05);font-size:13px;font-weight:500;letter-spacing:-.01em}
  .pill b{font-weight:700;font-feature-settings:"tnum";min-width:3.2em;text-align:right}
  .dot{width:7px;height:7px;border-radius:50%;background:#ff5a36;transition:background .3s}
  .dot.rev{background:#3b6cff}
  .title{position:fixed;left:clamp(12px,3vw,28px);top:clamp(10px,3vh,24px);font-size:13px;font-weight:600;color:var(--mute);letter-spacing:-.01em;pointer-events:none}
  .title strong{color:var(--ink);font-weight:700;margin-right:6px}
</style>
</head>
<body>
<canvas id="c" aria-label="사진 조각이 돌며 가운데로 빨려 드는 고리 터널"></canvas>
<p class="title"><strong>고리 터널</strong>스크롤하거나 끌어 보세요</p>
<div class="hud"><div class="pill"><span class="dot" id="dot"></span><span id="dir">빨려 들어가는 중</span><b id="spd">1.0×</b></div></div>
<script>
(() => {
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const dirEl = document.getElementById('dir'), spdEl = document.getElementById('spd'), dotEl = document.getElementById('dot');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1, maxR = 0;

  /* ---------- 가짜 사진 (그라디언트 아트) ---------- */
  const rnd = (a, b) => a + Math.random() * (b - a);
  const palettes = [
    ['#ffb36b', '#ff5f6d', '#3a1c71', '#ffd27f'],
    ['#9be7ff', '#2f80ed', '#0b2a5b', '#f6f7c6'],
    ['#c7f9cc', '#38a3a5', '#22577a', '#ffe66d'],
    ['#ffd1dc', '#f15bb5', '#4d194d', '#fee440'],
    ['#ffe0a3', '#e07a5f', '#3d405b', '#81b29a'],
    ['#e0c3fc', '#8ec5fc', '#5f3dc4', '#fff3bf'],
    ['#fff1d6', '#f4a261', '#264653', '#e9c46a'],
    ['#d0f4de', '#a9def9', '#1d3557', '#ff99c8']
  ];
  function makePhoto(p, kind) {
    const s = 320, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d');
    let gr = g.createLinearGradient(0, 0, 0, s);
    gr.addColorStop(0, p[0]); gr.addColorStop(.62, p[1]); gr.addColorStop(1, p[2]);
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    // 해 / 달
    const sx = rnd(.25, .75) * s, sy = rnd(.25, .5) * s, sr = rnd(.09, .16) * s;
    const sg = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 3);
    sg.addColorStop(0, p[3]); sg.addColorStop(.33, p[3]); sg.addColorStop(.34, 'rgba(255,255,255,.35)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.fillRect(0, 0, s, s);
    if (kind % 2 === 0) {
      // 겹치는 언덕
      for (let k = 0; k < 3; k++) {
        g.beginPath(); g.moveTo(0, s);
        const base = s * (.6 + k * .12), amp = s * rnd(.04, .1), fr = rnd(1.2, 3), ph = rnd(0, 6);
        for (let x = 0; x <= s; x += 8) g.lineTo(x, base + Math.sin(x / s * fr * Math.PI + ph) * amp);
        g.lineTo(s, s); g.closePath();
        g.fillStyle = p[2]; g.globalAlpha = .45 + k * .2; g.fill();
      }
      g.globalAlpha = 1;
    } else {
      // 흐릿한 빛망울
      for (let k = 0; k < 14; k++) {
        const x = rnd(0, s), y = rnd(0, s), r = rnd(.03, .12) * s;
        const bg = g.createRadialGradient(x, y, 0, x, y, r);
        bg.addColorStop(0, k % 2 ? p[3] : p[0]); bg.addColorStop(1, 'rgba(255,255,255,0)');
        g.globalAlpha = rnd(.35, .8); g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      }
      g.globalAlpha = 1;
    }
    // 필름 질감
    const img = g.getImageData(0, 0, s, s), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    return c;
  }
  const photos = palettes.map((p, i) => makePhoto(p, i));

  /* ---------- 고리 ---------- */
  const F = .8;          // 고리 하나 안쪽으로 갈 때 반지름 비율
  let rings = [], N = 0;
  function fillRing(r) {
    const n = 6 + Math.floor(Math.random() * 7);
    r.segs = [];
    const photoEvery = Math.random() < .5 ? 2 : 3;
    for (let i = 0; i < n; i++) {
      const isPhoto = (i % photoEvery === 0) !== (Math.random() < .15);
      r.segs.push(isPhoto ? photos[Math.floor(Math.random() * photos.length)] : null);
    }
    r.spin = (Math.random() < .5 ? -1 : 1) * rnd(.08, .45);
    r.ang = rnd(0, Math.PI * 2);
  }
  function build() {
    const need = Math.ceil(Math.log(3 / maxR) / Math.log(F)) + 2;
    if (need === N) return;
    const old = rings; rings = []; N = need;
    for (let i = 0; i < N; i++) {
      const r = old[i] || {}; r.pos = i; if (!old[i]) fillRing(r); rings.push(r);
    }
  }
  function resize() {
    DPR = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    maxR = Math.hypot(W, H) / 2 * 1.04;
    build();
  }
  addEventListener('resize', resize); resize();

  function wedge(cx, cy, r0, r1, a0, a1) {
    ctx.beginPath(); ctx.arc(cx, cy, r1, a0, a1); ctx.arc(cx, cy, r0, a1, a0, true); ctx.closePath();
  }
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    // 바깥 고리부터
    const sorted = rings.slice().sort((a, b) => a.pos - b.pos);
    for (const r of sorted) {
      const outer = maxR * Math.pow(F, r.pos);
      if (outer < 1.5) continue;
      const inner = outer * F, gapR = Math.max(.6, (outer - inner) * .06);
      const r1 = outer - gapR, r0 = inner + gapR;
      if (r0 > maxR * 1.2 || r1 <= r0) continue;
      const n = r.segs.length, step = Math.PI * 2 / n;
      const gapA = Math.min(step * .2, 3 / ((r0 + r1) / 2));
      const fade = Math.min(1, outer / 14);
      for (let i = 0; i < n; i++) {
        const a0 = r.ang + i * step + gapA / 2, a1 = r.ang + (i + 1) * step - gapA / 2;
        wedge(cx, cy, r0, r1, a0, a1);
        const img = r.segs[i];
        if (!img) {
          ctx.fillStyle = '#fff'; ctx.fill();
          ctx.strokeStyle = `rgba(20,20,30,${.08 * fade})`; ctx.lineWidth = 1; ctx.stroke();
          continue;
        }
        ctx.save(); ctx.clip();
        const mid = (a0 + a1) / 2, rm = (r0 + r1) / 2;
        const size = Math.max(r1 - r0, rm * (a1 - a0)) * 1.25;
        ctx.translate(cx + Math.cos(mid) * rm, cy + Math.sin(mid) * rm);
        ctx.rotate(mid + Math.PI / 2);
        ctx.globalAlpha = fade;
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        // 안쪽으로 갈수록 살짝 어둡게 — 깊이감
        const sh = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
        sh.addColorStop(0, 'rgba(255,255,255,.12)'); sh.addColorStop(1, 'rgba(0,0,0,.18)');
        ctx.fillStyle = sh; ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.restore();
      }
    }
    // 가운데 소실점
    const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(8, maxR * Math.pow(F, N - 3)));
    vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = vg; ctx.fillRect(cx - 60, cy - 60, 120, 120);
  }

  /* ---------- 속도 / 입력 ---------- */
  const BASE = reduce ? 0 : .32;   // 초당 고리 수
  let boost = 0, last = performance.now(), dragging = false, px = 0, py = 0, lastLabel = '';
  addEventListener('wheel', e => {
    e.preventDefault();
    boost += Math.max(-60, Math.min(60, e.deltaY)) * .012;
    boost = Math.max(-5, Math.min(6, boost));
  }, { passive: false });
  addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; document.body.classList.add('drag'); });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    boost += (dy + dx * .5) * .02;
    boost = Math.max(-5, Math.min(6, boost));
  });
  const up = () => { dragging = false; document.body.classList.remove('drag'); };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') boost = Math.min(6, boost + .8);
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') boost = Math.max(-5, boost - .8);
  });

  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    boost *= Math.pow(dragging ? .6 : .22, dt);
    const speed = BASE + boost;
    const spinMul = (reduce ? .15 : 1) * (1 + Math.abs(boost) * .5) * (speed < 0 ? -1 : 1);
    for (const r of rings) {
      r.pos += speed * dt;
      r.ang += r.spin * spinMul * dt;
      if (r.pos > N - 1) { r.pos -= N; fillRing(r); }       // 가운데로 사라지면 가장자리에 새로
      else if (r.pos < -1) { r.pos += N; fillRing(r); }      // 거꾸로 갈 때
    }
    draw();
    const mul = BASE ? speed / BASE : speed / .32;
    const label = (speed < -.01 ? '밀려 나오는 중' : Math.abs(speed) < .01 ? '멈춤' : '빨려 들어가는 중');
    if (label !== lastLabel) { dirEl.textContent = label; dotEl.classList.toggle('rev', speed < -.01); lastLabel = label; }
    spdEl.textContent = Math.abs(mul).toFixed(1) + '×';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
