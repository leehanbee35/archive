<!doctype html>
<!-- meta: {"name":"유리 Keycap","cat":"버튼","desc":"무지갯빛 유리 키캡이 천천히 돌다가 스크롤하면 빙글 돌아 옆면을 보여 줘요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>유리 키캡</title>
<style>
  :root{--bg:#050506;--ink:#f4f2f8;--mute:#77737f;--s:1;--h:0;--sh:50%}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{display:grid;place-items:center;background:radial-gradient(60% 55% at 50% 58%,#121117,var(--bg));
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);
    touch-action:none;user-select:none;-webkit-user-select:none}
  .stage{width:460px;height:440px;position:relative;transform:scale(var(--s));display:flex;flex-direction:column;align-items:center}
  .key{width:340px;height:360px;border:0;background:none;padding:0;cursor:grab;position:relative;border-radius:40px;
    -webkit-tap-highlight-color:transparent}
  .key:active{cursor:grabbing}
  .key:focus-visible{outline:1.5px solid rgba(220,200,255,.6);outline-offset:-10px}
  .persp{position:absolute;inset:0;perspective:900px;perspective-origin:50% 35%}
  .glow{position:absolute;left:50%;top:72%;width:300px;height:110px;margin:-55px 0 0 -150px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,150,220,.42),rgba(130,150,255,.22) 55%,transparent);
    filter:blur(18px);transition:opacity .3s}
  .cap{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .f{position:absolute;backface-visibility:visible}

  /* 윗면 */
  .top{width:160px;height:160px;left:-80px;top:-80px;border-radius:26px;
    transform:translateY(-40px) rotateX(90deg);
    background:radial-gradient(120% 90% at 30% 20%,#3a3842,#17161c 55%,#0b0b0e);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),inset 0 10px 18px rgba(255,255,255,.08),inset 0 -14px 22px rgba(0,0,0,.6);
    display:grid;place-items:center;overflow:hidden}
  .top::before{content:"";position:absolute;inset:14px;border-radius:18px;
    background:radial-gradient(80% 60% at 50% 40%,rgba(255,255,255,.07),transparent 70%);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.08)}
  .top::after{content:"";position:absolute;inset:-40%;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.16) 49%,transparent 56%);
    transform:translateX(calc(var(--sh) - 50%))}
  .label{position:relative;font-size:26px;font-weight:650;letter-spacing:-.03em;color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,.25)}

  /* 옆면: 아래가 넓은 사다리꼴 유리 */
  .side{width:200px;height:82.5px;left:-100px;top:-41.25px;
    clip-path:polygon(20px 0,180px 0,200px 100%,0 100%);
    background:
      linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 80%,rgba(255,255,255,.18)),
      linear-gradient(calc(100deg + var(--h) * 1deg),
        rgba(255,140,210,.55),rgba(170,150,255,.45) 30%,rgba(120,200,255,.5) 55%,rgba(220,170,255,.42) 78%,rgba(255,160,200,.5));
    background-size:100% 100%,300% 100%;
    background-position:0 0,calc(var(--h) * .4%) 0;
    opacity:.82}
  .side::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 38%,transparent 44%,transparent 62%,rgba(255,255,255,.25) 66%,transparent 70%);
    background-size:250% 100%;background-position:var(--sh) 0;mix-blend-mode:screen}
  .s0{transform:translateZ(90px) rotateX(14.04deg)}
  .s1{transform:rotateY(90deg) translateZ(90px) rotateX(14.04deg)}
  .s2{transform:rotateY(180deg) translateZ(90px) rotateX(14.04deg)}
  .s3{transform:rotateY(270deg) translateZ(90px) rotateX(14.04deg)}
  .s1,.s3{filter:hue-rotate(40deg)}
  .bottom{width:200px;height:200px;left:-100px;top:-100px;border-radius:14px;
    transform:translateY(40px) rotateX(90deg);
    background:radial-gradient(closest-side,rgba(255,170,230,.35),rgba(120,140,255,.18) 70%,rgba(255,255,255,.05));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .stem{width:46px;height:46px;left:-23px;top:-23px;border-radius:8px;transform:translateY(30px) rotateX(90deg);
    background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

  .hint{margin-top:6px;font-size:14px;color:var(--mute);letter-spacing:-.01em}
  .hint b{color:#cfc6e0;font-weight:600}
  @media (prefers-reduced-motion:reduce){.glow{transition:none}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <button class="key" id="key" aria-label="유리 키캡. 화살표 키로 돌리고 스페이스로 눌러요">
      <div class="glow" id="glow"></div>
      <div class="persp">
        <div class="cap" id="cap">
          <div class="f bottom"></div>
          <div class="f stem"></div>
          <div class="f side s0"></div>
          <div class="f side s1"></div>
          <div class="f side s2"></div>
          <div class="f side s3"></div>
          <div class="f top"><span class="label">스크롤</span></div>
        </div>
      </div>
    </button>
    <p class="hint"><b>스크롤</b>하거나 끌어서 돌려 보세요</p>
  </div>
<script>
(() => {
  const stage = document.getElementById('stage'), key = document.getElementById('key');
  const cap = document.getElementById('cap'), glow = document.getElementById('glow');
  const root = document.documentElement.style;
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = mq.matches; mq.addEventListener?.('change', e => reduce = e.matches);

  const fit = () => {
    const s = Math.min(innerWidth / 480, innerHeight / 460) * .96;
    stage.style.setProperty('--s', Math.max(.3, Math.min(2.2, s)).toFixed(3));
  };
  addEventListener('resize', fit); fit();

  // 상태: 목표 각도 → 스프링으로 따라감
  const st = { ry: -30, rx: -26, vy: 0, vx: 0, ty: -30, tx: -26, dip: 0, dv: 0, dt: 0 };
  let lastInput = -10, dragging = false, lx = 0, ly = 0, lastT = 0, flingV = 0;
  const now = () => performance.now() / 1000;
  const clampX = v => Math.max(-70, Math.min(-6, v));

  addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    st.ty += Math.max(-120, Math.min(120, d * (e.deltaMode ? 18 : .6)));
    lastInput = now();
  }, { passive: false });

  key.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY; lastT = performance.now(); flingV = 0;
    key.setPointerCapture?.(e.pointerId); st.dt = 1; lastInput = now();
  });
  key.addEventListener('pointermove', e => {
    if (!dragging) return;
    const s = parseFloat(stage.style.getPropertyValue('--s')) || 1;
    const dx = (e.clientX - lx) / s, dy = (e.clientY - ly) / s, t = performance.now();
    if (Math.hypot(dx, dy) > 1) st.dt = 0;          // 끄는 중엔 눌림 해제
    st.ty += dx * .6; st.tx = clampX(st.tx - dy * .35);
    flingV = dx * .6 / Math.max(8, t - lastT) * 16;
    lx = e.clientX; ly = e.clientY; lastT = t; lastInput = now();
  });
  const up = () => {
    if (!dragging) return; dragging = false; st.dt = 0;
    if (!reduce) st.ty += flingV * 14;               // 관성
    lastInput = now();
  };
  key.addEventListener('pointerup', up); key.addEventListener('pointercancel', up);

  key.addEventListener('keydown', e => {
    const m = { ArrowLeft: [-45, 0], ArrowRight: [45, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key];
    if (m) { e.preventDefault(); st.ty += m[0]; st.tx = clampX(st.tx + m[1]); lastInput = now(); }
    if ((e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); st.dt = 1; lastInput = now(); }
  });
  key.addEventListener('keyup', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); st.dt = 0; st.dv -= 2; }
  });
  key.addEventListener('blur', () => { st.dt = 0; dragging = false; });

  let prev = performance.now();
  function frame(ms) {
    const dt = Math.min(.033, (ms - prev) / 1000); prev = ms;
    const t = ms / 1000, idle = t - lastInput > 2.2 && !dragging;
    if (idle && !reduce) st.ty += dt * 14;           // 천천히 회전
    if (idle) st.tx += (-26 - st.tx) * dt * .8;

    if (reduce) {
      st.ry += (st.ty - st.ry) * Math.min(1, dt * 14); st.rx += (st.tx - st.rx) * Math.min(1, dt * 14);
      st.dip += (st.dt - st.dip) * Math.min(1, dt * 20);
    } else {
      const k = 70, c = 13;
      st.vy += (k * (st.ty - st.ry) - c * st.vy) * dt; st.ry += st.vy * dt;
      st.vx += (k * (st.tx - st.rx) - c * st.vx) * dt; st.rx += st.vx * dt;
      st.dv += (420 * (st.dt - st.dip) - 18 * st.dv) * dt; st.dip += st.dv * dt;
    }
    const float = reduce ? 0 : Math.sin(t * 1.3) * 7;
    const y = -10 + float + st.dip * 18;
    cap.style.transform =
      `translateY(${y}px) rotateX(${st.rx}deg) rotateY(${st.ry}deg) scale(${1 - st.dip * .03})`;
    glow.style.opacity = (.75 + st.dip * .25 - float * .02).toFixed(3);
    glow.style.transform = `scale(${1 - float * .012 + st.dip * .06})`;

    // 무지갯빛과 반사광을 각도에 맞춰 이동
    const a = ((st.ry % 360) + 360) % 360;
    root.setProperty('--h', a.toFixed(1));
    root.setProperty('--sh', (50 + Math.sin(st.ry * Math.PI / 180) * 60).toFixed(1) + '%');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
