<!doctype html>
<!-- meta: {"name":"점 지구 Globe","cat":"배경","desc":"수천 개의 점으로 된 지구가 천천히 돌고, 끌면 원하는 방향으로 돌려 볼 수 있어요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>점 지구</title>
<style>
  :root{--bg:#000;--ink:#eef3f8;--mute:#7d8794;--live:#5cf0a8}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  canvas:focus-visible{outline:1px solid rgba(255,255,255,.3);outline-offset:-6px}
  .live{position:fixed;left:clamp(12px,3vw,32px);bottom:clamp(12px,3vw,28px);display:flex;align-items:center;gap:9px;
    padding:8px 13px 8px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    font-size:clamp(11px,1.6vmin,14px);font-weight:550;letter-spacing:-.01em;font-feature-settings:"tnum";
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);pointer-events:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(92,240,168,.6);animation:ping 2s infinite}
  .live span:last-child{color:var(--mute);font-weight:450}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(92,240,168,.55)}80%,100%{box-shadow:0 0 0 8px rgba(92,240,168,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
  <canvas id="c" tabindex="0" role="img" aria-label="점으로 된 지구. 끌거나 화살표 키로 돌려요"></canvas>
  <div class="live"><i class="dot"></i><span>지금 접속 중 1,284명</span></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = mq.matches; mq.addEventListener?.('change', e => reduce = e.matches);

  // 아주 거친 대륙 윤곽 (경도, 위도)
  const LAND = [
    [[-168,66],[-156,71],[-130,70],[-100,72],[-80,72],[-64,60],[-56,52],[-66,44],[-76,36],[-81,31],[-80,26],[-82,30],[-90,30],[-97,27],[-97,21],[-92,18],[-87,21],[-88,16],[-83,10],[-78,8],[-80,9],[-86,13],[-92,15],[-105,20],[-110,24],[-112,30],[-118,33],[-124,40],[-124,48],[-133,56],[-146,60],[-160,58],[-166,62]],
    [[-55,60],[-44,60],[-20,70],[-18,80],[-40,83],[-62,81],[-70,77],[-55,70]],
    [[-80,9],[-72,12],[-62,10],[-50,0],[-35,-5],[-38,-13],[-40,-22],[-48,-26],[-58,-36],[-65,-42],[-68,-52],[-74,-52],[-73,-40],[-71,-30],[-70,-18],[-76,-14],[-81,-5],[-80,1],[-78,8]],
    [[-10,36],[-9,43],[-2,44],[-4,48],[2,51],[8,54],[10,58],[5,62],[14,68],[25,71],[40,68],[60,70],[70,73],[80,73],[100,77],[115,74],[140,72],[160,70],[180,69],[180,65],[170,60],[160,58],[156,51],[142,47],[140,40],[130,42],[127,38],[122,40],[120,32],[122,30],[117,24],[110,21],[108,16],[105,9],[100,13],[100,4],[104,1],[98,8],[97,16],[92,22],[88,22],[80,15],[78,8],[73,18],[68,23],[60,25],[57,26],[56,23],[59,22],[52,16],[45,13],[43,15],[35,28],[33,31],[35,36],[30,36],[27,37],[26,40],[20,40],[15,38],[18,40],[12,44],[8,44],[3,43],[-1,37],[-6,36]],
    [[-17,21],[-16,28],[-10,30],[-6,36],[10,37],[11,33],[20,31],[32,31],[35,28],[43,12],[51,12],[42,-1],[40,-10],[40,-16],[35,-24],[32,-29],[26,-34],[19,-35],[17,-29],[12,-17],[13,-8],[9,-1],[9,4],[5,6],[-8,4],[-13,8],[-17,14]],
    [[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-26],[150,-37],[141,-38],[135,-35],[129,-32],[115,-34]],
    [[109,2],[117,7],[119,1],[116,-4],[110,-3]],
    [[95,5],[98,3],[106,-6],[114,-8],[114,-7],[105,-4],[100,0]],
    [[131,-1],[141,-3],[150,-10],[141,-9],[137,-5]],
    [[130,31],[135,34],[140,36],[142,40],[141,45],[145,44],[140,42],[139,38],[136,36],[131,34]],
    [[-6,50],[1,51],[0,53],[-3,56],[-2,58],[-5,59],[-6,56],[-4,53]],
    [[44,-25],[47,-25],[50,-15],[49,-12],[44,-17]],
    [[172,-34],[178,-38],[174,-41],[167,-46],[171,-41]],
    [[-24,64],[-14,64],[-14,66],[-22,66.5]],
    [[120,22],[122,25],[121,25]]
  ];
  const inPoly = (x, y, p) => {
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
      const [xi, yi] = p[i], [xj, yj] = p[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };
  const isLand = (lon, lat) => lat < -71 || LAND.some(p => inPoly(lon, lat, p));

  // 피보나치 구 위에 점 배치 — 육지는 모두, 바다는 일부만
  const pts = [];
  const N = 7200, GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i + .5) / N * 2, r = Math.sqrt(1 - y * y), th = GA * i;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    const lat = Math.asin(y) * 180 / Math.PI, lon = Math.atan2(x, z) * 180 / Math.PI;
    const land = isLand(lon, lat);
    if (land || i % 3 === 0) pts.push(x, y, z, land ? 1 : 0);
  }
  const P = new Float32Array(pts), COUNT = P.length / 4;

  const fromLL = (lon, lat) => {
    const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
  };
  const CITIES = [[126.98, 37.57], [139.7, 35.7], [-74, 40.7], [-0.1, 51.5], [2.35, 48.86], [-46.6, -23.5],
    [151.2, -33.9], [103.8, 1.35], [77.2, 28.6], [-122.4, 37.8], [31.2, 30], [18.4, -33.9]].map((c, i) => ({ p: fromLL(...c), ph: i * .73 }));

  let W = 0, H = 0, dpr = 1;
  const resize = () => {
    dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  addEventListener('resize', resize); resize();

  let yaw = -2.2, pitch = .35, vy = 0, vp = 0, drag = false, lx = 0, ly = 0, lastInput = -10;
  cv.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; vy = vp = 0; cv.setPointerCapture?.(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const R = Math.min(W, H) * .38, dx = (e.clientX - lx) / R, dy = (e.clientY - ly) / R;
    yaw += dx; pitch = Math.max(-1.3, Math.min(1.3, pitch + dy));
    vy = dx * 60; vp = dy * 60; lx = e.clientX; ly = e.clientY; lastInput = performance.now();
  });
  const end = () => { drag = false; lastInput = performance.now(); if (reduce) vy = vp = 0; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('keydown', e => {
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!m) return; e.preventDefault();
    vy += m[0] * 1.6; vp += m[1] * 1.2; lastInput = performance.now();
    if (reduce) { yaw += m[0] * .3; pitch = Math.max(-1.3, Math.min(1.3, pitch + m[1] * .2)); vy = vp = 0; }
  });

  let prev = performance.now();
  function frame(ms) {
    const dt = Math.min(.033, (ms - prev) / 1000); prev = ms;
    if (!drag) {
      yaw += vy * dt; pitch = Math.max(-1.3, Math.min(1.3, pitch + vp * dt));
      const f = Math.exp(-dt * 2.2); vy *= f; vp *= f;
      if (!reduce && ms - lastInput > 1500) { yaw += dt * .12; pitch += (.35 - pitch) * dt * .3; }
    }
    draw(ms / 1000);
    requestAnimationFrame(frame);
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const R = Math.min(W, H) * .38, cx = W / 2, cy = H / 2 - Math.min(W, H) * .02;
    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const rot = (x, y, z) => {
      const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
      return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
    };

    // 대기 빛
    const g = ctx.createRadialGradient(cx, cy, R * .85, cx, cy, R * 1.35);
    g.addColorStop(0, 'rgba(80,140,255,.12)'); g.addColorStop(1, 'rgba(80,140,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const core = ctx.createRadialGradient(cx - R * .3, cy - R * .35, 0, cx, cy, R);
    core.addColorStop(0, 'rgba(40,70,130,.22)'); core.addColorStop(1, 'rgba(10,20,40,.05)');
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    const s = Math.max(1, R / 220);
    for (let i = 0; i < COUNT; i++) {
      const o = i * 4, land = P[o + 3];
      const [x, y, z] = rot(P[o], P[o + 1], P[o + 2]);
      const persp = 1 + z * .08, X = cx + x * R * persp, Y = cy - y * R * persp;
      // 빛은 왼쪽 위에서
      const light = Math.max(0, x * -.35 + y * .4 + z * .85);
      if (z < 0) {
        const a = (land ? .1 : .04) * (1 + z * .6);
        if (a <= .01) continue;
        ctx.fillStyle = `rgba(120,160,220,${a})`;
        ctx.fillRect(X, Y, s, s);
        continue;
      }
      if (land) {
        const a = .35 + light * .65;
        ctx.fillStyle = `rgba(${170 + light * 85 | 0},${210 + light * 45 | 0},255,${a})`;
        const sz = s * (1.2 + z * .9);
        ctx.fillRect(X - sz / 2, Y - sz / 2, sz, sz);
      } else {
        ctx.fillStyle = `rgba(70,110,180,${.12 + light * .25})`;
        ctx.fillRect(X - s / 2, Y - s / 2, s, s);
      }
    }

    // 도시 빛
    for (const c of CITIES) {
      const [x, y, z] = rot(...c.p);
      if (z < .05) continue;
      const persp = 1 + z * .08, X = cx + x * R * persp, Y = cy - y * R * persp;
      const fade = Math.min(1, (z - .05) * 4);
      const ph = reduce ? .5 : ((t * .5 + c.ph) % 1);
      ctx.strokeStyle = `rgba(92,240,168,${(1 - ph) * .7 * fade})`; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(X, Y, 3 + ph * 14 * s, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(160,255,210,${fade})`;
      ctx.shadowColor = 'rgba(92,240,168,.9)'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(X, Y, 2.4 * s, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 테두리 림라이트
    ctx.strokeStyle = 'rgba(140,180,255,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.005, 0, Math.PI * 2); ctx.stroke();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
