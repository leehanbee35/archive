<!doctype html>
<!-- meta: {"name":"유리 Buttons","cat":"버튼","desc":"어두운 바탕 위에 빛을 굴절시키는 유리 질감 버튼들. 마우스를 따라 반사광이 움직여요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>유리 버튼 세트</title>
<style>
  @property --mx{syntax:"<length-percentage>";inherits:true;initial-value:50%}
  @property --my{syntax:"<length-percentage>";inherits:true;initial-value:0%}
  :root{--ease:cubic-bezier(.3,.7,.2,1);--s:1}
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{display:grid;place-items:center;min-height:100vh;padding:16px;overflow:hidden;
    background:radial-gradient(rgba(255,255,255,.085) 1px,transparent 1.4px) 0 0/22px 22px,#060607;
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;color:#fff}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(75% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.75))}

  /* 유리 뒤에서 굴절될 은은한 빛 */
  .glow{position:fixed;width:44vmax;height:44vmax;border-radius:50%;filter:blur(70px);pointer-events:none;
    animation:drift 18s ease-in-out infinite alternate}
  .g1{left:calc(50% - 34vmax);top:calc(50% - 30vmax);background:#3a44a8;opacity:.42}
  .g2{left:calc(50% - 6vmax);top:calc(50% - 10vmax);background:#a0482a;opacity:.2;animation-delay:-9s}
  @keyframes drift{to{transform:translate(8vmax,5vmax) scale(1.1)}}

  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:calc(26px * var(--s))}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(14px * var(--s))}
  .note{font-size:13px;color:rgba(255,255,255,.42);letter-spacing:-.01em;min-height:1.4em}

  .glass{--tint:255,255,255;--a1:.17;--a2:.035;--rim:255,255,255;
    position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;
    height:calc(50px * var(--s));padding:0 calc(24px * var(--s));
    border:0;border-radius:999px;cursor:pointer;white-space:nowrap;
    color:rgba(255,255,255,.95);font:inherit;font-size:calc(16px * var(--s));font-weight:600;letter-spacing:-.02em;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
    background:
      radial-gradient(70% 55% at 50% 115%,rgba(var(--rim),.2),transparent 70%),
      linear-gradient(180deg,rgba(var(--tint),var(--a1)),rgba(var(--tint),var(--a2)) 55%,rgba(var(--tint),calc(var(--a2) + .06)));
    -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -10px 18px -8px rgba(0,0,0,.5),
      inset 0 0 0 1px rgba(255,255,255,.07),
      0 1px 1px rgba(0,0,0,.6),
      0 16px 32px -10px rgba(0,0,0,.8);
    transition:transform .3s var(--ease),box-shadow .3s var(--ease),--mx .18s ease-out,--my .18s ease-out;
    -webkit-tap-highlight-color:transparent}
  /* 테두리 반사(림) */
  .glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(165deg,rgba(var(--rim),.65),rgba(var(--rim),.08) 32%,rgba(var(--rim),0) 58%,rgba(var(--rim),.28));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
    opacity:.7;transition:opacity .3s}
  /* 포인터를 따라가는 반사광 */
  .glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
    background:radial-gradient(150px 90px at var(--mx) var(--my),rgba(255,255,255,.34),rgba(255,255,255,.08) 42%,transparent 72%);
    mix-blend-mode:screen;opacity:.5;transition:opacity .3s}
  .glass .ic{opacity:.8;font-weight:500;transition:transform .3s var(--ease)}

  .glass:not(:disabled):hover{transform:translateY(-2px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -10px 18px -8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12),
      0 1px 1px rgba(0,0,0,.6),0 22px 40px -12px rgba(0,0,0,.85)}
  .glass:not(:disabled):hover::before{opacity:1}
  .glass:not(:disabled):hover::after{opacity:1}
  .glass:not(:disabled):hover .ic{transform:translateX(2px)}
  .glass:not(:disabled):active{transform:translateY(0) scale(.965);transition-duration:.12s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 4px 12px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.1),0 1px 1px rgba(0,0,0,.6),0 8px 18px -8px rgba(0,0,0,.8)}
  .glass:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:4px}

  .lg{height:calc(66px * var(--s));padding:0 calc(34px * var(--s));font-size:calc(19px * var(--s));--a1:.2}
  .lg .ic{font-size:1.25em;line-height:1;margin-top:-.1em}
  .frost{--tint:205,208,218;--a1:.26;--a2:.11;-webkit-backdrop-filter:blur(24px) saturate(120%);backdrop-filter:blur(24px) saturate(120%)}
  .tint{--tint:58,68,168;--a1:.78;--a2:.42;--rim:178,188,255;color:#eef0ff}
  .glass:disabled{cursor:not-allowed;opacity:.36;filter:saturate(.3)}
  .glass:disabled::after{display:none}

  @media (max-width:480px),(max-height:300px){:root{--s:.84}.glass{padding:0 calc(18px * var(--s))}.lg{padding:0 calc(28px * var(--s))}}
  @media (max-height:260px){.note{display:none}}
  @media (prefers-reduced-motion:reduce){
    .glow{animation:none}
    .glass,.glass::before,.glass::after,.glass .ic{transition-duration:1ms!important}
    .glass:not(:disabled):hover,.glass:not(:disabled):active{transform:none}
  }
</style>
</head>
<body>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>
  <main class="wrap">
    <button class="glass lg" data-name="시작하기">시작하기 <span class="ic" aria-hidden="true">›</span></button>
    <div class="row">
      <button class="glass frost" data-name="반투명">반투명 <span class="ic" aria-hidden="true">→</span></button>
      <button class="glass tint" data-name="색 유리"><span class="ic" aria-hidden="true">+</span> 색 유리</button>
      <button class="glass" disabled>사용 안 함 <span class="ic" aria-hidden="true">›</span></button>
    </div>
    <p class="note" id="note" aria-live="polite">버튼 위에서 마우스를 움직여 보세요</p>
  </main>
<script>
  const note = document.getElementById('note');
  document.querySelectorAll('.glass').forEach(b => {
    // 반사광 위치를 포인터 좌표로 (CSS 변수)
    b.addEventListener('pointermove', e => {
      if (b.disabled) return;
      const r = b.getBoundingClientRect();
      b.style.setProperty('--mx', (e.clientX - r.left).toFixed(1) + 'px');
      b.style.setProperty('--my', (e.clientY - r.top).toFixed(1) + 'px');
    });
    b.addEventListener('pointerleave', () => { b.style.removeProperty('--mx'); b.style.removeProperty('--my'); });
    b.addEventListener('click', () => { if (!b.disabled) note.textContent = `‘${b.dataset.name}’ 버튼을 눌렀어요`; });
  });
</script>
</body>
</html>
