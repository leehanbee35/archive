<!doctype html>
<!-- meta: {"name":"아치 Gallery","cat":"갤러리","desc":"세로 사진 카드가 완만한 아치를 그리며 늘어서고, 끌거나 휠을 굴리면 관성으로 미끄러지는 갤러리","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>아치 갤러리</title>
<style>
  :root{--ink:#f2eee8;--mute:#7d7870}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:#000;color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none}
  .stage{position:fixed;inset:0;cursor:grab;touch-action:none;outline:none}
  .stage.drag{cursor:grabbing}
  .ring{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
  .card{position:absolute;left:0;top:0;transform-style:preserve-3d}
  .inner{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#111;
    box-shadow:0 24px 50px rgba(0,0,0,.65);
    transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
  .card:hover .inner{transform:translateY(-4%);box-shadow:0 40px 70px rgba(0,0,0,.8)}
  .stage.drag .card:hover .inner{transform:none}
  .inner svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .inner::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(0,0,0,.5),transparent 34%)}
  .cap{position:absolute;left:8%;bottom:5%;z-index:1;color:#fff;
    font-size:clamp(10px,calc(1.1vmin + 4px),15px);font-weight:600;letter-spacing:-.01em}
  .dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:2;opacity:0}
  .ui{position:fixed;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 clamp(14px,3vw,32px);font-size:12px;color:var(--mute);pointer-events:none;letter-spacing:.02em}
  .top{top:clamp(12px,3vh,26px)} .bot{bottom:clamp(12px,3vh,26px)}
  .top b{color:var(--ink);font-weight:600}
  .num{font-variant-numeric:tabular-nums;color:var(--ink)}
  @media (max-height:320px){.top{display:none}}
  @media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" aria-label="사진 갤러리, 좌우 화살표로 넘겨 보기">
  <div class="ring" id="ring"></div>
</div>
<div class="ui top"><b>아치 갤러리</b><span>여름 컬렉션</span></div>
<div class="ui bot"><span>끌기 · 휠 · ← →</span><span class="num" id="num">01 / 12</span></div>
<script>
const PAL=[
  ['#f6c28b','#e86f51','#ffe3a3','#7a3b3f','#3d2333'],
  ['#a8d8e8','#4f8fbf','#fff4d6','#2f5d7c','#173247'],
  ['#f3e1c7','#d9a27a','#fffaf0','#8a5a44','#4a2f27'],
  ['#c9e4c5','#6fa68a','#f7f3d0','#2f5e4a','#183a2e'],
  ['#e9c6e0','#9a6fb0','#ffe9f3','#4b3670','#251a3d'],
  ['#ffd9a0','#f29e4c','#fff2cf','#b4532a','#5c2a1c'],
  ['#cfd8dc','#7d8e99','#f5f5f0','#3f4c56','#1f272e'],
  ['#9fd3c7','#3e8e9e','#e8fff7','#1f5866','#0e2f38']];
let artN=0;
function art(seed,kind,w=300,h=400){
  let s=seed*7919+13;const r=()=>((s=(s*16807)%2147483647)/2147483647);
  const p=PAL[seed%PAL.length],u='g'+(++artN);
  const lin=(id,a,b)=>`<linearGradient id="${u}${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  const rad=(id,a,b)=>`<radialGradient id="${u}${id}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
  let d='',b='';
  if(kind==='hills'){const y=h*(.56+r()*.1);d=lin('s',p[0],p[1]);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}s)"/><circle cx="${w*(.3+r()*.4)}" cy="${y-h*.13}" r="${w*.16}" fill="${p[2]}" opacity=".92"/>
    <path d="M0 ${y}Q${w*.35} ${y-h*.15} ${w*.7} ${y-h*.02}T${w} ${y-h*.06}V${h}H0Z" fill="${p[3]}"/>
    <path d="M0 ${y+h*.13}Q${w*.5} ${y+h*.02} ${w} ${y+h*.15}V${h}H0Z" fill="${p[4]}"/>`}
  else if(kind==='sea'){const y=h*.52;d=lin('s',p[1],p[0])+lin('w',p[3],p[4]);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}s)"/><circle cx="${w*(.35+r()*.3)}" cy="${y-h*.06}" r="${w*.13}" fill="${p[2]}"/><rect y="${y}" width="${w}" height="${h-y}" fill="url(#${u}w)"/>`;
    for(let k=0;k<7;k++){const yk=y+8+k*k*5.5;b+=`<path d="M0 ${yk}q${w/8} -5 ${w/4} 0t${w/4} 0t${w/4} 0t${w/4} 0" stroke="${p[2]}" stroke-opacity="${.35-k*.035}" stroke-width="2" fill="none"/>`}}
  else if(kind==='portrait'){d=rad('b',p[0],p[1]);const cx=w*(.42+r()*.16);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/><circle cx="${cx}" cy="${h*.42}" r="${w*.19}" fill="${p[4]}"/>
    <path d="M${cx-w*.42} ${h}C${cx-w*.4} ${h*.72} ${cx-w*.2} ${h*.62} ${cx} ${h*.62}S${cx+w*.4} ${h*.72} ${cx+w*.42} ${h}Z" fill="${p[4]}"/>
    <circle cx="${cx-3}" cy="${h*.42-2}" r="${w*.19}" fill="none" stroke="${p[2]}" stroke-opacity=".35" stroke-width="3"/>`}
  else if(kind==='plant'){d=lin('b',p[2],p[0]);const cx=w/2;
    b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/><ellipse cx="${cx}" cy="${h*.91}" rx="${w*.3}" ry="${h*.03}" fill="${p[4]}" opacity=".25"/>`;
    for(let k=0;k<8;k++)b+=`<ellipse cx="${cx}" cy="${h*.42}" rx="${w*.07}" ry="${h*.2}" fill="${k%2?p[3]:p[4]}" transform="rotate(${-63+k*18+r()*8} ${cx} ${h*.66})"/>`;
    b+=`<path d="M${w*.32} ${h*.65}H${w*.68}L${w*.62} ${h*.9}H${w*.38}Z" fill="${p[1]}"/>`}
  else if(kind==='pool'){d=lin('b',p[1],p[3]);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/>`;
    for(let k=0;k<9;k++){const yk=h*.1+k*h*.1;b+=`<path d="M0 ${yk}c${w*.15} ${-12+r()*24} ${w*.3} ${12} ${w*.5} 0s${w*.35} ${-10} ${w*.5} 4" stroke="${p[2]}" stroke-opacity=".38" stroke-width="${2+r()*2}" fill="none"/>`}
    b+=`<rect width="${w}" height="${h*.14}" fill="${p[2]}" opacity=".9"/><path d="M0 ${h*.14}H${w}L${w*.6} ${h*.32}H0Z" fill="${p[4]}" opacity=".25"/>`}
  else{d=rad('b',p[3],p[4]);b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/>`;
    for(let k=0;k<3;k++)b+=`<circle cx="${w*(.25+r()*.5)}" cy="${h*(.25+r()*.5)}" r="${w*(.18+r()*.2)}" fill="${p[k]}" opacity=".75" style="mix-blend-mode:screen"/>`}
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${d}</defs>${b}</svg>`;
}

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const items=[['여름 코트','portrait'],['수영장 오후','pool'],['늦은 초상','portrait'],['언덕 너머','hills'],
  ['창가의 잎','plant'],['물결 일기','sea'],['빛의 방','orbs'],['저녁 산책','hills'],
  ['푸른 정원','plant'],['바닷바람','sea'],['둥근 오후','orbs'],['주말 수영','pool']];
const N=items.length,stage=document.getElementById('stage'),ring=document.getElementById('ring'),num=document.getElementById('num');
const cards=items.map(([t,k],i)=>{
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="inner">${art(i+3,k)}<span class="cap">${t}</span><div class="dim"></div></div>`;
  ring.appendChild(el);return {el,dim:el.querySelector('.dim')};
});

let W,H,R,step,gap;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  H=Math.min(vh*.64,vw*.5);W=H*.75;gap=W*1.12;R=Math.max(W*3.2,vw*.85);step=gap/R;
  stage.style.perspective=Math.round(R*1.2)+'px';
  for(const c of cards)Object.assign(c.el.style,{width:W+'px',height:H+'px',marginLeft:-W/2+'px',marginTop:-H/2+'px'});
}
const wrap=d=>{d=((d%N)+N)%N;return d>N/2?d-N:d};
const clamp=(v,a)=>Math.max(-a,Math.min(a,v));

let pos=0,vel=0,target=null,drag=null,lastInput=-1e9,prev=performance.now();
function render(){
  const half=innerWidth/2;
  for(let i=0;i<N;i++){
    const c=cards[i],d=wrap(i-pos),a=d*step,ad=Math.abs(d);
    const x=R*Math.sin(a),z=-(R-R*Math.cos(a))*.9-ad*W*.05,s=1+.12*Math.max(0,1-ad);
    c.el.style.transform=`translate3d(${x.toFixed(1)}px,0,${z.toFixed(1)}px) rotateY(${(-a*.85).toFixed(4)}rad) scale(${s.toFixed(3)})`;
    c.dim.style.opacity=Math.min(.75,ad*.14).toFixed(3);
    c.el.style.visibility=(Math.abs(a)>1.45||Math.abs(x)-W*.7>half)?'hidden':'visible';
  }
  const cur=((Math.round(pos)%N)+N)%N;
  num.textContent=String(cur+1).padStart(2,'0')+' / '+N;
}
function tick(now){
  const dt=Math.min(3,(now-prev)/16.67);prev=now;
  if(drag){}
  else if(target!==null){
    pos+=(target-pos)*Math.min(1,(reduce?1:.14)*dt);
    if(Math.abs(target-pos)<.0008){pos=target;target=null}
  }else{
    pos+=vel*dt;vel*=Math.pow(reduce?.6:.94,dt);if(Math.abs(vel)<.0004)vel=0;
    const idle=now-lastInput>2600;
    if(idle&&!reduce)pos+=.0022*dt;
    else if(Math.abs(vel)<.01)pos+=(Math.round(pos)-pos)*Math.min(1,.08*dt);
  }
  render();requestAnimationFrame(tick);
}

stage.addEventListener('pointerdown',e=>{
  if(e.button)return;
  drag={x:e.clientX,lx:e.clientX,lt:e.timeStamp,p:pos,moved:0,card:e.target.closest('.card')};
  vel=0;target=null;lastInput=performance.now();
  stage.setPointerCapture(e.pointerId);stage.classList.add('drag');
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));
  pos=drag.p-dx/gap;
  const dt=Math.max(1,e.timeStamp-drag.lt);
  vel=clamp(vel*.3+(-(e.clientX-drag.lx)/gap)/(dt/16.67)*.7,.5);
  drag.lx=e.clientX;drag.lt=e.timeStamp;lastInput=performance.now();
});
function endDrag(e){
  if(!drag)return;
  stage.classList.remove('drag');
  if(drag.moved<6){vel=0;
    if(drag.card){const i=cards.findIndex(c=>c.el===drag.card);if(i>=0)target=Math.round(pos+wrap(i-pos))}}
  else if(reduce||e.timeStamp-drag.lt>90)vel=0;
  drag=null;lastInput=performance.now();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{
  e.preventDefault();target=null;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  vel=clamp(vel+d*(e.deltaMode?.02:.0007),.5);lastInput=performance.now();
},{passive:false});
addEventListener('keydown',e=>{
  let n=0;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')n=1;
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=-1;
  if(!n)return;
  e.preventDefault();vel=0;target=Math.round(target??pos)+n;lastInput=performance.now();
});
addEventListener('resize',layout);
layout();render();requestAnimationFrame(tick);
</script>
</body>
</html>
