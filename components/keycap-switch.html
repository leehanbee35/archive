<!doctype html>
<!-- meta: {"name":"픽셀 달 키캡","cat":"스위치","desc":"두툼한 키캡을 누르면 픽셀 달이 흩어져 해로 다시 모이며 배경이 밝아져요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>픽셀 달 키캡</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:grid;place-items:center;overflow:hidden;background:#14161c;color:#6f7786;
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    transition:background-color .8s ease,color .8s ease}
  body.day{background:#6b6b6b;color:#e9e9e9}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:26px}

  .slot{position:relative;width:216px;height:112px;border-radius:28px;cursor:pointer;outline:none;
    background:#0b0c10;-webkit-tap-highlight-color:transparent;
    box-shadow:inset 0 5px 12px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.06);
    transition:background-color .8s ease,box-shadow .8s ease}
  body.day .slot{background:#4e4e50;
    box-shadow:inset 0 5px 12px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.18)}
  .slot:focus-visible{outline:2px solid #5fe9ff;outline-offset:5px}
  body.day .slot:focus-visible{outline-color:#fff4dc}

  .key{position:absolute;left:10px;top:10px;width:92px;height:92px;border-radius:18px;will-change:transform;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),
      linear-gradient(160deg,#6e7b8d,#4b5564 55%,#3a424e);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 3px rgba(0,0,0,.3),0 5px 0 #242932,0 10px 18px rgba(0,0,0,.6);
    transition:box-shadow .12s ease}
  .key.down{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 2px rgba(0,0,0,.35),0 1px 0 #242932,0 3px 6px rgba(0,0,0,.7)}
  .face{position:absolute;inset:7px 8px 12px;border-radius:13px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#647083,#4c5667);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.22),inset 0 -3px 5px rgba(0,0,0,.25)}
  .under{position:absolute;left:16px;right:16px;bottom:3px;height:3px;border-radius:3px;background:#7ff7ff;
    box-shadow:0 0 6px #3fe6ff,0 0 16px 2px rgba(63,230,255,.65),0 8px 22px 6px rgba(63,230,255,.3);
    transition:background-color .7s ease,box-shadow .7s ease}
  body.day .under{background:#fff6e4;
    box-shadow:0 0 6px #ffe9c4,0 0 16px 2px rgba(255,236,200,.7),0 8px 22px 6px rgba(255,230,190,.35)}
  canvas{position:absolute;left:-70px;top:-70px;pointer-events:none}

  .cap{font-size:14px;font-weight:500;letter-spacing:-.01em;user-select:none}
  .cap b{font-weight:700;color:#bfe9f2;transition:color .8s}
  body.day .cap b{color:#fff3d6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="slot" id="slot" role="switch" aria-checked="false" tabindex="0" aria-label="낮 모드">
      <div class="key" id="key"><span class="face"></span><span class="under"></span></div>
      <canvas id="cv" aria-hidden="true"></canvas>
    </div>
    <p class="cap" aria-live="polite">지금은 <b id="word">밤</b>이에요 · 키를 눌러 보세요</p>
  </div>
<script>
  const slot = document.getElementById('slot'), key = document.getElementById('key'),
        cv = document.getElementById('cv'), ctx = cv.getContext('2d'), word = document.getElementById('word');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const PAD = 70, SW = 216, SH = 112, KS = 92, TRAVEL = SW - 20 - KS, N = 13, CELL = 5, DOT = 4;
  const W = SW + PAD * 2, H = SH + PAD * 2;

  function sizeCanvas() {
    const d = window.devicePixelRatio || 1;
    cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }

  // 도트 패턴 (키 중심 기준 좌표, 색)
  function pattern(test) {
    const out = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const col = test(c, r);
      if (col) out.push({ x: (c - 6) * CELL, y: (r - 6) * CELL, col });
    }
    return out;
  }
  const MOON = pattern((c, r) => {
    if (Math.hypot(c - 6, r - 6.4) <= 5.4 && Math.hypot(c - 8.7, r - 4.3) > 4.4) return [214, 236, 255];
    const sp = [[11, 1], [10, 1], [12, 1], [11, 0], [11, 2], [12, 5]];
    if (sp.some(([a, b]) => a === c && b === r)) return [150, 245, 255];
    return null;
  });
  const SUN = pattern((c, r) => {
    const d = Math.hypot(c - 6, r - 6);
    if (d <= 3.3) return d < 1.6 ? [255, 240, 170] : [255, 207, 72];
    const rays = [[6, 0], [6, 1], [6, 11], [6, 12], [0, 6], [1, 6], [11, 6], [12, 6], [2, 2], [3, 3], [10, 2], [9, 3], [2, 10], [3, 9], [10, 10], [9, 9]];
    if (rays.some(([a, b]) => a === c && b === r)) return [255, 168, 46];
    return null;
  });

  let on = false, busy = false, kx = 0, ky = 0, parts = null;

  function keyCenter() { return { x: PAD + 10 + kx + KS / 2, y: PAD + 10 + ky + KS / 2 - 3 }; }
  function placeKey() { key.style.transform = `translate(${kx}px,${ky}px)`; }

  function drawDots(list) {
    ctx.clearRect(0, 0, W, H);
    for (const p of list) {
      if (p.a <= .01) continue;
      const [r, g, b] = p.col;
      ctx.globalAlpha = p.a;
      ctx.shadowColor = `rgba(${r},${g},${b},.75)`; ctx.shadowBlur = 5;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const s = p.s || DOT;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }
  function drawStatic() {
    const c = keyCenter();
    drawDots((on ? SUN : MOON).map(d => ({ x: c.x + d.x, y: c.y + d.y, col: d.col, a: 1 })));
  }

  const ease = q => q < .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;
  const lerp = (a, b, q) => a + (b - a) * q;

  function toggle() {
    if (busy) return;
    on = !on;
    slot.setAttribute('aria-checked', String(on));
    word.textContent = on ? '낮' : '밤';
    if (reduce.matches) {
      kx = on ? TRAVEL : 0; ky = 0; placeKey();
      document.body.classList.toggle('day', on); drawStatic(); return;
    }
    busy = true;
    const from = on ? MOON : SUN, to = on ? SUN : MOON, n = Math.max(from.length, to.length);
    parts = Array.from({ length: n }, (_, i) => {
      const a = from[i % from.length], b = to[i % to.length], ang = Math.random() * Math.PI * 2, dist = 55 + Math.random() * 60;
      return { a, b, aA: i < from.length ? 1 : 0, aB: i < to.length ? 1 : 0,
               cx: Math.cos(ang) * dist, cy: Math.sin(ang) * dist * .8, delay: Math.random() * 180, spin: Math.random() };
    });
    const x0 = kx, x1 = on ? TRAVEL : 0, start = performance.now(), D = 1250;
    let flipped = false;
    (function step(now) {
      const t = now - start;
      // 눌림 → 유지 → 튕겨 올라옴
      if (t < 110) ky = 5 * (t / 110);
      else if (t < 700) ky = 5;
      else if (t < 980) { const q = (t - 700) / 280; ky = 5 * (1 - q) - Math.sin(q * Math.PI) * 2.2; }
      else ky = 0;
      key.classList.toggle('down', t > 30 && t < 760);
      kx = lerp(x0, x1, ease(Math.max(0, Math.min(1, (t - 140) / 620))));
      placeKey();
      if (!flipped && t > 480) { flipped = true; document.body.classList.toggle('day', on); }

      const c = keyCenter();
      drawDots(parts.map(p => {
        const q = ease(Math.max(0, Math.min(1, (t - 100 - p.delay) / 900)));
        const u = 1 - q;
        const lx = u * u * p.a.x + 2 * u * q * p.cx + q * q * p.b.x;
        const ly = u * u * p.a.y + 2 * u * q * p.cy + q * q * p.b.y;
        return { x: c.x + lx, y: c.y + ly, a: lerp(p.aA, p.aB, q),
                 s: DOT * (1 + .45 * Math.sin(Math.PI * q)),
                 col: p.a.col.map((v, k) => Math.round(lerp(v, p.b.col[k], q))) };
      }));
      if (t < D) return requestAnimationFrame(step);
      ky = 0; placeKey(); key.classList.remove('down'); busy = false; drawStatic();
    })(start);
  }

  slot.addEventListener('click', toggle);
  slot.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) toggle(); }
  });
  addEventListener('resize', () => { sizeCanvas(); if (!busy) drawStatic(); });
  sizeCanvas(); placeKey(); drawStatic();
</script>
</body>
</html>
