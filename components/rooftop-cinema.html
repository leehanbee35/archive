<!doctype html>
<!-- meta: {"name":"옥상 극장 Seat Picker","cat":"화면","desc":"좌석표에서 자리를 고르면 카메라가 그 좌석으로 날아가 실제로 보이는 스크린을 미리 보여 줘요","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>옥상 극장 좌석 선택</title>
<style>
  :root{--amber:#f5a524;--ink:#f3eef8;--mute:#9a92a8;--line:#2c2636;--ease:cubic-bezier(.65,0,.25,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(80% 70% at 50% 40%,#1b1426,#0c0a12);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .stage{position:absolute;left:50%;top:50%;width:372px;height:760px;margin:-380px 0 0 -186px;transform-origin:50% 50%}
  .phone{position:relative;width:100%;height:100%;border-radius:50px;padding:6px;background:linear-gradient(160deg,#3a3446,#17131d 40%,#2a2433);
    box-shadow:0 0 0 1px #4a4356 inset,0 40px 90px rgba(0,0,0,.6),0 0 120px rgba(120,80,170,.12)}
  .screen{position:relative;width:360px;height:748px;border-radius:44px;overflow:hidden;background:#110e17}
  .island{position:absolute;z-index:50;left:50%;top:11px;width:104px;height:31px;margin-left:-52px;border-radius:20px;background:#000}
  .status{position:absolute;z-index:49;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;
    font-size:15px;font-weight:650;color:#fff;transition:color .3s;pointer-events:none}
  .status svg{display:block}
  .phone.lightTop .status{color:#2a1f38}
  .home{position:absolute;z-index:49;left:50%;bottom:8px;width:124px;height:5px;margin-left:-62px;border-radius:3px;background:rgba(255,255,255,.75);pointer-events:none}

  /* ---------- Screen A ---------- */
  .A{position:absolute;inset:0;display:flex;flex-direction:column;padding:50px 16px 26px}
  .chrome{opacity:var(--ch,1)}
  .top{display:flex;align-items:center;gap:8px;height:50px}
  .icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06)}
  .icon:hover{background:rgba(255,255,255,.1)}
  .ttl{flex:1;text-align:center;line-height:1.25}
  .ttl b{display:block;font-size:16px;font-weight:700}
  .ttl span{font-size:12px;color:var(--mute)}
  .chips{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
  .chip{height:32px;padding:0 14px;border-radius:16px;font-size:13px;font-weight:600;color:#cfc8da;border:1px solid #352f40;transition:background .2s,color .2s}
  .chip[aria-pressed="true"]{background:#f1ecf7;color:#17121e;border-color:#f1ecf7}
  .map{position:relative;flex:1;display:flex;align-items:center;justify-content:center;perspective:700px;perspective-origin:50% 42%}
  .scene{position:relative;transform-style:preserve-3d;will-change:transform;padding:0 4px}
  .scene::before{content:"";position:absolute;inset:-6px -10px -12px;border-radius:20px;opacity:var(--fl,1);
    background:radial-gradient(90% 70% at 50% 0%,rgba(245,165,36,.07),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 31px),#14111b;
    box-shadow:0 0 0 1px #221d2b inset}
  .arc{position:relative;height:50px;transform-style:preserve-3d}
  .arc .glow{position:absolute;left:20px;right:2px;top:12px;height:30px;border-radius:50%/100% 100% 0 0;border-top:3px solid #ffd59a;
    filter:drop-shadow(0 -4px 10px rgba(245,165,36,.75))}
  .arc .lbl{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:11px;font-weight:600;color:#b8a78f;letter-spacing:.3em;padding-left:18px;opacity:var(--ch,1)}
  .arc .wall{position:absolute;left:40px;right:22px;bottom:30px;height:82px;border-radius:4px;transform-origin:50% 100%;
    transform:rotateX(calc(var(--k,0) * -90deg));opacity:var(--k,0);
    background:linear-gradient(#ff9d73,#ffd29c 55%,#34426f 56%,#1e2650);box-shadow:0 0 40px rgba(255,180,120,.6)}
  .row{display:flex;align-items:center;gap:5px;margin-top:6px;transform-style:preserve-3d}
  .row.lng{margin-top:13px}
  .rl{width:16px;font-size:11px;font-weight:600;color:#6f6880;text-align:left;opacity:var(--ch,1)}
  .seat{--f:#1d1a26;--b:#4c465c;--bk:#3b3549;position:relative;width:24px;height:24px;border-radius:7px;background:var(--f);
    border:1.5px solid var(--b);transform-style:preserve-3d;transition:background .2s,border-color .2s,box-shadow .2s}
  .seat.gap{margin-left:12px}
  .seat i{position:absolute;left:-1.5px;right:-1.5px;bottom:-1.5px;height:19px;border-radius:7px 7px 3px 3px;background:var(--bk);
    transform-origin:50% 100%;transform:rotateX(calc(var(--k,0) * -86deg));opacity:var(--k,0);pointer-events:none}
  .seat:not(:disabled):hover{--b:#7c7490}
  .seat:disabled{--f:#2a2731;--b:#2a2731;--bk:#2d2a35;cursor:default}
  .seat.lounge{--f:#3c201c;--b:#7d4334;--bk:#6b3328;border-radius:9px}
  .seat.lounge:not(:disabled):hover{--b:#b06549}
  .seat.lounge:disabled{--f:#2b1d1c;--b:#2b1d1c;--bk:#2e1f1d}
  .scene .row .seat[aria-pressed="true"]{--f:var(--amber);--b:#ffc663;--bk:var(--amber);box-shadow:0 0 14px rgba(245,165,36,.75)}
  .seat[aria-pressed="true"] i{box-shadow:0 0 16px rgba(245,165,36,.8)}
  .legend{display:flex;justify-content:center;gap:14px;font-size:11.5px;color:#aaa2b8;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend em{width:11px;height:11px;border-radius:3px;border:1.5px solid #4c465c}
  .legend .t{background:#2a2731;border-color:#2a2731}
  .legend .l{background:#3c201c;border-color:#7d4334}
  .legend .s{background:var(--amber);border-color:#ffc663;box-shadow:0 0 6px rgba(245,165,36,.7)}
  .hint{text-align:center;font-size:11.5px;color:#7b7389;margin:8px 0 10px}
  .bar{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:22px;background:#1b1723;box-shadow:0 0 0 1px #2a2434 inset}
  .bar div{flex:1;line-height:1.3}
  .bar small{display:block;font-size:12px;color:var(--mute)}
  .bar b{font-size:18px;font-weight:700}
  .cta{height:46px;padding:0 30px;border-radius:23px;background:var(--amber);color:#1c1206;font-size:15px;font-weight:700;box-shadow:0 6px 20px rgba(245,165,36,.35)}
  .cta:disabled{background:#3a3444;color:#7d7589;box-shadow:none;cursor:default}
  .toast{position:absolute;left:50%;top:104px;z-index:40;transform:translate(-50%,-6px);padding:8px 14px;border-radius:14px;font-size:12.5px;
    background:rgba(40,34,50,.95);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- Screen B ---------- */
  .B{position:absolute;inset:0;visibility:hidden;opacity:0;transform-origin:50% 40%}
  .B svg.full{position:absolute;inset:0;width:100%;height:100%}
  .scr{position:absolute;left:55px;top:128px;width:250px;height:140px;transform-origin:50% 60%}
  .scr .halo{position:absolute;inset:-50px -60px;background:radial-gradient(closest-side,rgba(255,214,170,.55),transparent);pointer-events:none}
  .scr .legs{position:absolute;left:26px;right:26px;top:100%;height:64px;border-left:4px solid #241a26;border-right:4px solid #241a26}
  .scr .pic{position:relative;display:block;width:100%;height:100%;border:3px solid #1c141f;border-radius:4px;box-shadow:0 10px 30px rgba(40,20,40,.4)}
  .sh{transform-box:fill-box;transform-origin:center;animation:shim 2.4s ease-in-out infinite alternate}
  @keyframes shim{from{opacity:.95;transform:scaleX(1)}to{opacity:.35;transform:scaleX(.55)}}
  .boat{animation:sail 14s ease-in-out infinite alternate}
  @keyframes sail{from{transform:translateX(0)}to{transform:translateX(34px)}}
  .bulb{animation:tw var(--d,3s) ease-in-out var(--dl,0s) infinite alternate}
  @keyframes tw{from{opacity:1}to{opacity:.4}}
  .topB{position:absolute;left:16px;right:16px;top:54px;display:flex;align-items:center;gap:10px}
  .glass{background:rgba(30,22,40,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff}
  .glass:hover{background:rgba(30,22,40,.52)}
  .pill{height:34px;padding:0 14px;border-radius:17px;display:flex;align-items:center;font-size:13px;font-weight:600}
  .sheet{position:absolute;left:8px;right:8px;bottom:8px;padding:20px 18px 26px;border-radius:32px;
    background:rgba(18,13,24,.78);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);box-shadow:0 0 0 1px rgba(255,255,255,.07) inset}
  .cap{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.02em}
  .big{font-size:28px;font-weight:750;margin-top:4px;letter-spacing:-.02em}
  .sub{font-size:13px;color:var(--mute);margin-top:2px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .st{padding:11px 12px;border-radius:16px;background:rgba(255,255,255,.06)}
  .st b{display:block;font-size:18px;font-weight:700}
  .st span{font-size:11px;color:var(--mute)}
  .acts{display:flex;gap:8px}
  .ghost{flex:1;height:50px;border-radius:25px;font-size:14.5px;font-weight:650;box-shadow:0 0 0 1.5px rgba(255,255,255,.28) inset}
  .ghost:hover{box-shadow:0 0 0 1.5px rgba(255,255,255,.5) inset}
  .book{flex:1.45;height:50px;border-radius:25px;background:#fff;color:#16111c;font-size:14.5px;font-weight:700;transition:background .25s,color .25s}
  .book.done{background:var(--amber);color:#1c1206}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:0s!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status"><span>9:41</span>
        <svg width="62" height="12" viewBox="0 0 62 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><rect x="35" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="37" y="2.5" width="17" height="7" rx="2"/><rect x="59.5" y="4" width="2" height="4" rx="1" opacity=".45"/></svg>
      </div>

      <!-- Screen A: seat map -->
      <section class="A" id="A" aria-label="좌석 선택">
        <div class="top chrome">
          <button class="icon" aria-label="뒤로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="ttl"><b>옥상 극장 '노을'</b><span id="when">토요일 · 오후 7:30 상영</span></div>
          <button class="icon" id="share" aria-label="공유하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg></button>
        </div>
        <div class="chips chrome" role="group" aria-label="상영 시간" id="chips"></div>
        <div class="map" id="map">
          <div class="scene" id="scene">
            <div class="arc"><div class="wall"></div><div class="glow"></div><div class="lbl">스크린</div></div>
          </div>
        </div>
        <div class="legend chrome" aria-hidden="true"><span><em></em>빈자리</span><span><em class="t"></em>예약됨</span><span><em class="l"></em>라운지</span><span><em class="s"></em>선택함</span></div>
        <p class="hint chrome">자리를 누르면 그 자리에서 보이는 화면을 미리 볼 수 있어요</p>
        <div class="bar chrome"><div><small id="aSeat">H열 3번</small><b id="aPrice">18,000원</b></div><button class="cta" id="go">계속</button></div>
        <div class="toast" id="toast" role="status"></div>
      </section>

      <!-- Screen B: view from the seat -->
      <section class="B" id="B" aria-label="좌석 미리보기" inert>
        <svg class="full" viewBox="0 0 360 748" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a596d4"/><stop offset=".35" stop-color="#c7a5d2"/><stop offset=".7" stop-color="#f1b7a3"/><stop offset="1" stop-color="#f8d1aa"/></linearGradient>
            <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3346"/><stop offset=".25" stop-color="#2a1c2b"/><stop offset="1" stop-color="#120c14"/></linearGradient>
          </defs>
          <rect width="360" height="340" fill="url(#sky)"/>
          <path id="skyline" fill="#7f6b97" opacity=".85"/>
          <rect y="334" width="360" height="414" fill="url(#floor)"/>
          <rect y="333" width="360" height="2" fill="#f3c3a0" opacity=".35"/>
        </svg>
        <div class="scr" id="scr" aria-hidden="true">
          <div class="halo"></div><div class="legs"></div>
          <svg class="pic" viewBox="0 0 250 140" preserveAspectRatio="none">
            <defs>
              <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9758a"/><stop offset=".55" stop-color="#ff9e6e"/><stop offset="1" stop-color="#ffd59a"/></linearGradient>
              <linearGradient id="pSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4f82"/><stop offset="1" stop-color="#1d2148"/></linearGradient>
              <radialGradient id="pSun"><stop offset="0" stop-color="#fff6d8"/><stop offset=".5" stop-color="#ffe2a0"/><stop offset="1" stop-color="#ffb877" stop-opacity="0"/></radialGradient>
            </defs>
            <rect width="250" height="92" fill="url(#pSky)"/>
            <rect x="20" y="30" width="70" height="2" rx="1" fill="#ffc7a8" opacity=".55"/><rect x="150" y="22" width="80" height="2" rx="1" fill="#ffc7a8" opacity=".5"/><rect x="170" y="40" width="44" height="1.6" rx=".8" fill="#ffd6b8" opacity=".5"/>
            <circle cx="125" cy="90" r="40" fill="url(#pSun)"/>
            <circle cx="125" cy="90" r="16" fill="#fff1c6"/>
            <rect y="90" width="250" height="50" fill="url(#pSea)"/>
            <g fill="#ffe3a6" id="refl"></g>
            <g class="boat"><g transform="translate(60 86)"><path d="M0 0h16l-3 3.5H3z" fill="#231a33"/><path d="M8 -.5V-14L15 -1.5z" fill="#2b2040"/><path d="M7 -1.5V-11L2 -1.5z" fill="#2b2040" opacity=".85"/></g></g>
          </svg>
        </div>
        <svg class="full" viewBox="0 0 360 748" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <radialGradient id="bGlow"><stop offset="0" stop-color="#ffe0a0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffc06a" stop-opacity=".35"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
            <linearGradient id="seatG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83343a"/><stop offset=".35" stop-color="#5a1f26"/><stop offset="1" stop-color="#2a0e13"/></linearGradient>
          </defs>
          <g id="fgRows"></g>
          <g id="bulbs"></g>
        </svg>
        <div class="topB">
          <button class="icon glass" id="backB" aria-label="좌석표로 돌아가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="pill glass" id="pill">H열 미리보기</span>
        </div>
        <div class="sheet">
          <p class="cap">좌석 미리보기</p>
          <h2 class="big" id="bSeat">H열 3번</h2>
          <p class="sub" id="bSub">라운지석 · 담요 제공</p>
          <div class="stats">
            <div class="st"><b id="sDist">17m</b><span>스크린까지</span></div>
            <div class="st"><b id="sAng">34°</b><span>보는 각도</span></div>
            <div class="st"><b id="sView">추천</b><span>시야</span></div>
          </div>
          <div class="acts">
            <button class="ghost" id="change">자리 바꾸기</button>
            <button class="book" id="book">예매 · 18,000원</button>
          </div>
          <span class="sr" id="live" aria-live="polite"></span>
        </div>
      </section>
      <div class="home"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const ROWS = 'ABCDEFGH', COLS = 10, LOUNGE = 7;
  const TIMES = [['7:30 PM','오후 7:30'],['9:40 PM','오후 9:40'],['11:50 PM','오후 11:50']];
  const won = n => n.toLocaleString('ko-KR') + '원';
  const price = r => r === LOUNGE ? 18000 : 14000;
  const label = (r, c) => `${ROWS[r]}열 ${c + 1}번`;
  const rnd = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };

  const stage = $('#stage'), phone = $('#phone'), A = $('#A'), B = $('#B'), map = $('#map'), scene = $('#scene');
  let ti = 0, sel = { r: 7, c: 2 }, T = 0, raf = 0, busy = false;
  const cam = { dx: 0, dy: 0, r: 7 };

  /* fit phone to viewport */
  function fit() {
    const s = Math.min(innerHeight * .94 / 760, innerWidth * .94 / 372);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* chips */
  const chips = TIMES.map((t, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = t[0]; b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => setTime(i);
    $('#chips').appendChild(b); return b;
  });

  /* seat grid */
  const seats = [], rowEls = [];
  for (let r = 0; r < ROWS.length; r++) {
    const row = document.createElement('div');
    row.className = 'row' + (r === LOUNGE ? ' lng' : '');
    row.innerHTML = `<span class="rl" aria-hidden="true">${ROWS[r]}</span>`;
    seats[r] = [];
    for (let c = 0; c < COLS; c++) {
      const s = document.createElement('button');
      s.className = 'seat' + (r === LOUNGE ? ' lounge' : '') + (c === 5 ? ' gap' : '');
      s.appendChild(document.createElement('i'));
      s.onclick = () => pick(r, c);
      row.appendChild(s); seats[r][c] = s;
    }
    scene.appendChild(row); rowEls.push(row);
  }

  function isTaken(r, c) {
    if (ti === 0 && r === 7 && c === 2) return false;
    return rnd(ti * 131 + r * 17 + c * 3 + 1) < (r === LOUNGE ? .28 : .32);
  }
  function paint() {
    for (let r = 0; r < ROWS.length; r++) for (let c = 0; c < COLS; c++) {
      const s = seats[r][c], tk = isTaken(r, c), on = sel && sel.r === r && sel.c === c;
      s.disabled = tk;
      s.setAttribute('aria-pressed', on);
      s.setAttribute('aria-label', `${label(r, c)}, ${tk ? '예약됨' : (r === LOUNGE ? '라운지석 ' : '일반석 ') + won(price(r))}`);
    }
    $('#aSeat').textContent = sel ? label(sel.r, sel.c) : '좌석을 골라 주세요';
    $('#aPrice').textContent = sel ? won(price(sel.r)) : '—';
    $('#go').disabled = !sel;
  }
  function setTime(i) {
    ti = i;
    chips.forEach((b, j) => b.setAttribute('aria-pressed', j === i));
    $('#when').textContent = `토요일 · ${TIMES[i][1]} 상영`;
    if (sel && isTaken(sel.r, sel.c)) sel = null;
    paint();
  }
  function pick(r, c) {
    if (busy || T > 0) return;
    sel = { r, c }; paint(); fly();
  }
  $('#go').onclick = () => { if (sel && !busy) fly(); };

  let toastT;
  $('#share').onclick = () => {
    const t = $('#toast'); t.textContent = '공유 링크를 만들었어요'; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
  };

  /* ---------- camera move ---------- */
  const cl = x => Math.max(0, Math.min(1, x));
  const rg = (t, a, b) => cl((t - a) / (b - a));
  const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  function apply(t) {
    const k = io(rg(t, 0, .42));
    const rx = 70 * io(rg(t, .02, .78));
    const m = io(rg(t, .05, .85));
    const z = 460 * Math.pow(rg(t, .25, 1), 1.8);
    scene.style.setProperty('--k', k.toFixed(3));
    scene.style.setProperty('--fl', (1 - rg(t, .45, .72)).toFixed(3));
    scene.style.transform = t === 0 ? '' :
      `translate3d(${(cam.dx * m).toFixed(2)}px,${(cam.dy * m).toFixed(2)}px,${z.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg)`;
    A.style.setProperty('--ch', (1 - rg(t, 0, .28)).toFixed(3));
    rowEls.forEach((e, i) => e.style.visibility = (i > cam.r && t > .42) ? 'hidden' : '');
    const b = rg(t, .7, 1);
    B.style.opacity = b;
    B.style.visibility = b > 0 ? 'visible' : 'hidden';
    B.style.transform = `scale(${(1.07 - .07 * io(b)).toFixed(4)})`;
    A.style.visibility = t >= 1 ? 'hidden' : '';
    phone.classList.toggle('lightTop', t > .85);
  }

  function run(to, done) {
    cancelAnimationFrame(raf);
    const from = T, dur = reduce.matches ? 0 : 1400 * Math.abs(to - from);
    busy = true; A.style.pointerEvents = B.style.pointerEvents = 'none';
    const end = () => { T = to; apply(to); busy = false; A.style.pointerEvents = B.style.pointerEvents = ''; done(); };
    if (!dur) return end();
    const t0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      T = from + (to - from) * p; apply(T);
      if (p < 1) raf = requestAnimationFrame(step); else end();
    };
    raf = requestAnimationFrame(step);
  }

  function fly() {
    if (!sel || busy) return;
    const s = seats[sel.r][sel.c];
    const sx = s.offsetLeft + 12, sy = s.offsetTop + 12;
    scene.style.transformOrigin = `${sx}px ${sy}px`;
    cam.dx = map.clientWidth / 2 - (scene.offsetLeft + sx);
    cam.dy = map.clientHeight * .66 - (scene.offsetTop + sy);
    cam.r = sel.r;
    renderB(sel.r, sel.c);
    run(1, () => { A.inert = true; B.inert = false; $('#backB').focus({ preventScroll: true }); });
  }
  function back() {
    if (busy) return;
    B.inert = true; A.inert = false;
    run(0, () => { if (sel) seats[sel.r][sel.c].focus({ preventScroll: true }); });
  }
  $('#backB').onclick = back;
  $('#change').onclick = back;

  /* ---------- Screen B ---------- */
  // skyline
  (() => {
    let d = 'M0 334', x = 0, i = 0;
    while (x < 360) {
      const w = 14 + rnd(i * 7 + 3) * 22, h = 10 + rnd(i * 11 + 5) * 34 * (Math.abs(x - 180) < 120 ? .8 : 1.3);
      d += `V${(334 - h).toFixed(1)}H${(x + w).toFixed(1)}`; x += w; i++;
    }
    $('#skyline').setAttribute('d', d + 'V334Z');
  })();
  // sun reflection
  for (let i = 0; i < 7; i++) {
    const w = 30 - i * 3.2, r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', 125 - w / 2); r.setAttribute('y', 94 + i * 6.2);
    r.setAttribute('width', w); r.setAttribute('height', 1.8); r.setAttribute('rx', .9);
    r.setAttribute('class', 'sh'); r.style.animationDelay = (-i * .37) + 's';
    $('#refl').appendChild(r);
  }
  // string lights
  (() => {
    const g = $('#bulbs'), q = (a, b, c, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * b + t * t * c;
    const strings = [[[-20, 46], [180, 150], [380, 34]], [[-20, 112], [180, 210], [380, 100]]];
    let n = 0;
    strings.forEach(([p0, p1, p2], si) => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', `M${p0}Q${p1} ${p2}`); p.setAttribute('fill', 'none');
      p.setAttribute('stroke', '#3a2633'); p.setAttribute('stroke-width', si ? 1.4 : 1); p.setAttribute('opacity', '.75');
      g.appendChild(p);
      for (let i = 0; i <= 12; i++) {
        const t = i / 12, x = q(p0[0], p1[0], p2[0], t), y = q(p0[1], p1[1], p2[1], t) + 4, s = si ? 1.25 : 1;
        const b = document.createElementNS(NS, 'g');
        b.setAttribute('class', 'bulb');
        b.style.setProperty('--d', (2.2 + rnd(n * 3 + 1) * 2.6).toFixed(2) + 's');
        b.style.setProperty('--dl', (-rnd(n * 5 + 2) * 4).toFixed(2) + 's');
        b.innerHTML = `<circle cx="${x}" cy="${y}" r="${15 * s}" fill="url(#bGlow)"/><circle cx="${x}" cy="${y}" r="${3 * s}" fill="#fff3d2"/>`;
        g.appendChild(b); n++;
      }
    });
  })();

  function renderB(r, c) {
    const lounge = r === LOUNGE, off = c - 4.5;
    $('#pill').textContent = `${ROWS[r]}열 미리보기`;
    $('#bSeat').textContent = label(r, c);
    $('#bSub').textContent = lounge ? '라운지석 · 담요 제공' : '일반석 · 방석 제공';
    const bk = $('#book'); bk.classList.remove('done'); bk.textContent = `예매 · ${won(price(r))}`;
    $('#live').textContent = '';

    // geometry (metres): screen 10.4m wide
    const depth = 5.5 + r * 1.65, lat = off * .6 + (c < 5 ? -.4 : .4);
    const dist = Math.hypot(depth, lat), ang = Math.round(2 * Math.atan(5.2 / dist) * 180 / Math.PI);
    $('#sDist').textContent = Math.round(dist) + 'm';
    $('#sAng').textContent = ang + '°';
    $('#sView').textContent = ang > 52 ? '가까움' : Math.abs(lat) > 2.2 ? '측면' : (ang >= 28 && ang <= 46) ? '추천' : '좋음';

    // screen parallax
    const s = .85 + (7 - r) * .075, tx = -off * 10, ty = -(7 - r) * 6, ry = -off * 3.6;
    $('#scr').style.transform = `perspective(800px) translate(${tx}px,${ty}px) scale(${s.toFixed(3)}) rotateY(${ry.toFixed(1)}deg)`;
    $('#bulbs').setAttribute('transform', `translate(${(-off * 3).toFixed(1)} ${((7 - r) * 2).toFixed(1)})`);

    // seat backs in front
    const g = $('#fgRows'); g.innerHTML = '';
    const n = Math.min(r, 3);
    if (!n) {
      g.innerHTML = '<rect x="-10" y="438" width="380" height="320" fill="#22161f"/><rect x="-10" y="436" width="380" height="3" fill="#f3c3a0" opacity=".45"/>';
    }
    const aisle = j => j >= 5 ? 14 : 0;
    for (let i = n - 1; i >= 0; i--) {
      const sc = 1 - i * .24, top = 408 - i * 32, w = 60 * sc, h = 340;
      const row = document.createElementNS(NS, 'g');
      row.setAttribute('opacity', (1 - i * .12).toFixed(2));
      let html = '';
      for (let j = 0; j < COLS; j++) {
        const x = 180 + ((j - c) * 66 + aisle(j) - aisle(c)) * sc + off * 4 * i;
        if (x < -w || x > 360 + w) continue;
        html += `<rect x="${(x - w / 2).toFixed(1)}" y="${top}" width="${w.toFixed(1)}" height="${h}" rx="${16 * sc}" fill="url(#seatG)"/>` +
                `<rect x="${(x - w / 2 + 6 * sc).toFixed(1)}" y="${top + 3}" width="${(w - 12 * sc).toFixed(1)}" height="2" rx="1" fill="#ffc3a8" opacity=".28"/>`;
      }
      row.innerHTML = html; g.appendChild(row);
    }
  }

  let bookT;
  $('#book').onclick = () => {
    const b = $('#book');
    if (b.classList.contains('done')) return;
    b.classList.add('done'); b.textContent = '예매 완료 ✓';
    $('#live').textContent = `${$('#bSeat').textContent} 예매를 마쳤어요`;
    clearTimeout(bookT);
    bookT = setTimeout(() => { b.classList.remove('done'); b.textContent = `예매 · ${won(price(sel.r))}`; }, 2400);
  };

  addEventListener('keydown', e => { if (e.key === 'Escape' && T === 1) back(); });

  paint(); renderB(sel.r, sel.c); apply(0);
})();
</script>
</body>
</html>
