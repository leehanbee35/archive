<!doctype html>
<!-- meta: {"name":"궤도 Showcase","cat":"갤러리","desc":"웹사이트 화면 여덟 장이 기울어진 궤도 위를 천천히 돌고, 끌어서 돌리면 앞에 온 작품의 이름이 표시되는 쇼케이스","added":"2026-11-27"} -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>궤도 쇼케이스</title>
<style>
  :root{--ink:#f1ede6;--mute:#77726b;--accent:#ff6a1a}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(80% 60% at 50% 60%,#0d0c0b,#000 70%);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none}
  .stage{position:fixed;inset:0;cursor:grab;touch-action:none;perspective-origin:50% 38%}
  .stage.drag{cursor:grabbing}
  .scene,.ring{position:absolute;left:50%;top:47%;transform-style:preserve-3d}
  .ring{left:0;top:0}
  .card{position:absolute;left:0;top:0;transform-style:preserve-3d;border-radius:.6em;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 60px rgba(0,0,0,.6);transition:box-shadow .4s}
  .card.front{box-shadow:0 0 0 .12em var(--accent),0 30px 60px rgba(0,0,0,.6)}
  .site{position:absolute;inset:0;overflow:hidden;border-radius:.6em;line-height:1.15;letter-spacing:-.02em}
  .site>div{position:absolute}
  .site svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .im{overflow:hidden;border-radius:.5em}
  .nav{left:2em;right:2em;top:1.4em;display:flex;justify-content:space-between;align-items:center;font-size:.8em}
  .nav b{font-size:1.25em;font-weight:800}
  .nav span i{font-style:normal;opacity:.6;margin-left:1.5em}
  .bt{display:inline-block;padding:.75em 1.5em;border-radius:99em;font-size:.8em;font-weight:600}
  .bar{height:.45em;border-radius:1em;background:currentColor;opacity:.16;margin-top:.55em}
  .dim{position:absolute;inset:0;border-radius:.6em;background:#000;pointer-events:none;opacity:0}
  .ui{position:fixed;left:clamp(14px,3vw,32px);right:clamp(14px,3vw,32px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
  .top{top:clamp(12px,3vh,26px);font-size:12px;color:var(--mute)}
  .top b{color:var(--ink);font-weight:600}
  .bot{bottom:clamp(12px,3.5vh,30px)}
  .name{font-size:clamp(13px,1.6vw,17px);color:var(--mute)}
  .name b{color:var(--ink);font-weight:600}
  .count{font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute)}
  .count b{color:var(--accent);font-weight:600}
  @media (max-height:320px){.top{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" aria-label="웹사이트 쇼케이스, 좌우 화살표로 돌리기">
  <div class="scene" id="scene"><div class="ring" id="ring"></div></div>
</div>
<div class="ui top"><b>작업 모음</b><span>끌어서 돌리기</span></div>
<div class="ui bot">
  <div class="name" id="name" aria-live="polite"><b>포르마</b> · 브랜드 사이트</div>
  <div class="count" id="count"><b>03</b> / 08</div>
</div>
<script>
const PAL=[['#f6c28b','#e86f51','#ffe3a3','#7a3b3f','#3d2333'],['#a8d8e8','#4f8fbf','#fff4d6','#2f5d7c','#173247'],
  ['#f3e1c7','#d9a27a','#fffaf0','#8a5a44','#4a2f27'],['#c9e4c5','#6fa68a','#f7f3d0','#2f5e4a','#183a2e'],
  ['#e9c6e0','#9a6fb0','#ffe9f3','#4b3670','#251a3d'],['#ffd9a0','#f29e4c','#fff2cf','#b4532a','#5c2a1c']];
let artN=0;
function art(seed,kind,w=300,h=300){
  let s=seed*7919+13;const r=()=>((s=(s*16807)%2147483647)/2147483647);
  const p=PAL[seed%PAL.length],u='o'+(++artN);
  const lin=(id,a,b)=>`<linearGradient id="${u}${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  let d='',b='';
  if(kind==='hills'){const y=h*.6;d=lin('s',p[0],p[1]);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}s)"/><circle cx="${w*(.3+r()*.4)}" cy="${y-h*.14}" r="${w*.14}" fill="${p[2]}"/>
    <path d="M0 ${y}Q${w*.35} ${y-h*.16} ${w*.7} ${y-h*.02}T${w} ${y-h*.06}V${h}H0Z" fill="${p[3]}"/><path d="M0 ${y+h*.14}Q${w*.5} ${y+h*.02} ${w} ${y+h*.16}V${h}H0Z" fill="${p[4]}"/>`}
  else if(kind==='sea'){const y=h*.55;d=lin('s',p[1],p[0])+lin('w',p[3],p[4]);
    b=`<rect width="${w}" height="${h}" fill="url(#${u}s)"/><circle cx="${w*.55}" cy="${y-h*.07}" r="${w*.13}" fill="${p[2]}"/><rect y="${y}" width="${w}" height="${h-y}" fill="url(#${u}w)"/>`;
    for(let k=0;k<6;k++)b+=`<path d="M0 ${y+8+k*k*5}q${w/8} -5 ${w/4} 0t${w/4} 0t${w/4} 0t${w/4} 0" stroke="${p[2]}" stroke-opacity=".3" stroke-width="2" fill="none"/>`}
  else if(kind==='plant'){d=lin('b',p[2],p[0]);const cx=w/2;b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/>`;
    for(let k=0;k<8;k++)b+=`<ellipse cx="${cx}" cy="${h*.4}" rx="${w*.07}" ry="${h*.21}" fill="${k%2?p[3]:p[4]}" transform="rotate(${-63+k*18} ${cx} ${h*.66})"/>`;
    b+=`<path d="M${w*.33} ${h*.64}H${w*.67}L${w*.61} ${h*.92}H${w*.39}Z" fill="${p[1]}"/>`}
  else if(kind==='portrait'){d=lin('b',p[0],p[1]);b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/><circle cx="${w/2}" cy="${h*.42}" r="${w*.18}" fill="${p[4]}"/>
    <path d="M${w*.1} ${h}C${w*.1} ${h*.72} ${w*.3} ${h*.63} ${w/2} ${h*.63}S${w*.9} ${h*.72} ${w*.9} ${h}Z" fill="${p[4]}"/>`}
  else{d=lin('b',p[3],p[4]);b=`<rect width="${w}" height="${h}" fill="url(#${u}b)"/>`;
    for(let k=0;k<3;k++)b+=`<circle cx="${w*(.25+r()*.5)}" cy="${h*(.25+r()*.5)}" r="${w*(.18+r()*.18)}" fill="${p[k]}" opacity=".7" style="mix-blend-mode:screen"/>`}
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${d}</defs>${b}</svg>`;
}
const A=(st,html='')=>`<div style="${st}">${html}</div>`;
const nav=(name,links,col)=>`<div class="nav" style="color:${col}"><b>${name}</b><span>${links.map(l=>`<i>${l}</i>`).join('')}</span></div>`;
const bars=n=>Array.from({length:n},(_,i)=>`<div class="bar" style="width:${90-i*22}%"></div>`).join('');

const sites=[
 {n:'녹트',t:'제품 소개',bg:'#0b0f17',ink:'#e8ecf3',h:()=>nav('녹트',['제품','기능','가격'],'#e8ecf3')+
  A('left:2em;top:7.5em;width:24em',`<div style="font-size:3.3em;font-weight:800;line-height:1.05">모든 움직임을<br>또렷하게</div><div style="margin-top:1.1em;font-size:.9em;opacity:.55">빛이 적은 밤에도 선명한 야간 카메라</div><div style="margin-top:1.6em"><span class="bt" style="background:#4d7cff;color:#fff">미리 신청</span></div>`)+
  A('left:28em;top:5.5em;width:17.5em;height:21em','<div class="im" style="position:absolute;inset:0">'+art(1,'sea')+'</div>')},
 {n:'여백',t:'노트 앱',bg:'#f1ece3',ink:'#2b2620',h:()=>nav('여백',['소개','요금','로그인'],'#2b2620')+
  A('left:0;right:0;top:6.5em;text-align:center',`<div style="font-size:3.6em;font-weight:700">생각할 공간</div><div style="margin-top:.9em;font-size:.95em;opacity:.55">흩어진 메모를 한곳에 조용히</div><div style="margin-top:1.4em"><span class="bt" style="background:#2b2620;color:#f1ece3">무료로 시작</span></div>`)+
  [0,1,2].map(i=>A(`left:${3+i*14.4}em;top:19.5em;width:13.2em;height:8.5em;background:#fff;border-radius:.6em;padding:1.1em;color:#2b2620`,`<div style="width:1.6em;height:1.6em;border-radius:50%;background:${['#e0b48a','#9cb7a3','#b4a7d0'][i]}"></div>${bars(3)}`)).join('')},
 {n:'포르마',t:'브랜드 사이트',bg:'#f4f1ea',ink:'#161412',h:()=>nav('포르마 스튜디오',['작업','소개','연락'],'#161412')+
  [0,1,2].map(i=>A(`left:${19+i*9.4}em;top:5em;width:8.6em;height:11.5em`,'<div class="im" style="position:absolute;inset:0">'+art(i+2,['portrait','hills','orbs'][i])+'</div>')).join('')+
  A('left:2em;top:5.5em;width:15em;font-size:.85em;line-height:1.5;opacity:.6','형태와 여백으로<br>브랜드를 짓습니다')+
  A('left:1.4em;bottom:-.9em;font-size:9.8em;font-weight:900;letter-spacing:-.07em;color:#161412','포르마')+
  A('right:2em;bottom:2.4em;width:1.4em;height:1.4em;border-radius:50%;background:#ff6a1a')},
 {n:'하루결',t:'매거진',bg:'#222',ink:'#fff',h:()=>A('inset:0',art(0,'hills'))+A('inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%)')+
  nav('하루결',['이번 호','기사','구독'],'#fff')+A('left:2em;bottom:2.2em;color:#fff',`<div style="font-size:.75em;opacity:.8;margin-bottom:.8em">12월호 · 도시 산책</div><div style="font-size:3em;font-weight:700">천천히 걷는 도시</div>`)},
 {n:'모음',t:'온라인 상점',bg:'#ffffff',ink:'#1b1b1b',h:()=>nav('모음',['새 상품','카테고리','장바구니 2'],'#1b1b1b')+
  A('left:2em;top:5.2em;font-size:1.6em;font-weight:700','이번 주 새로 들어온 것')+
  [0,1,2,3].map(i=>A(`left:${2+i*11.2}em;top:9.5em;width:10.2em`,`<div class="im" style="position:relative;height:13em">${art(i+1,['plant','orbs','portrait','sea'][i])}</div><div style="margin-top:.8em;font-size:.8em">${['작은 화분','유리 조명','리넨 셔츠','바다 엽서'][i]}</div><div style="margin-top:.35em;font-size:.8em;font-weight:700">₩${['32,000','58,000','45,000','4,500'][i]}</div>`)).join('')},
 {n:'파동',t:'음악 서비스',bg:'#120d1d',ink:'#efe8ff',h:()=>nav('파동',['둘러보기','보관함'],'#efe8ff')+
  A('left:2em;top:5.5em;width:17em;height:17em','<div class="im" style="position:absolute;inset:0">'+art(4,'orbs')+'</div>')+
  A('left:21.5em;top:7em;right:2em',`<div style="font-size:.75em;color:#b98cff">지금 듣는 중</div><div style="margin-top:.5em;font-size:2.1em;font-weight:700">새벽 세 시의 바다</div><div style="margin-top:.5em;font-size:.85em;opacity:.5">윤슬 · 2026</div>
   <div style="display:flex;align-items:center;gap:.25em;height:5em;margin-top:1.6em">${Array.from({length:38},(_,i)=>`<i style="flex:1;border-radius:1em;background:${i<15?'#b98cff':'rgba(239,232,255,.2)'};height:${20+Math.abs(Math.sin(i*1.7))*70+Math.sin(i*.5)*10}%"></i>`).join('')}</div>
   <div style="margin-top:1.5em;width:3.2em;height:3.2em;border-radius:50%;background:#efe8ff;display:grid;place-items:center"><div style="border-left:1em solid #120d1d;border-top:.6em solid transparent;border-bottom:.6em solid transparent;margin-left:.25em"></div></div>`)},
 {n:'온실',t:'식물 가게',bg:'#e4ecdf',ink:'#1f3a2b',h:()=>nav('온실',['식물','관리법','매장'],'#1f3a2b')+
  A('left:2em;top:8em;width:22em',`<div style="font-size:3.4em;font-weight:800;line-height:1.05">작은 숲을<br>들이세요</div><div style="margin-top:1em;font-size:.9em;opacity:.6">햇빛 적은 방에도 잘 크는 식물</div><div style="margin-top:1.5em"><span class="bt" style="background:#2f6b48;color:#fff">둘러보기</span> <span class="bt" style="border:1px solid #1f3a2b55">관리 안내</span></div>`)+
  A('left:26.5em;top:4.5em;width:19.5em;height:23.5em','<div class="im" style="position:absolute;inset:0;border-radius:10em 10em .6em .6em">'+art(3,'plant')+'</div>')},
 {n:'단위',t:'데이터 대시보드',bg:'#0f1412',ink:'#dfe9e3',h:()=>A('left:0;top:0;bottom:0;width:9em;background:#151c19;padding:1.6em 1.4em;color:#dfe9e3',`<div style="font-weight:800;font-size:1.1em;margin-bottom:1.4em">단위</div>${bars(4)}${bars(3)}`)+
  [['방문','12,480'],['전환','3.2%'],['매출','₩8.4M']].map(([k,v],i)=>A(`left:${11+i*11.8}em;top:2em;width:10.8em;height:6.5em;background:#151c19;border-radius:.6em;padding:1.1em`,`<div style="font-size:.7em;opacity:.5">${k}</div><div style="margin-top:.4em;font-size:1.7em;font-weight:700">${v}</div>`)).join('')+
  A('left:11em;top:10.5em;right:2em;bottom:2em;background:#151c19;border-radius:.6em;padding:1.4em;display:flex;align-items:flex-end;gap:.6em',Array.from({length:14},(_,i)=>`<i style="flex:1;border-radius:.3em .3em 0 0;background:${i===10?'#5fe0a0':'#2c3d35'};height:${25+Math.abs(Math.sin(i*.9+1))*70}%"></i>`).join(''))}
];

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=sites.length,STEP=360/N;
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),ring=document.getElementById('ring');
const nameEl=document.getElementById('name'),countEl=document.getElementById('count');
const cards=sites.map((s,i)=>{
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="site" style="background:${s.bg};color:${s.ink}">${s.h()}</div><div class="dim"></div>`;
  ring.appendChild(el);return {el,dim:el.querySelector('.dim')};
});

let W,H,R;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  W=Math.min(vw*.38,vh*.5*1.6,560);H=W*.625;R=N*W*1.22/(2*Math.PI);
  stage.style.perspective=Math.round(W*3.6)+'px';
  scene.style.transform=`translateZ(${-R}px) rotateX(-13deg) rotateZ(4deg)`;
  cards.forEach((c,i)=>{
    Object.assign(c.el.style,{width:W+'px',height:H+'px',marginLeft:-W/2+'px',marginTop:-H/2+'px',fontSize:(W/48)+'px',
      transform:`rotateY(${i*STEP}deg) translateZ(${R}px)`});
  });
}

let ang=STEP*2,vel=0,target=null,drag=null,lastInput=-1e9,prev=performance.now(),front=-1;
const clamp=(v,a)=>Math.max(-a,Math.min(a,v));
function render(){
  ring.style.transform=`rotateY(${(-ang).toFixed(3)}deg)`;
  cards.forEach((c,i)=>{const rel=(i*STEP-ang)*Math.PI/180;c.dim.style.opacity=((1-Math.cos(rel))/2*.82).toFixed(3)});
  const f=((Math.round(ang/STEP)%N)+N)%N;
  if(f!==front){
    if(front>=0)cards[front].el.classList.remove('front');
    front=f;cards[f].el.classList.add('front');
    nameEl.innerHTML=`<b>${sites[f].n}</b> · ${sites[f].t}`;
    countEl.innerHTML=`<b>${String(f+1).padStart(2,'0')}</b> / ${String(N).padStart(2,'0')}`;
  }
}
function tick(now){
  const dt=Math.min(3,(now-prev)/16.67);prev=now;
  if(!drag){
    if(target!==null){ang+=(target-ang)*Math.min(1,(reduce?1:.1)*dt);if(Math.abs(target-ang)<.02){ang=target;target=null}}
    else{
      ang+=vel*dt;vel*=Math.pow(reduce?.5:.95,dt);if(Math.abs(vel)<.005)vel=0;
      if(!reduce&&now-lastInput>2500)ang+=.05*dt;
      else if(!vel)ang+=(Math.round(ang/STEP)*STEP-ang)*Math.min(1,.07*dt);
    }
  }
  render();requestAnimationFrame(tick);
}
const degPerPx=()=>180/(Math.PI*R)*.9;
stage.addEventListener('pointerdown',e=>{
  if(e.button)return;
  drag={x:e.clientX,lx:e.clientX,lt:e.timeStamp,a:ang,moved:0,card:e.target.closest('.card')};
  vel=0;target=null;lastInput=performance.now();stage.setPointerCapture(e.pointerId);stage.classList.add('drag');
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x;drag.moved=Math.max(drag.moved,Math.abs(dx));
  ang=drag.a-dx*degPerPx();
  const dt=Math.max(1,e.timeStamp-drag.lt);
  vel=clamp(vel*.3-(e.clientX-drag.lx)*degPerPx()/(dt/16.67)*.7,12);
  drag.lx=e.clientX;drag.lt=e.timeStamp;lastInput=performance.now();
});
function endDrag(e){
  if(!drag)return;stage.classList.remove('drag');
  if(drag.moved<6){vel=0;const i=cards.findIndex(c=>c.el===drag.card);
    if(i>=0){let d=((i*STEP-ang)%360+540)%360-180;target=Math.round((ang+d)/STEP)*STEP}}
  else if(reduce||e.timeStamp-drag.lt>90)vel=0;
  drag=null;lastInput=performance.now();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('wheel',e=>{
  e.preventDefault();target=null;
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  vel=clamp(vel+d*(e.deltaMode?.6:.02),12);lastInput=performance.now();
},{passive:false});
addEventListener('keydown',e=>{
  let n=0;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')n=1;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=-1;
  if(!n)return;e.preventDefault();vel=0;
  target=Math.round((target??ang)/STEP)*STEP+n*STEP;lastInput=performance.now();
});
addEventListener('resize',layout);
layout();render();requestAnimationFrame(tick);
</script>
</body>
</html>
