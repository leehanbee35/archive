<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Archive</title>
<style>
  :root{
    --lichen:#ffffff;   /* 바탕 */
    --pine:#000000;     /* 글자 */
    --mat:#f4f4f4;      /* 받침 */
    --moss:#767676;     /* 흐린 글자 */
    --rule:#e2e2e2;     /* 선 */
    --cobalt:#000000;   /* 선택 */
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--lichen);color:var(--pine);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  :focus-visible{outline:2px solid #000;outline-offset:2px}

  .app{display:grid;grid-template-columns:300px 1fr;height:100vh}

  /* ── 목록 ── */
  .index{display:flex;flex-direction:column;border-right:1px solid var(--rule);min-height:0}
  .brand{padding:28px 24px 20px}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
  .brand p{margin-top:6px;color:var(--moss);font-size:13px}
  .find{margin:0 24px 16px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--pine);padding:6px 0}
  .find svg{width:16px;height:16px;flex:none}
  .find input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:14px}
  .find input::placeholder{color:var(--moss)}
  .cats{display:flex;flex-wrap:wrap;gap:4px 18px;padding:2px 24px 20px;font-size:15px}
  .cat{color:var(--moss);padding:3px 0 5px;border-bottom:2px solid transparent}
  .cat:hover{color:var(--pine)}
  .cat[aria-pressed="true"]{color:var(--pine);font-weight:600;border-color:var(--pine)}
  .cat sup{font-size:10px;margin-left:2px}

  .list{flex:1;overflow:auto;list-style:none;padding:0 12px 24px;border-top:1px solid var(--rule)}
  .item{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;width:100%;text-align:left;
    padding:11px 12px;border-radius:8px;margin-top:4px}
  li:first-child .item{margin-top:10px}
  .item b{font-weight:500;font-size:14px}
  .item small{color:var(--moss);font-size:12px}
  .item:hover{background:rgba(0,0,0,.05)}
  .item[aria-current="true"]{background:var(--cobalt);color:#fff}
  .item[aria-current="true"] small{color:rgba(255,255,255,.75)}
  .none{padding:24px 12px;color:var(--moss);font-size:14px}

  /* ── 무대 ── */
  .view{display:grid;grid-template-rows:1fr auto;min-height:0;padding:20px 24px 24px}
  .case{position:relative;background:var(--mat);border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px var(--rule), 0 1px 0 #fff inset}
  .case iframe{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);border:0;border-radius:8px;background:#fff}
  .case pre{position:absolute;inset:10px;margin:0;overflow:auto;border-radius:8px;padding:22px 24px;
    background:#000;color:#e8e8e8;font:13px/1.65 "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
    white-space:pre-wrap;word-break:break-all;tab-size:2}

  .plate{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding-top:16px}
  .name{font-size:clamp(22px,2.2vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
  .desc{margin-top:6px;max-width:56ch;color:var(--moss);font-size:14px;word-break:keep-all}
  .gl{display:inline-block;margin-top:8px;font-size:13px;color:var(--pine);text-decoration:underline;text-underline-offset:3px}
  .mode{display:flex;gap:4px;margin:0 24px 16px;padding:3px;border-radius:10px;background:var(--mat);border:1px solid var(--rule)}
  .mode button{flex:1;padding:7px 0;border-radius:7px;font-size:13px;color:var(--moss)}
  .mode button[aria-pressed="true"]{background:var(--pine);color:#fff;font-weight:600}
  .list[hidden]{display:none}
  .grp{list-style:none;padding:16px 12px 4px;font-size:12px;color:var(--moss)}
  /* 용어사전 탭: 오른쪽에 미리보기 카드들이 쭉 */
  .tgrid{display:none;overflow-y:auto;overflow-x:hidden;padding:4px 12px 40px}
  .view.terms{grid-template-rows:1fr;padding-top:0}
  .view.terms .tgrid{display:block}
  .view.terms .case,.view.terms .plate{display:none}
  .tsec{padding-top:24px}
  .tsec h2{font-size:18px;font-weight:700;letter-spacing:-.02em;padding-bottom:10px;border-bottom:2px solid var(--pine);display:flex;gap:8px;align-items:baseline}
  .tsec h2 small{font-size:12px;font-weight:400;color:var(--moss)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px;padding-top:18px}
  .card{display:flex;flex-direction:column;gap:5px;min-width:0;border-radius:14px;padding:8px;margin:-8px;transition:background .3s}
  .card.on{background:var(--mat)}
  .pv{position:relative;height:180px;border-radius:12px;background:var(--mat);overflow:hidden;margin-bottom:6px;box-shadow:0 0 0 1px var(--rule)}
  .pv.none::after{content:"미리보기 준비 중";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--moss)}
  .card h3{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .card h3 span{margin-left:6px;font-size:12px;font-weight:400;color:var(--moss)}
  .card p{font-size:13px;line-height:1.55;word-break:keep-all}
  .card .say{font-size:12px;color:var(--moss)}
  .card .say b{color:var(--pine);font-weight:500}
  .card .rel{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--mat)}
  button.chip:hover{border-color:var(--pine)}
  .chip.k{background:#000;color:#fff;border-color:#000}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--mat);color:var(--pine);border:1px solid var(--rule)}
  .tag:hover{border-color:var(--pine)}
  .item .tl{grid-column:1/-1;font-size:11px;color:var(--moss);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item[aria-current="true"] .tl{color:rgba(255,255,255,.7)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--pine)}
  .btn:hover{background:rgba(0,0,0,.05)}
  .btn.solid{background:var(--pine);color:#fff}
  .btn.solid:hover{background:#333}
  .btn[aria-pressed="true"]{background:var(--pine);color:var(--mat)}

  .swap{transition:opacity .22s ease, transform .22s ease}
  .swap.out{opacity:0;transform:translateY(6px)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    padding:10px 16px;border-radius:8px;background:var(--pine);color:var(--mat);font-size:14px;transition:.25s ease}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
    .index{border-right:0;border-bottom:1px solid var(--rule)}
    /* 모바일: 왼쪽 여백 16px로 한 줄에 맞추고, 테두리 겹침과 빈 공간을 줄인다 */
    .brand{padding:18px 16px 12px}
    .mode{margin:0 16px 14px}
    .cats{padding:0 16px 12px;gap:4px 16px}
    .find{margin:0 16px 12px}
    .list{max-height:32vh;padding:0 4px 8px}
    .item{padding:10px 12px}
    .view{padding:12px 16px 24px;grid-template-rows:56vh auto}
    .case{border-radius:12px}
    .case iframe{inset:0;width:100%;height:100%;border-radius:12px}
    .case pre{inset:0;border-radius:12px}
    .plate{grid-template-columns:1fr;gap:14px;padding-top:14px}
    .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .btn{padding:10px 4px;text-align:center}
    .view.terms{padding-top:0}
    .tgrid{padding:0 0 32px}
    .cards{grid-template-columns:1fr;gap:28px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="index">
    <div class="brand">
      <h1>Archive</h1>
    </div>
    <div class="mode" id="mode">
      <button data-m="items" aria-pressed="true">예시</button>
      <button data-m="terms" aria-pressed="false">용어사전</button>
    </div>
    <div class="cats" id="cats"></div>
    <label class="find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="찾기 · #태그" aria-label="이름, 설명, #태그로 찾기">
    </label>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="view" id="view">
    <div class="tgrid" id="tgrid"></div>
    <div class="case" id="case"></div>
    <div class="plate">
      <div class="swap" id="label">
        <h2 class="name" id="name"></h2>
        <p class="desc" id="desc"></p>
        <div class="tags" id="tags"></div>
      </div>
      <div class="tools">
        <button class="btn" id="codeBtn" aria-pressed="false">코드 보기</button>
        <button class="btn solid" id="copyBtn">코드 복사</button>
        <button class="btn" id="newBtn">새 창에서 열기</button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// DATA-START (build.ps1이 자동으로 채워요. 직접 고치지 마세요)
window.LIBRARY = [{"id":"blueprint-board","file":"components/blueprint-board.html","name":"청사진 Dashboard","cat":"화면","desc":"집 설계 대시보드. 방에 마우스를 올리면 도면과 면적표가 함께 빛나고, 버튼을 누르면 종이가 말려 넘어가며 청사진으로 바뀌어요","added":"2026-11-27","tags":["대시보드","페이지넘김","테마전환","호버강조","SVG"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"청사진 Dashboard\",\"cat\":\"화면\",\"desc\":\"집 설계 대시보드. 방에 마우스를 올리면 도면과 면적표가 함께 빛나고, 버튼을 누르면 종이가 말려 넘어가며 청사진으로 바뀌어요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e청사진 대시보드\u003c/title\u003e\n\u003cstyle\u003e\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%;overflow:hidden}\n  body{background:#d9d9d4;display:grid;place-items:center;\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif}\n  .mono{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif}\n\n  /* 1280×800 크기로 그린 뒤 창 크기에 맞춰 줄였다 늘였다 */\n  #stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;flex:none;overflow:hidden;border-radius:18px;\n    box-shadow:0 30px 80px rgba(0,0,0,.25);transform-origin:50% 50%}\n\n  .layer{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px;\n    background-color:var(--bg);color:var(--ink);\n    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n    background-size:24px 24px}\n  .trace{--bg:#f2f2ef;--panel:rgba(250,250,248,.75);--ink:#1c1c1e;--mute:#8a8a85;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.18);\n    --grid:rgba(0,0,0,.045);--wall:#1c1c1e;--thin:#6e6e69;--acc:#e0484a;--accbg:rgba(224,72,74,.1);--paper:#fff}\n  .blue{--bg:#1e3d98;--panel:rgba(255,255,255,.05);--ink:#eef2ff;--mute:#a9b7e6;--line:rgba(255,255,255,.2);--line2:rgba(255,255,255,.35);\n    --grid:rgba(255,255,255,.07);--wall:#eef2ff;--thin:#b8c5f2;--acc:#ffd257;--accbg:rgba(255,210,87,.12);--paper:transparent}\n\n  /* 윗줄 */\n  .top{display:flex;align-items:center;justify-content:space-between;height:40px}\n  .top .l,.top .r{display:flex;align-items:center;gap:14px}\n  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em}\n  .logo i{width:18px;height:18px;border:2px solid var(--ink);border-radius:3px;position:relative}\n  .logo i::after{content:\"\";position:absolute;left:3px;right:3px;bottom:3px;height:2px;background:var(--ink)}\n  .sep{width:1px;height:18px;background:var(--line2)}\n  .proj{font-size:14px;font-weight:600}\n  .tagbox{font-size:11px;padding:5px 9px;border:1px solid var(--line2);border-radius:6px;color:var(--ink)}\n  .due{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}\n  .due::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--acc)}\n  .scale{font-size:11px;color:var(--mute);letter-spacing:.06em}\n  .seg{display:flex;padding:3px;border-radius:999px;border:1px solid var(--line2);background:var(--panel)}\n  .seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer}\n  .seg button.on{background:var(--ink);color:var(--bg)}\n  .who{display:flex}\n  .who b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff;border:2px solid var(--bg)}\n  .who b+b{margin-left:-8px}\n\n  /* 칸들 */\n  .main{flex:1;display:grid;grid-template-columns:1.72fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;min-height:0}\n  .panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;min-height:0;position:relative}\n  .plan{grid-row:1/3}\n  .ph{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;color:var(--mute);margin-bottom:8px}\n  .ph b{font-weight:500;color:var(--ink);letter-spacing:.06em}\n\n  /* 평면도 */\n  .plan svg{flex:1;width:100%;min-height:0}\n  .room{fill:transparent;cursor:pointer;transition:fill .25s}\n  .room.on{fill:var(--accbg)}\n  .hatch{opacity:0;transition:opacity .25s;pointer-events:none}\n  .hatch.on{opacity:1}\n  .wall{stroke:var(--wall);fill:none;stroke-linecap:square}\n  .thin{stroke:var(--thin);fill:none;stroke-width:1}\n  .rl{fill:var(--ink);font-size:9px;font-weight:600;pointer-events:none;transition:fill .25s}\n  .ra{fill:var(--mute);font-size:7.5px;pointer-events:none}\n  .rl.on{fill:var(--acc)}\n  .dim{stroke:var(--thin);stroke-width:.7}\n  .dimt{fill:var(--mute);font-size:6.5px}\n  .note{fill:none;stroke:var(--acc);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.4s .5s ease forwards}\n  .notet{fill:var(--acc);font-size:9.5px;font-style:italic;font-family:\"Segoe Print\",\"Comic Sans MS\",cursive;opacity:0;animation:fade .6s 2.2s forwards}\n  @keyframes draw{to{stroke-dashoffset:0}}\n  @keyframes fade{to{opacity:1}}\n\n  /* 일조 */\n  .sun svg{width:100%;flex:1;min-height:0}\n  .sunrow{display:flex;justify-content:space-between;align-items:end}\n  .sunrow small{display:block;font-size:11px;color:var(--mute)}\n  .sunrow small+small{margin-top:4px;color:var(--ink);font-size:12px}\n  .pct{font-size:34px;font-weight:600;letter-spacing:-.03em}\n  .sun{cursor:ew-resize}\n\n  /* 면적 */\n  .rows{display:flex;flex-direction:column;flex:1;justify-content:space-between}\n  .ar{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;\n    border-bottom:1px dashed var(--line);transition:background .2s,color .2s}\n  .ar span:last-child{font-size:11.5px}\n  .ar.on{background:var(--accbg);color:var(--acc)}\n  .tot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--mute)}\n  .tot b{color:var(--ink)}\n\n  /* 자재 */\n  .mat{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}\n  .mat:last-child{border:0}\n  .mat svg{width:42px;height:34px;flex:none;border:1px solid var(--line2);border-radius:4px;background:var(--paper)}\n  .mat small{font-size:9px;color:var(--mute);letter-spacing:.1em}\n  .mat b{display:block;font-size:13px;font-weight:600;margin:1px 0}\n  .mat span{font-size:10.5px;color:var(--mute)}\n\n  /* 공사비 */\n  .cost .big{font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1.1}\n  .cost .delta{font-size:11px;color:var(--mute);margin-top:4px}\n  .cost .delta b{color:var(--acc);font-weight:600}\n  .bars{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:14px 0 12px;height:30px}\n  .bars i{border:1px solid var(--line2);border-radius:2px}\n  .bars i.f{background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.75}\n  .bk{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px 14px;font-size:11px;color:var(--mute)}\n  .bk b{color:var(--ink);font-weight:500;text-align:right}\n\n  /* 종이 넘김 */\n  .flapwrap{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(-10px 14px 18px rgba(0,0,0,.28));z-index:9}\n  .flap{position:absolute;inset:0;background:linear-gradient(225deg,#ffffff 0%,#ececea 45%,#d4d4cf 100%);\n    background-image:linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px),\n      linear-gradient(225deg,#ffffff 0%,#ededea 45%,#cfcfca 100%);background-size:24px 24px,24px 24px,auto}\n  .flap.dark{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),\n      linear-gradient(225deg,#3a59b8 0%,#24449f 45%,#16307a 100%)}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv id=\"stage\"\u003e\u003c/div\u003e\n\n\u003cscript\u003e\nconst ROOMS = [\n  { id: \u0027living\u0027, name: \u0027거실 / 주방\u0027, a: 26.8, r: [40, 40, 170, 125], lx: 70, ly: 128 },\n  { id: \u0027study\u0027,  name: \u0027서재\u0027,       a: 7.4,  r: [210, 40, 80, 62],   lx: 228, ly: 66 },\n  { id: \u0027bath\u0027,   name: \u0027욕실\u0027,       a: 5.3,  r: [210, 102, 80, 63],  lx: 228, ly: 128 },\n  { id: \u0027hall\u0027,   name: \u0027복도\u0027,       a: 8.2,  r: [40, 165, 250, 22],  lx: 125, ly: 179 },\n  { id: \u0027bed1\u0027,   name: \u0027안방\u0027,       a: 12.5, r: [40, 187, 115, 88],  lx: 80, ly: 230 },\n  { id: \u0027bed2\u0027,   name: \u0027작은방\u0027,     a: 8.6,  r: [155, 187, 70, 88],  lx: 170, ly: 230 },\n  { id: \u0027util\u0027,   name: \u0027다용도실\u0027,   a: 4.9,  r: [225, 187, 65, 88],  lx: 238, ly: 230 },\n];\nconst state = { room: null, t: .55, view: \u0027trace\u0027, busy: false, sunHover: false };\n\nfunction planSVG(th) {\n  const P = `hp-${th}`;\n  return `\n  \u003csvg viewBox=\"0 0 330 320\" preserveAspectRatio=\"xMidYMid meet\"\u003e\n    \u003cdefs\u003e\n      \u003cpattern id=\"${P}\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"\u003e\n        \u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"var(--acc)\" stroke-width=\"1\" opacity=\".55\"/\u003e\n      \u003c/pattern\u003e\n    \u003c/defs\u003e\n    \u003c!-- 치수선 --\u003e\n    \u003cline class=\"dim\" x1=\"40\" y1=\"22\" x2=\"210\" y2=\"22\"/\u003e\u003cline class=\"dim\" x1=\"210\" y1=\"22\" x2=\"290\" y2=\"22\"/\u003e\n    \u003cline class=\"dim\" x1=\"40\" y1=\"18\" x2=\"40\" y2=\"26\"/\u003e\u003cline class=\"dim\" x1=\"210\" y1=\"18\" x2=\"210\" y2=\"26\"/\u003e\u003cline class=\"dim\" x1=\"290\" y1=\"18\" x2=\"290\" y2=\"26\"/\u003e\n    \u003ctext class=\"dimt mono\" x=\"118\" y=\"18\"\u003e6 425\u003c/text\u003e\u003ctext class=\"dimt mono\" x=\"243\" y=\"18\"\u003e3 010\u003c/text\u003e\n    \u003cline class=\"dim\" x1=\"22\" y1=\"40\" x2=\"22\" y2=\"275\"/\u003e\n    \u003cline class=\"dim\" x1=\"18\" y1=\"40\" x2=\"26\" y2=\"40\"/\u003e\u003cline class=\"dim\" x1=\"18\" y1=\"165\" x2=\"26\" y2=\"165\"/\u003e\u003cline class=\"dim\" x1=\"18\" y1=\"275\" x2=\"26\" y2=\"275\"/\u003e\n    \u003ctext class=\"dimt mono\" x=\"14\" y=\"110\" transform=\"rotate(-90 14 110)\"\u003e4 725\u003c/text\u003e\n    \u003ctext class=\"dimt mono\" x=\"14\" y=\"228\" transform=\"rotate(-90 14 228)\"\u003e4 120\u003c/text\u003e\n\n    \u003c!-- 방 (마우스 영역 + 빗금) --\u003e\n    ${ROOMS.map(r =\u003e `\n      \u003crect class=\"room\" data-room=\"${r.id}\" x=\"${r.r[0]}\" y=\"${r.r[1]}\" width=\"${r.r[2]}\" height=\"${r.r[3]}\"/\u003e\n      \u003crect class=\"hatch\" data-room=\"${r.id}\" x=\"${r.r[0]}\" y=\"${r.r[1]}\" width=\"${r.r[2]}\" height=\"${r.r[3]}\" fill=\"url(#${P})\"/\u003e`).join(\u0027\u0027)}\n\n    \u003c!-- 가구 --\u003e\n    \u003crect class=\"thin\" x=\"86\" y=\"64\" width=\"72\" height=\"26\" rx=\"6\"/\u003e\n    ${[0,1,2,3].map(i =\u003e `\u003ccircle class=\"thin\" cx=\"${96 + i * 17}\" cy=\"58\" r=\"4\"/\u003e\u003ccircle class=\"thin\" cx=\"${96 + i * 17}\" cy=\"96\" r=\"4\"/\u003e`).join(\u0027\u0027)}\n    \u003crect class=\"thin\" x=\"150\" y=\"128\" width=\"46\" height=\"22\" rx=\"3\"/\u003e\n    \u003crect class=\"thin\" x=\"48\" y=\"48\" width=\"26\" height=\"60\"/\u003e\n    \u003crect class=\"thin\" x=\"236\" y=\"48\" width=\"44\" height=\"18\"/\u003e\n    \u003crect class=\"thin\" x=\"262\" y=\"110\" width=\"20\" height=\"44\" rx=\"8\"/\u003e\n    \u003ccircle class=\"thin\" cx=\"228\" cy=\"150\" r=\"6\"/\u003e\n    \u003crect class=\"thin\" x=\"52\" y=\"195\" width=\"58\" height=\"46\"/\u003e\u003crect class=\"thin\" x=\"52\" y=\"195\" width=\"58\" height=\"10\"/\u003e\n    \u003crect class=\"thin\" x=\"162\" y=\"200\" width=\"30\" height=\"44\"/\u003e\n    \u003crect class=\"thin\" x=\"236\" y=\"252\" width=\"44\" height=\"16\"/\u003e\n\n    \u003c!-- 벽 --\u003e\n    \u003crect class=\"wall\" x=\"40\" y=\"40\" width=\"250\" height=\"235\" stroke-width=\"6\"/\u003e\n    \u003cpath class=\"wall\" stroke-width=\"3\" d=\"M210 40V95 M210 112V165 M210 102H290 M40 165H120 M140 165H200 M220 165H290\n      M40 187H85 M105 187H170 M190 187H240 M260 187H290 M155 187V275 M225 187V275\"/\u003e\n    \u003c!-- 문 --\u003e\n    \u003cpath class=\"thin\" d=\"M210 95 A17 17 0 0 1 193 112 M120 165 A20 20 0 0 0 140 145 M85 187 A20 20 0 0 1 105 207 M170 187 A20 20 0 0 0 190 207 M240 187 A20 20 0 0 1 260 207\"/\u003e\n    \u003c!-- 창 --\u003e\n    \u003cpath class=\"thin\" d=\"M90 37V43 M150 37V43 M90 40H150 M287 60V90 M37 60V120 M37 210V255\"/\u003e\n\n    \u003c!-- 테라스 --\u003e\n    \u003crect x=\"120\" y=\"275\" width=\"130\" height=\"24\" fill=\"none\" stroke=\"var(--thin)\" stroke-dasharray=\"3 3\"/\u003e\n    \u003ctext class=\"ra mono\" x=\"158\" y=\"291\"\u003e테라스 · 15.6 m²\u003c/text\u003e\n    \u003c!-- 방위 --\u003e\n    \u003cg transform=\"translate(300 292)\"\u003e\u003ccircle class=\"thin\" r=\"9\"/\u003e\u003cpath d=\"M0 -6 L4 5 L0 2 L-4 5Z\" fill=\"var(--ink)\"/\u003e\u003ctext class=\"dimt mono\" x=\"-2.5\" y=\"-11\"\u003eN\u003c/text\u003e\u003c/g\u003e\n\n    \u003c!-- 이름 --\u003e\n    ${ROOMS.map(r =\u003e `\u003ctext class=\"rl\" data-room=\"${r.id}\" x=\"${r.lx}\" y=\"${r.ly}\"\u003e${r.name}\u003c/text\u003e\n      \u003ctext class=\"ra mono\" x=\"${r.lx}\" y=\"${r.ly + 10}\"\u003e${r.a} m²\u003c/text\u003e`).join(\u0027\u0027)}\n\n    \u003c!-- 손메모 --\u003e\n    \u003cpath class=\"note\" d=\"M80 62 C 76 50, 120 46, 140 52 S 170 54, 166 72 S 168 100, 140 99 S 90 104, 82 92 S 78 70, 84 64\"/\u003e\n    \u003cpath class=\"note\" d=\"M150 52 C 160 40, 172 34, 182 33\"/\u003e\n    \u003ctext class=\"notet\" x=\"92\" y=\"34\" transform=\"rotate(-5 92 34)\"\u003e식탁 1.8m → 2.1m?\u003c/text\u003e\n  \u003c/svg\u003e`;\n}\n\nfunction sunSVG() {\n  return `\n  \u003csvg viewBox=\"0 0 200 110\" preserveAspectRatio=\"xMidYMid meet\"\u003e\n    \u003cpath d=\"M30 95 A70 70 0 0 1 170 95\" fill=\"none\" stroke=\"var(--thin)\" stroke-dasharray=\"2 3\"/\u003e\n    \u003cline x1=\"20\" y1=\"95\" x2=\"180\" y2=\"95\" stroke=\"var(--line2)\"/\u003e\n    \u003cg class=\"shadow\"\u003e\u003cpolygon points=\"82,62 122,62 122,88 82,88\" fill=\"var(--ink)\" opacity=\".12\"/\u003e\u003c/g\u003e\n    \u003crect x=\"82\" y=\"62\" width=\"40\" height=\"26\" fill=\"var(--paper)\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/\u003e\n    \u003cpath d=\"M82 62 L102 52 L122 62\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.2\"/\u003e\n    \u003cg class=\"sundot\"\u003e\u003ccircle r=\"7\" fill=\"var(--acc)\" opacity=\".22\"/\u003e\u003ccircle r=\"3.4\" fill=\"var(--acc)\"/\u003e\u003c/g\u003e\n  \u003c/svg\u003e`;\n}\n\nconst MATS = [\n  { k: \u0027M01\u0027, n: \u0027낙엽송 사이딩\u0027, d: \u0027세로 시공 · 140mm\u0027, p: \u0027v\u0027 },\n  { k: \u0027M02\u0027, n: \u0027재생 벽돌\u0027, d: \u0027플레미시 쌓기\u0027, p: \u0027b\u0027 },\n  { k: \u0027M03\u0027, n: \u0027징크 지붕\u0027, d: \u0027스탠딩 심 · 430\u0027, p: \u0027z\u0027 },\n];\nfunction matSwatch(p) {\n  if (p === \u0027v\u0027) return `\u003csvg viewBox=\"0 0 42 34\"\u003e${Array.from({ length: 8 }, (_, i) =\u003e `\u003cline x1=\"${4 + i * 5}\" y1=\"0\" x2=\"${4 + i * 5}\" y2=\"34\" stroke=\"var(--ink)\" stroke-width=\".7\"/\u003e`).join(\u0027\u0027)}\u003c/svg\u003e`;\n  if (p === \u0027b\u0027) return `\u003csvg viewBox=\"0 0 42 34\"\u003e${Array.from({ length: 5 }, (_, r) =\u003e Array.from({ length: 4 }, (_, c) =\u003e\n      `\u003crect x=\"${(r % 2 ? -5 : 0) + c * 12 + 1}\" y=\"${r * 7 + 1}\" width=\"10\" height=\"5\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\".7\"/\u003e`).join(\u0027\u0027)).join(\u0027\u0027)}\u003c/svg\u003e`;\n  return `\u003csvg viewBox=\"0 0 42 34\"\u003e${Array.from({ length: 5 }, (_, i) =\u003e `\u003cpath d=\"M${4 + i * 8} 0V34\" stroke=\"var(--ink)\" stroke-width=\"1.4\"/\u003e\u003cpath d=\"M${8 + i * 8} 0V34\" stroke=\"var(--ink)\" stroke-width=\".4\"/\u003e`).join(\u0027\u0027)}\u003c/svg\u003e`;\n}\n\nfunction layerHTML(th) {\n  const total = ROOMS.reduce((s, r) =\u003e s + r.a, 0).toFixed(1);\n  return `\n  \u003cdiv class=\"top\"\u003e\n    \u003cdiv class=\"l\"\u003e\n      \u003cdiv class=\"logo\"\u003e\u003ci\u003e\u003c/i\u003e도면함\u003c/div\u003e\u003cspan class=\"sep\"\u003e\u003c/span\u003e\n      \u003cspan class=\"proj\"\u003e연남동 주택\u003c/span\u003e\n      \u003cspan class=\"tagbox mono\"\u003eA-102 · 1층\u003c/span\u003e\n      \u003cspan class=\"due\"\u003e인허가 결정까지 19일\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"r\"\u003e\n      \u003cspan class=\"scale mono\"\u003e1:100 @ A1 · REV C\u003c/span\u003e\n      \u003cdiv class=\"seg\"\u003e\u003cbutton data-v=\"trace\" class=\"${th === \u0027trace\u0027 ? \u0027on\u0027 : \u0027\u0027}\"\u003e트레이스\u003c/button\u003e\u003cbutton data-v=\"blue\" class=\"${th === \u0027blue\u0027 ? \u0027on\u0027 : \u0027\u0027}\"\u003e청사진\u003c/button\u003e\u003c/div\u003e\n      \u003cdiv class=\"who\"\u003e\u003cb style=\"background:#e0484a\"\u003e한\u003c/b\u003e\u003cb style=\"background:#6d6af0\"\u003e민\u003c/b\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"main\"\u003e\n    \u003csection class=\"panel plan\"\u003e\u003cdiv class=\"ph mono\"\u003e\u003cspan\u003e01 — 1층 평면도\u003c/span\u003e\u003cb\u003e연면적 85.0 m²\u003c/b\u003e\u003c/div\u003e${planSVG(th)}\u003c/section\u003e\n    \u003csection class=\"panel sun\"\u003e\u003cdiv class=\"ph mono\"\u003e\u003cspan\u003e02 — 일조 분석\u003c/span\u003e\u003cb\u003e하지\u003c/b\u003e\u003c/div\u003e${sunSVG()}\n      \u003cdiv class=\"sunrow\"\u003e\u003cdiv\u003e\u003csmall class=\"mono suntime\"\u003e6월 21일 · 14:20\u003c/small\u003e\u003csmall\u003e거실 볕 드는 정도\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"pct\"\u003e0%\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n    \u003csection class=\"panel\"\u003e\u003cdiv class=\"ph mono\"\u003e\u003cspan\u003e03 — 면적\u003c/span\u003e\u003cb\u003em²\u003c/b\u003e\u003c/div\u003e\n      \u003cdiv class=\"rows\"\u003e${ROOMS.map(r =\u003e `\u003cdiv class=\"ar\" data-room=\"${r.id}\"\u003e\u003cspan\u003e${r.name}\u003c/span\u003e\u003cspan class=\"mono\"\u003e${r.a.toFixed(1)}\u003c/span\u003e\u003c/div\u003e`).join(\u0027\u0027)}\u003c/div\u003e\n      \u003cdiv class=\"tot mono\"\u003e\u003cspan\u003e전용 ${total}\u003c/span\u003e\u003cb\u003e연면적 85.0\u003c/b\u003e\u003c/div\u003e\u003c/section\u003e\n    \u003csection class=\"panel\"\u003e\u003cdiv class=\"ph mono\"\u003e\u003cspan\u003e04 — 자재\u003c/span\u003e\u003cb\u003e3\u003c/b\u003e\u003c/div\u003e\n      ${MATS.map(m =\u003e `\u003cdiv class=\"mat\"\u003e${matSwatch(m.p)}\u003cdiv\u003e\u003csmall class=\"mono\"\u003e${m.k}\u003c/small\u003e\u003cb\u003e${m.n}\u003c/b\u003e\u003cspan\u003e${m.d}\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e`).join(\u0027\u0027)}\u003c/section\u003e\n    \u003csection class=\"panel cost\"\u003e\u003cdiv class=\"ph mono\"\u003e\u003cspan\u003e05 — 공사비\u003c/span\u003e\u003cb\u003eREV C\u003c/b\u003e\u003c/div\u003e\n      \u003cdiv class=\"big\"\u003e₩5억 1,200만\u003c/div\u003e\n      \u003cdiv class=\"delta\"\u003e\u003cb\u003e+₩640만\u003c/b\u003e B안 대비 · 예비비 7.5%\u003c/div\u003e\n      \u003cdiv class=\"bars\"\u003e${Array.from({ length: 20 }, (_, i) =\u003e `\u003ci class=\"${i \u003c 14 ? \u0027f\u0027 : \u0027\u0027}\"\u003e\u003c/i\u003e`).join(\u0027\u0027)}\u003c/div\u003e\n      \u003cdiv class=\"bk mono\"\u003e\u003cspan\u003e골조\u003c/span\u003e\u003cb\u003e34%\u003c/b\u003e\u003cspan\u003e외피\u003c/span\u003e\u003cb\u003e25%\u003c/b\u003e\u003cspan\u003e마감\u003c/span\u003e\u003cb\u003e22%\u003c/b\u003e\u003cspan\u003e설비\u003c/span\u003e\u003cb\u003e19%\u003c/b\u003e\u003c/div\u003e\u003c/section\u003e\n  \u003c/div\u003e`;\n}\n\n// 두 장(트레이스 / 청사진)을 겹쳐 놓고, 위의 장을 말아서 넘긴다\nconst stage = document.getElementById(\u0027stage\u0027);\nconst L = {};\nfor (const th of [\u0027blue\u0027, \u0027trace\u0027]) {\n  const d = document.createElement(\u0027div\u0027);\n  d.className = `layer ${th}`; d.innerHTML = layerHTML(th); stage.append(d); L[th] = d;\n}\nconst flapWrap = document.createElement(\u0027div\u0027); flapWrap.className = \u0027flapwrap\u0027;\nconst flap = document.createElement(\u0027div\u0027); flap.className = \u0027flap\u0027; flapWrap.append(flap); stage.append(flapWrap);\nflapWrap.style.display = \u0027none\u0027;\n\n// 방 강조 (두 장 모두)\nfunction setRoom(id) {\n  state.room = id;\n  stage.querySelectorAll(\u0027[data-room]\u0027).forEach(el =\u003e el.classList.toggle(\u0027on\u0027, el.dataset.room === id));\n}\nstage.addEventListener(\u0027pointerover\u0027, e =\u003e { const el = e.target.closest(\u0027[data-room]\u0027); setRoom(el ? el.dataset.room : null); });\nstage.addEventListener(\u0027pointerleave\u0027, () =\u003e setRoom(null));\n\n// 일조\nfunction drawSun() {\n  const t = state.t, a = Math.PI * (1 - t);\n  const x = 100 + Math.cos(a) * 70, y = 95 - Math.sin(a) * 70;\n  const mins = Math.round(6 * 60 + t * 14 * 60), hh = String(Math.floor(mins / 60)).padStart(2, \u00270\u0027), mm = String(mins % 60).padStart(2, \u00270\u0027);\n  const pct = Math.round(38 + 46 * Math.sin(Math.PI * Math.min(1, t * 1.15)));\n  const sx = -Math.cos(a) * 26, sh = Math.max(4, 40 * (1 - Math.sin(a)));\n  stage.querySelectorAll(\u0027.sundot\u0027).forEach(g =\u003e g.setAttribute(\u0027transform\u0027, `translate(${x} ${y})`));\n  stage.querySelectorAll(\u0027.shadow polygon\u0027).forEach(p =\u003e p.setAttribute(\u0027points\u0027,\n    `82,88 122,88 ${122 - sx},${88 + 0} ${122 - sx * 1.2},${88 + sh * .18} ${82 - sx * 1.2},${88 + sh * .18}`));\n  stage.querySelectorAll(\u0027.suntime\u0027).forEach(s =\u003e s.textContent = `6월 21일 · ${hh}:${mm}`);\n  stage.querySelectorAll(\u0027.pct\u0027).forEach(s =\u003e s.textContent = pct + \u0027%\u0027);\n}\nstage.addEventListener(\u0027pointermove\u0027, e =\u003e {\n  const p = e.target.closest(\u0027.sun\u0027); state.sunHover = !!p;\n  if (p) { const r = p.getBoundingClientRect(); state.t = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); drawSun(); }\n});\nlet dir = 1;\n(function idle() { if (!state.sunHover) { state.t += dir * .0009; if (state.t \u003e .95 || state.t \u003c .05) dir *= -1; drawSun(); } requestAnimationFrame(idle); })();\n\n// 종이 말아 넘기기\nconst W = 1280, H = 800;\nfunction clip(poly, f) { // f(p) \u003c= 0 인 쪽만 남긴다\n  const out = [];\n  for (let i = 0; i \u003c poly.length; i++) {\n    const a = poly[i], b = poly[(i + 1) % poly.length], fa = f(a), fb = f(b);\n    if (fa \u003c= 0) out.push(a);\n    if ((fa \u003c= 0) !== (fb \u003c= 0)) { const t = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }\n  }\n  return out;\n}\nconst poly = pts =\u003e pts.length \u003e 2 ? `polygon(${pts.map(p =\u003e `${p[0].toFixed(1)}px ${p[1].toFixed(1)}px`).join(\u0027,\u0027)})` : \u0027polygon(0 0,0 0,0 0)\u0027;\nconst RECT = [[0, 0], [W, 0], [W, H], [0, H]];\nconst ease = t =\u003e t \u003c .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\n\nfunction flip(to) {\n  if (state.busy || to === state.view) return;\n  state.busy = true;\n  const top = L[state.view], under = L[to];\n  under.style.zIndex = 1; top.style.zIndex = 2;\n  flap.classList.toggle(\u0027dark\u0027, state.view === \u0027blue\u0027);\n  flapWrap.style.display = \u0027\u0027;\n  stage.querySelectorAll(\u0027.seg button\u0027).forEach(b =\u003e b.classList.toggle(\u0027on\u0027, b.dataset.v === to));\n  const start = performance.now(), D = 1300, k0 = W, k1 = -H - 260;\n  (function step(now) {\n    const p = Math.min(1, (now - start) / D), k = k0 + (k1 - k0) * ease(p);\n    const stay = clip(RECT, q =\u003e q[0] - q[1] - k);\n    const peeled = clip(RECT, q =\u003e k - (q[0] - q[1]));\n    // 접힌 부분: 접는 선을 기준으로 뒤집고, 살짝 말려 들어가게 줄인다\n    const curl = .92;\n    const flapPts = peeled.map(([x, y]) =\u003e {\n      const rx = y + k, ry = x - k;                        // 선 대칭\n      const fx = (x + y + k) / 2, fy = (x + y - k) / 2;     // 접는 선 위의 발\n      return [fx + (rx - fx) * curl, fy + (ry - fy) * curl];\n    });\n    top.style.clipPath = poly(stay);\n    flap.style.clipPath = poly(flapPts);\n    if (p \u003c 1) requestAnimationFrame(step);\n    else {\n      top.style.clipPath = \u0027\u0027; top.style.zIndex = 0; under.style.zIndex = 2;\n      flapWrap.style.display = \u0027none\u0027; state.view = to; state.busy = false;\n    }\n  })(start);\n}\nstage.addEventListener(\u0027click\u0027, e =\u003e { const b = e.target.closest(\u0027.seg button\u0027); if (b) flip(b.dataset.v); });\nL.trace.style.zIndex = 2; L.blue.style.zIndex = 0;\n\n// 창 크기에 맞추기\nfunction fit() { const s = Math.min(innerWidth / (W + 40), innerHeight / (H + 40)); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }\naddEventListener(\u0027resize\u0027, fit); fit(); drawSun();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"bonfire","file":"components/bonfire.html","name":"모닥불 Hold Button","cat":"화면","desc":"버튼을 길게 누르면 읽지 않은 메일이 불타 사라지고 고요한 밤하늘 화면으로 바뀌어요","added":"2026-11-27","tags":["길게누르기","확인버튼","파티클","화면전환"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"모닥불 Hold Button\",\"cat\":\"화면\",\"desc\":\"버튼을 길게 누르면 읽지 않은 메일이 불타 사라지고 고요한 밤하늘 화면으로 바뀌어요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e받은편지함 모닥불\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--heat:0;--ease:cubic-bezier(.65,0,.25,1)}\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%;overflow:hidden}\n  body{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;background:#0a0d0c;color:#1b1a18;\n    -webkit-font-smoothing:antialiased}\n  .screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity 1.1s var(--ease),filter 1.1s var(--ease)}\n  .screen.off{opacity:0;pointer-events:none;visibility:hidden;transition:opacity 1.1s var(--ease),filter 1.1s var(--ease),visibility 0s 1.1s}\n  header{display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(12px,3vw,28px) clamp(14px,3.4vw,34px);gap:12px;flex:none}\n  .mark{font-weight:800;font-size:15px;letter-spacing:-.03em}\n  .tag{font-size:12px;color:#8a857d;margin-top:3px}\n  .hint{font-size:12px;color:#8a857d;white-space:nowrap;display:flex;align-items:center;gap:6px}\n  .hint kbd{font:inherit;font-size:11px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7}\n  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\n    padding:0 18px clamp(16px,6vh,60px);gap:clamp(8px,2.2vh,18px);min-height:0}\n  .status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#6d685f;font-variant-numeric:tabular-nums}\n  .dot{width:7px;height:7px;border-radius:50%;background:#2fb36b;box-shadow:0 0 0 3px rgba(47,179,107,.18)}\n  h1{font-size:clamp(26px,min(7vw,11vh),68px);line-height:1.08;letter-spacing:-.045em;font-weight:800}\n  .body{font-size:clamp(13px,1.6vw,16px);color:#7d786f;max-width:34em;line-height:1.5}\n  .small{font-size:12px;color:#9a948a}\n\n  /* 화면 1 */\n  #s1{background:#f6f3ee}\n  #s1::before{content:\"\";position:absolute;inset:0;pointer-events:none;\n    background:radial-gradient(120% 70% at 50% 115%,rgba(255,120,30,calc(var(--heat)*.55)),rgba(255,170,60,calc(var(--heat)*.25)) 45%,transparent 75%);\n    }\n  #s1\u003e*{position:relative}\n  .ch{display:inline-block;transition:color .25s,text-shadow .25s,opacity .25s}\n  .ch.warm{color:#7a3a12;text-shadow:0 0 6px rgba(255,140,40,.55)}\n  .ch.char{color:#2a1a10;text-shadow:0 0 10px rgba(255,110,20,.9),0 0 2px #ff9b3d;animation:flick .18s steps(2) infinite alternate}\n  @keyframes flick{to{opacity:.72;text-shadow:0 0 14px rgba(255,90,10,1),0 0 3px #ffc070}}\n\n  .hold{position:relative;border:0;border-radius:999px;background:#151413;color:#fff;font:inherit;font-weight:650;font-size:15px;\n    padding:15px 28px;cursor:pointer;letter-spacing:-.01em;touch-action:none;user-select:none;-webkit-user-select:none;\n    box-shadow:0 10px 26px rgba(20,18,16,.22),0 2px 5px rgba(20,18,16,.18);\n    transition:transform .2s var(--ease),box-shadow .3s}\n  .hold:focus-visible{outline:2px solid #e2701e;outline-offset:5px}\n  .hold.on{transform:scale(.97);box-shadow:0 0 calc(var(--heat)*40px) rgba(255,120,30,calc(var(--heat)*.8)),0 6px 18px rgba(20,18,16,.25)}\n  .hold .fill{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}\n  .hold .fill::before{content:\"\";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--heat));\n    background:linear-gradient(90deg,#5a1d06,#c2410c 70%,#f59e0b)}\n  .hold span{position:relative}\n  .ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;overflow:visible}\n  .ring rect{fill:none;stroke:#e8711d;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100;\n    filter:drop-shadow(0 0 4px rgba(255,130,30,.8));opacity:calc(var(--heat)*4)}\n\n  /* 화면 2 */\n  #s2{background:#050807;color:#eef3ef}\n  #sky{position:absolute;inset:0;width:100%;height:100%}\n  .aurora{position:absolute;left:-20%;right:-20%;bottom:-30%;height:75%;pointer-events:none;filter:blur(30px);\n    background:radial-gradient(40% 50% at 30% 70%,rgba(40,220,140,.35),transparent 70%),\n               radial-gradient(45% 45% at 70% 75%,rgba(20,170,150,.32),transparent 70%),\n               radial-gradient(60% 40% at 50% 95%,rgba(70,255,170,.28),transparent 70%);\n    animation:sway 14s ease-in-out infinite alternate}\n  @keyframes sway{to{transform:translateX(6%) scaleY(1.12)}}\n  #s2\u003eheader,#s2\u003emain{position:relative}\n  #s2 .tag,#s2 .hint{color:#7e8b84}\n  #s2 .status{color:#8fa198}\n  #s2 .dot{background:#5de0a0;box-shadow:0 0 10px #5de0a0}\n  #s2 .body{color:#93a39b}\n  .note{width:min(320px,82vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#eef3ef;\n    font:inherit;font-size:14px;padding:12px 16px;outline:none;transition:border-color .2s,background .2s}\n  .note::placeholder{color:#76857d}\n  .note:focus-visible{border-color:#5de0a0;background:rgba(255,255,255,.09)}\n  .quiet{border:0;border-radius:999px;background:#f3f6f4;color:#0b0f0d;font:inherit;font-weight:650;font-size:15px;padding:13px 26px;cursor:pointer;\n    transition:transform .2s var(--ease),box-shadow .3s}\n  .quiet:hover{box-shadow:0 0 30px rgba(93,224,160,.35)}\n  .quiet:active{transform:scale(.97)}\n  .quiet:focus-visible,.revive:focus-visible{outline:2px solid #5de0a0;outline-offset:4px}\n  .revive{background:none;border:0;color:#7e8b84;font:inherit;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;border-radius:4px}\n  .revive:hover{color:#cfe0d7}\n  .toast{font-size:12px;color:#5de0a0;min-height:1.2em;transition:opacity .4s}\n\n  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}\n  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n\n  @media (max-height:380px){main{gap:6px}.body{display:none}#s2 .note{padding:8px 12px}}\n  @media (prefers-reduced-motion:reduce){\n    .aurora{animation:none}.ch.char{animation:none}\n    .screen,.screen.off{transition-duration:.3s}\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003csection class=\"screen\" id=\"s1\" aria-labelledby=\"h1a\"\u003e\n  \u003cheader\u003e\n    \u003cdiv\u003e\u003cdiv class=\"mark\"\u003e모닥불\u003c/div\u003e\u003cdiv class=\"tag\"\u003e쌓인 걸 태우고, 조용히 시작하기\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"hint\"\u003e길게 눌러 확인\u003c/div\u003e\n  \u003c/header\u003e\n  \u003cmain\u003e\n    \u003cdiv class=\"status\"\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003cspan\u003e\u003cb id=\"cnt\"\u003e2,318\u003c/b\u003e통 안 읽은 메일 · 뉴스레터 41개\u003c/span\u003e\u003c/div\u003e\n    \u003ch1 id=\"h1a\" class=\"burn\"\u003e받은편지함을\u003cbr\u003e모두 태울까요?\u003c/h1\u003e\n    \u003cp class=\"body burn\"\u003e답장 못 한 미안함까지 전부 장작으로 쓸게요. 중요한 건 이미 기억하고 있을 거예요.\u003c/p\u003e\n    \u003cbutton class=\"hold\" id=\"hold\" aria-describedby=\"hh\"\u003e\n      \u003cspan class=\"fill\"\u003e\u003c/span\u003e\n      \u003csvg class=\"ring\" aria-hidden=\"true\" preserveAspectRatio=\"none\"\u003e\u003crect x=\"1.5\" y=\"1.5\" rx=\"0\" pathLength=\"100\"/\u003e\u003c/svg\u003e\n      \u003cspan\u003e길게 눌러 모두 태우기\u003c/span\u003e\n    \u003c/button\u003e\n    \u003cp class=\"small\" id=\"hh\"\u003e누르고 계세요. 손을 떼면 취소돼요.\u003c/p\u003e\n  \u003c/main\u003e\n\u003c/section\u003e\n\n\u003csection class=\"screen off\" id=\"s2\" aria-labelledby=\"h1b\"\u003e\n  \u003ccanvas id=\"sky\" aria-hidden=\"true\"\u003e\u003c/canvas\u003e\n  \u003cdiv class=\"aurora\" aria-hidden=\"true\"\u003e\u003c/div\u003e\n  \u003cheader\u003e\n    \u003cdiv\u003e\u003cdiv class=\"mark\"\u003e모닥불 — 그 후\u003c/div\u003e\u003cdiv class=\"tag\"\u003e재가 식는 동안 잠시 쉬어요\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"hint\"\u003e안 읽은 메일 0\u003c/div\u003e\n  \u003c/header\u003e\n  \u003cmain\u003e\n    \u003cdiv class=\"status\"\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003cspan\u003e0통\u003c/span\u003e\u003c/div\u003e\n    \u003ch1 id=\"h1b\" tabindex=\"-1\" style=\"outline:none\"\u003e받은편지함 제로.\u003c/h1\u003e\n    \u003cp class=\"body\"\u003e지금 당신을 찾는 건 아무것도 없어요.\u003c/p\u003e\n    \u003clabel class=\"sr\" for=\"note\"\u003e부재중 메시지\u003c/label\u003e\n    \u003cinput class=\"note\" id=\"note\" type=\"text\" placeholder=\"부재중 메시지 남기기\" autocomplete=\"off\"\u003e\n    \u003cbutton class=\"quiet\" id=\"quiet\"\u003e조용히 지내기\u003c/button\u003e\n    \u003cp class=\"toast\" id=\"toast\" aria-live=\"polite\"\u003e\u003c/p\u003e\n    \u003cbutton class=\"revive\" id=\"revive\"\u003e2,318통 되살리기\u003c/button\u003e\n  \u003c/main\u003e\n\u003c/section\u003e\n\n\u003ccanvas id=\"fx\" aria-hidden=\"true\"\u003e\u003c/canvas\u003e\n\u003cp class=\"sr\" aria-live=\"polite\" id=\"live\"\u003e\u003c/p\u003e\n\n\u003cscript\u003e\n(()=\u003e{\n  const TOTAL=2318, HOLD=2200;\n  const reduce=matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027).matches;\n  const root=document.documentElement, s1=document.getElementById(\u0027s1\u0027), s2=document.getElementById(\u0027s2\u0027);\n  const btn=document.getElementById(\u0027hold\u0027), cnt=document.getElementById(\u0027cnt\u0027), live=document.getElementById(\u0027live\u0027);\n  const ringRect=btn.querySelector(\u0027.ring rect\u0027);\n  const fx=document.getElementById(\u0027fx\u0027), g=fx.getContext(\u00272d\u0027);\n  const sky=document.getElementById(\u0027sky\u0027), sg=sky.getContext(\u00272d\u0027);\n  let W=0,H=0,dpr=1;\n\n  // 글자를 한 자씩 쪼개 그을림 효과용 span으로\n  const chars=[];\n  document.querySelectorAll(\u0027.burn\u0027).forEach(el=\u003e{\n    const walk=n=\u003e{\n      [...n.childNodes].forEach(c=\u003e{\n        if(c.nodeType===3){\n          const f=document.createDocumentFragment();\n          [...c.textContent].forEach(t=\u003e{\n            if(t===\u0027 \u0027){f.appendChild(document.createTextNode(\u0027 \u0027));return}\n            const s=document.createElement(\u0027span\u0027);s.className=\u0027ch\u0027;s.textContent=t;s.dataset.t=(.15+Math.random()*.8).toFixed(3);\n            f.appendChild(s);chars.push(s);\n          });\n          c.replaceWith(f);\n        }else if(c.nodeType===1\u0026\u0026c.tagName!==\u0027BR\u0027)walk(c);\n      });\n    };\n    walk(el);\n  });\n\n  function resize(){\n    dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;\n    [fx,sky].forEach(c=\u003e{c.width=W*dpr;c.height=H*dpr});\n    g.setTransform(dpr,0,0,dpr,0,0);sg.setTransform(dpr,0,0,dpr,0,0);\n    const r=btn.getBoundingClientRect();\n    ringRect.setAttribute(\u0027width\u0027,r.width+9);ringRect.setAttribute(\u0027height\u0027,r.height+9);ringRect.setAttribute(\u0027rx\u0027,(r.height+9)/2);\n    btn.querySelector(\u0027.ring\u0027).setAttribute(\u0027viewBox\u0027,`0 0 ${r.width+12} ${r.height+12}`);\n    makeStars();\n  }\n\n  // 별\n  let stars=[];\n  function makeStars(){\n    const n=Math.round(W*H/5200);stars=[];\n    for(let i=0;i\u003cn;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.9,r:Math.random()*1.2+.2,a:Math.random()*.7+.2,tw:Math.random()*6.28,v:.02+Math.random()*.06});\n  }\n  function drawSky(t){\n    sg.clearRect(0,0,W,H);\n    for(const s of stars){\n      if(!reduce){s.x+=s.v;if(s.x\u003eW+2)s.x=-2}\n      const a=s.a*(.65+.35*Math.sin(t/900+s.tw));\n      sg.fillStyle=`rgba(225,245,235,${a})`;sg.beginPath();sg.arc(s.x,s.y,s.r,0,6.283);sg.fill();\n    }\n  }\n\n  // 불티 파티클\n  const P=[];\n  function btnCenter(){const r=btn.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}\n  function ember(x,y,power){\n    P.push({x,y,vx:(Math.random()-.5)*(1+power*3),vy:-(1+Math.random()*2.5)*(1+power),life:1,decay:.008+Math.random()*.018,\n      r:1+Math.random()*2.4*(1+power),hue:20+Math.random()*30,kind:\u0027fire\u0027});\n  }\n  function burst(){\n    const c=btnCenter();\n    const n=reduce?0:260;\n    for(let i=0;i\u003cn;i++){\n      const a=Math.random()*6.283,sp=2+Math.random()*9;\n      P.push({x:c.x+(Math.random()-.5)*c.w,y:c.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,life:1,decay:.008+Math.random()*.015,\n        r:1.5+Math.random()*4,hue:15+Math.random()*40,kind:\u0027fire\u0027});\n    }\n  }\n  function ashGather(){\n    const c=btnCenter();\n    if(reduce)return;\n    for(let i=0;i\u003c220;i++){\n      const x=Math.random()*W,y=Math.random()*H;\n      P.push({x,y,tx:c.x+(Math.random()-.5)*c.w*1.4,ty:c.y+(Math.random()-.5)*c.h*2.5-H*.15*Math.random(),life:1,decay:.012+Math.random()*.008,\n        r:1+Math.random()*2.2,kind:\u0027ash\u0027,k:.035+Math.random()*.04});\n    }\n  }\n  function drawFx(){\n    g.clearRect(0,0,W,H);\n    g.globalCompositeOperation=\u0027lighter\u0027;\n    for(let i=P.length-1;i\u003e=0;i--){\n      const p=P[i];\n      if(p.kind===\u0027fire\u0027){\n        p.x+=p.vx+Math.sin(p.y/22)*.4;p.y+=p.vy;p.vy-=.03;p.vx*=.985;p.life-=p.decay;\n        const l=Math.max(0,p.life);\n        g.fillStyle=`hsla(${p.hue+l*10},100%,${45+l*25}%,${l})`;\n        g.beginPath();g.arc(p.x,p.y,p.r*(.4+l*.6),0,6.283);g.fill();\n      }else{\n        g.globalCompositeOperation=\u0027source-over\u0027;\n        p.x+=(p.tx-p.x)*p.k;p.y+=(p.ty-p.y)*p.k;p.life-=p.decay;\n        g.fillStyle=`rgba(160,170,165,${Math.max(0,p.life)*.8})`;\n        g.fillRect(p.x,p.y,p.r,p.r);\n        g.globalCompositeOperation=\u0027lighter\u0027;\n      }\n      if(p.life\u003c=0||p.y\u003c-40)P.splice(i,1);\n    }\n    g.globalCompositeOperation=\u0027source-over\u0027;\n  }\n\n  // 길게 누르기 상태\n  let holding=false,p=0,last=performance.now(),done=false,onNight=false;\n  const fmt=n=\u003en.toLocaleString(\u0027ko-KR\u0027);\n  function start(e){\n    if(done||onNight)return;\n    if(e\u0026\u0026e.type===\u0027pointerdown\u0027){if(e.button!==0)return;btn.setPointerCapture?.(e.pointerId)}\n    holding=true;btn.classList.add(\u0027on\u0027);\n  }\n  function stop(){\n    if(!holding)return;holding=false;btn.classList.remove(\u0027on\u0027);\n    if(!done\u0026\u0026p\u003e.05)live.textContent=\u0027취소됐어요. 불이 식고 있어요.\u0027;\n  }\n  btn.addEventListener(\u0027pointerdown\u0027,start);\n  [\u0027pointerup\u0027,\u0027pointercancel\u0027,\u0027lostpointercapture\u0027].forEach(ev=\u003ebtn.addEventListener(ev,stop));\n  btn.addEventListener(\u0027keydown\u0027,e=\u003e{if((e.key===\u0027 \u0027||e.key===\u0027Enter\u0027)){e.preventDefault();if(!e.repeat)start()}});\n  btn.addEventListener(\u0027keyup\u0027,e=\u003e{if(e.key===\u0027 \u0027||e.key===\u0027Enter\u0027)stop()});\n  btn.addEventListener(\u0027blur\u0027,stop);\n  btn.addEventListener(\u0027contextmenu\u0027,e=\u003ee.preventDefault());\n  btn.addEventListener(\u0027click\u0027,e=\u003ee.preventDefault());\n\n  function apply(){\n    root.style.setProperty(\u0027--heat\u0027,p.toFixed(4));\n    ringRect.style.strokeDashoffset=(100-p*100).toFixed(2);\n    cnt.textContent=fmt(Math.round(TOTAL*(1-p*p*.4-p*.6)));\n    for(const s of chars){\n      const t=+s.dataset.t;\n      s.classList.toggle(\u0027char\u0027,p\u003et);\n      s.classList.toggle(\u0027warm\u0027,p\u003et*.55\u0026\u0026p\u003c=t);\n    }\n  }\n  function complete(){\n    done=true;holding=false;btn.classList.remove(\u0027on\u0027);p=1;apply();cnt.textContent=\u00270\u0027;\n    burst();\n    live.textContent=\u0027모두 태웠어요. 받은편지함이 비었어요.\u0027;\n    setTimeout(()=\u003e{\n      s1.classList.add(\u0027off\u0027);s2.classList.remove(\u0027off\u0027);onNight=true;\n      setTimeout(()=\u003edocument.getElementById(\u0027h1b\u0027).focus({preventScroll:true}),400);\n    },reduce?150:650);\n  }\n  function revive(){\n    if(!onNight)return;\n    onNight=false;\n    s2.classList.add(\u0027off\u0027);s1.classList.remove(\u0027off\u0027);\n    p=1;apply();\n    ashGather();\n    live.textContent=\u00272,318통이 재에서 다시 모였어요.\u0027;\n    setTimeout(()=\u003e{done=false;btn.focus({preventScroll:true})},reduce?100:500);\n  }\n  document.getElementById(\u0027revive\u0027).addEventListener(\u0027click\u0027,revive);\n  const toast=document.getElementById(\u0027toast\u0027);\n  document.getElementById(\u0027quiet\u0027).addEventListener(\u0027click\u0027,()=\u003e{\n    const v=document.getElementById(\u0027note\u0027).value.trim();\n    toast.textContent=v?`“${v.slice(0,40)}” — 자동 응답으로 걸어 둘게요.`:\u0027알림을 모두 껐어요. 좋은 밤 보내세요.\u0027;\n  });\n  document.getElementById(\u0027note\u0027).addEventListener(\u0027keydown\u0027,e=\u003e{if(e.key===\u0027Enter\u0027)document.getElementById(\u0027quiet\u0027).click()});\n\n  function loop(t){\n    const dt=Math.min(50,t-last);last=t;\n    if(!done){\n      if(holding){p=Math.min(1,p+dt/HOLD);if(p\u003e=1)complete()}\n      else if(p\u003e0){p=Math.max(0,p-dt/(HOLD*.45))}\n      apply();\n      if(holding\u0026\u0026!reduce){\n        const c=btnCenter(),n=1+Math.floor(p*6);\n        for(let i=0;i\u003cn;i++)ember(c.x+(Math.random()-.5)*c.w*.9,c.y-c.h*.3,p);\n      }\n    }\n    if(onNight)drawSky(t);\n    drawFx();\n    requestAnimationFrame(loop);\n  }\n  addEventListener(\u0027resize\u0027,resize);\n  resize();apply();requestAnimationFrame(loop);\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"bubble-switch","file":"components/bubble-switch.html","name":"비눗방울 Switch","cat":"스위치","desc":"비눗방울 손잡이가 늘어나며 건너가고, 낮의 해가 밤의 달과 별로 바뀌어요","added":"2026-11-27","tags":["토글","스위치","다크모드","스쿼시스트레치","파티클","무지갯빛"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"비눗방울 Switch\",\"cat\":\"스위치\",\"desc\":\"비눗방울 손잡이가 늘어나며 건너가고, 낮의 해가 밤의 달과 별로 바뀌어요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e비눗방울 스위치\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--ease:cubic-bezier(.68,-.05,.22,1)}\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{display:grid;place-items:center;overflow:hidden;background:#f2efe9;color:#5b5850;\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;\n    transition:background-color .9s ease,color .9s ease}\n  body.night{background:#07070c;color:#aaa3d6}\n  .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}\n  .stage{position:relative}\n\n  .sw{position:relative;display:block;width:140px;height:62px;padding:0;border:0;border-radius:31px;background:none;\n    cursor:pointer;-webkit-tap-highlight-color:transparent}\n  .sw:focus-visible{outline:2px solid #1f9c8a;outline-offset:6px}\n  body.night .sw:focus-visible{outline-color:#a98bff}\n\n  /* 트랙 */\n  .track{position:absolute;inset:0;border-radius:inherit;overflow:hidden;\n    background:linear-gradient(180deg,#66e2cf 0%,#2fc3ad 50%,#23a592 100%);\n    box-shadow:inset 0 2px 4px rgba(255,255,255,.55),inset 0 -3px 7px rgba(0,60,50,.28),\n      0 9px 20px rgba(30,130,112,.28),0 2px 4px rgba(30,90,80,.18);\n    transition:box-shadow .9s ease}\n  body.night .track{box-shadow:inset 0 2px 4px rgba(200,170,255,.25),inset 0 -3px 7px rgba(0,0,0,.45),\n      0 9px 26px rgba(110,60,210,.35),0 2px 4px rgba(0,0,0,.4)}\n  .nightbg{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;\n    background:radial-gradient(120% 140% at 28% 18%,#43218a,#240f4e 62%,#170936)}\n  body.night .nightbg{opacity:1}\n  .track::after{content:\"\";position:absolute;left:12px;right:12px;top:4px;height:42%;border-radius:20px;pointer-events:none;\n    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}\n  body.night .track::after{opacity:.35}\n  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;\n    box-shadow:0 0 4px 1px rgba(255,255,255,.8);transition:opacity .6s}\n  .star.big{width:3px;height:3px}\n  body.night .star{animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d)}\n  @keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}\n\n  /* 비눗방울 손잡이 */\n  .knob{position:absolute;left:6px;top:6px;width:50px;height:50px;z-index:2;transition:transform .85s var(--ease)}\n  .sw[aria-checked=\"true\"] .knob{transform:translateX(78px)}\n  .bub{position:absolute;inset:0;border-radius:50%;\n    background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 50%,rgba(255,255,255,.16) 72%,rgba(255,255,255,.55) 100%);\n    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset -4px -6px 10px rgba(255,255,255,.16),0 7px 14px rgba(0,40,35,.2);\n    -webkit-backdrop-filter:blur(1.5px) saturate(1.4);backdrop-filter:blur(1.5px) saturate(1.4)}\n  body.night .bub{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset -4px -6px 10px rgba(255,255,255,.1),0 7px 16px rgba(0,0,0,.5)}\n  .film,.film2{position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:screen}\n  .film{background:conic-gradient(from 0deg,#ff8fd0,#ffd57a,#a8ff9e,#7be0ff,#a68bff,#ff8fd0);\n    -webkit-mask:radial-gradient(closest-side,transparent 68%,rgba(0,0,0,.5) 85%,#000 96%,transparent 100%);\n            mask:radial-gradient(closest-side,transparent 68%,rgba(0,0,0,.5) 85%,#000 96%,transparent 100%);\n    opacity:.85;animation:spin 7s linear infinite,hue 5s ease-in-out infinite alternate}\n  .film2{background:conic-gradient(from 140deg at 42% 60%,rgba(255,150,220,0),rgba(255,150,220,.55),rgba(120,220,255,.5),rgba(255,240,140,.45),rgba(255,150,220,0));\n    -webkit-mask:radial-gradient(closest-side,transparent 30%,#000 85%,transparent 100%);\n            mask:radial-gradient(closest-side,transparent 30%,#000 85%,transparent 100%);\n    opacity:.4;animation:spin 11s linear infinite reverse}\n  @keyframes spin{to{transform:rotate(1turn)}}\n  @keyframes hue{to{filter:hue-rotate(80deg)}}\n  .hl{position:absolute;left:17%;top:11%;width:40%;height:23%;border-radius:50%;transform:rotate(-32deg);\n    background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0))}\n  .hl2{position:absolute;right:19%;bottom:15%;width:12%;height:12%;border-radius:50%;\n    background:radial-gradient(closest-side,#fff,rgba(255,255,255,0))}\n\n  .ico{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;\n    transition:opacity .5s ease,transform .8s var(--ease)}\n  .moon{opacity:0;transform:rotate(-70deg) scale(.4)}\n  .sw[aria-checked=\"true\"] .sun{opacity:0;transform:rotate(100deg) scale(.4)}\n  .sw[aria-checked=\"true\"] .moon{opacity:1;transform:none}\n  .rays{transform-origin:14px 14px;animation:spin 14s linear infinite}\n  .moon .tw1{animation:tw 2s ease-in-out infinite}\n  .moon .tw2{animation:tw 2.8s .6s ease-in-out infinite}\n\n  /* 떨어져 나가는 작은 방울 */\n  .mini{position:absolute;border-radius:50%;pointer-events:none;z-index:3;\n    background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 12%,rgba(255,255,255,.06) 32% 62%,rgba(255,255,255,.45) 100%);\n    box-shadow:inset 0 0 0 1px rgba(255,255,255,.65),inset 1px -1px 2px rgba(255,130,220,.7),inset -1px 1px 2px rgba(110,220,255,.7)}\n\n  .cap{font-size:14px;font-weight:500;letter-spacing:-.01em;min-height:1.4em;transition:opacity .25s}\n  .cap.fade{opacity:0}\n\n  @media (prefers-reduced-motion:reduce){\n    *,*::before,*::after{animation:none!important;transition:none!important}\n    body.night .star{opacity:.75}\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"stage\" id=\"stage\"\u003e\n      \u003cbutton class=\"sw\" id=\"sw\" role=\"switch\" aria-checked=\"false\" aria-label=\"밤 모드\"\u003e\n        \u003cspan class=\"track\" aria-hidden=\"true\"\u003e\n          \u003cspan class=\"nightbg\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star\" style=\"left:18px;top:14px;--d:0s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star big\" style=\"left:34px;top:38px;--d:.7s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star\" style=\"left:52px;top:18px;--d:1.3s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star\" style=\"left:66px;top:44px;--d:.4s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star big\" style=\"left:80px;top:12px;--d:1.8s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star\" style=\"left:24px;top:48px;--d:2.1s\"\u003e\u003c/span\u003e\n          \u003cspan class=\"star\" style=\"left:120px;top:10px;--d:1s\"\u003e\u003c/span\u003e\n        \u003c/span\u003e\n        \u003cspan class=\"knob\" aria-hidden=\"true\"\u003e\n          \u003cspan class=\"bub\" id=\"bub\"\u003e\n            \u003cspan class=\"film2\"\u003e\u003c/span\u003e\n            \u003csvg class=\"ico sun\" viewBox=\"0 0 28 28\"\u003e\n              \u003cdefs\u003e\u003cradialGradient id=\"sg\" cx=\"40%\" cy=\"35%\" r=\"70%\"\u003e\u003cstop offset=\"0\" stop-color=\"#fff6c2\"/\u003e\u003cstop offset=\".55\" stop-color=\"#ffcf3f\"/\u003e\u003cstop offset=\"1\" stop-color=\"#f0961a\"/\u003e\u003c/radialGradient\u003e\u003c/defs\u003e\n              \u003cg class=\"rays\" stroke=\"#ffc23a\" stroke-width=\"2\" stroke-linecap=\"round\"\u003e\n                \u003cpath d=\"M14 1.8v3M14 23.2v3M1.8 14h3M23.2 14h3M5.4 5.4l2.1 2.1M22.6 5.4l-2.1 2.1M5.4 22.6l2.1-2.1M22.6 22.6l-2.1-2.1\"/\u003e\n              \u003c/g\u003e\n              \u003ccircle cx=\"14\" cy=\"14\" r=\"6.2\" fill=\"url(#sg)\"/\u003e\n            \u003c/svg\u003e\n            \u003csvg class=\"ico moon\" viewBox=\"0 0 28 28\"\u003e\n              \u003cdefs\u003e\n                \u003cradialGradient id=\"mg\" cx=\"35%\" cy=\"40%\" r=\"75%\"\u003e\u003cstop offset=\"0\" stop-color=\"#fffbe6\"/\u003e\u003cstop offset=\"1\" stop-color=\"#f3d37a\"/\u003e\u003c/radialGradient\u003e\n                \u003cmask id=\"mm\"\u003e\u003crect width=\"28\" height=\"28\" fill=\"#fff\"/\u003e\u003ccircle cx=\"18.6\" cy=\"10.2\" r=\"7\" fill=\"#000\"/\u003e\u003c/mask\u003e\n              \u003c/defs\u003e\n              \u003ccircle cx=\"12.6\" cy=\"15\" r=\"8.2\" fill=\"url(#mg)\" mask=\"url(#mm)\"/\u003e\n              \u003cpath class=\"tw1\" style=\"transform-origin:21px 19px\" d=\"M21 16.6Q21 19 23.4 19Q21 19 21 21.4Q21 19 18.6 19Q21 19 21 16.6Z\" fill=\"#fff8d8\"/\u003e\n              \u003cpath class=\"tw2\" style=\"transform-origin:21.5px 6px\" d=\"M21.5 4.4Q21.5 6 23.1 6Q21.5 6 21.5 7.6Q21.5 6 19.9 6Q21.5 6 21.5 4.4Z\" fill=\"#fff\"/\u003e\n            \u003c/svg\u003e\n            \u003cspan class=\"film\"\u003e\u003c/span\u003e\n            \u003cspan class=\"hl\"\u003e\u003c/span\u003e\u003cspan class=\"hl2\"\u003e\u003c/span\u003e\n          \u003c/span\u003e\n        \u003c/span\u003e\n      \u003c/button\u003e\n    \u003c/div\u003e\n    \u003cp class=\"cap\" id=\"cap\"\u003e햇살 가득한 낮이에요\u003c/p\u003e\n  \u003c/div\u003e\n\u003cscript\u003e\n  const sw = document.getElementById(\u0027sw\u0027), bub = document.getElementById(\u0027bub\u0027),\n        stage = document.getElementById(\u0027stage\u0027), cap = document.getElementById(\u0027cap\u0027);\n  const reduce = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027);\n\n  // 늘어났다 출렁이며 돌아오는 비눗방울 모양\n  const STRETCH = [\n    { transform: \u0027scale(1,1)\u0027 },\n    { transform: \u0027scale(.92,1.06)\u0027, offset: .08 },\n    { transform: \u0027scale(1.36,.78)\u0027, offset: .36 },\n    { transform: \u0027scale(.86,1.13)\u0027, offset: .6 },\n    { transform: \u0027scale(1.08,.94)\u0027, offset: .76 },\n    { transform: \u0027scale(.97,1.03)\u0027, offset: .89 },\n    { transform: \u0027scale(1,1)\u0027 }\n  ];\n\n  function spawn(on) {\n    const kr = bub.getBoundingClientRect(), sr = stage.getBoundingClientRect();\n    const s = 5 + Math.random() * 7;\n    const x = kr.left - sr.left + kr.width * (.25 + Math.random() * .5);\n    const y = kr.top - sr.top + kr.height * (.2 + Math.random() * .3);\n    const el = document.createElement(\u0027span\u0027);\n    el.className = \u0027mini\u0027;\n    el.style.cssText = `width:${s}px;height:${s}px;left:${x - s / 2}px;top:${y - s / 2}px`;\n    stage.appendChild(el);\n    const dx = (Math.random() - .5) * 34 + (on ? -10 : 10), dy = -(34 + Math.random() * 44);\n    const sway = (Math.random() - .5) * 16;\n    const a = el.animate([\n      { transform: \u0027translate(0,0) scale(.2)\u0027, opacity: 0 },\n      { transform: `translate(${dx * .25}px,${dy * .2}px) scale(1)`, opacity: 1, offset: .14 },\n      { transform: `translate(${dx * .6 + sway}px,${dy * .6}px) scale(1)`, opacity: 1, offset: .55 },\n      { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: 1, offset: .86 },\n      { transform: `translate(${dx}px,${dy}px) scale(1.9)`, opacity: 0 }\n    ], { duration: 1000 + Math.random() * 700, easing: \u0027cubic-bezier(.3,.6,.4,1)\u0027 });\n    a.onfinish = () =\u003e el.remove();\n  }\n\n  let capTimer;\n  sw.addEventListener(\u0027click\u0027, () =\u003e {\n    const on = sw.getAttribute(\u0027aria-checked\u0027) !== \u0027true\u0027;\n    sw.setAttribute(\u0027aria-checked\u0027, String(on));\n    document.body.classList.toggle(\u0027night\u0027, on);\n    clearTimeout(capTimer);\n    cap.classList.add(\u0027fade\u0027);\n    capTimer = setTimeout(() =\u003e {\n      cap.textContent = on ? \u0027별이 반짝이는 밤이에요\u0027 : \u0027햇살 가득한 낮이에요\u0027;\n      cap.classList.remove(\u0027fade\u0027);\n    }, 250);\n    if (reduce.matches) return;\n    bub.getAnimations().forEach(a =\u003e a.cancel());\n    bub.animate(STRETCH, { duration: 980, easing: \u0027ease-out\u0027 });\n    for (let i = 0; i \u003c 5; i++) setTimeout(spawn, 80 + i * 120, on);\n  });\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"dot-buttons","file":"components/dot-buttons.html","name":"점 Buttons","cat":"버튼","desc":"버튼 끝의 작은 점이 마우스를 올리면 부풀어 올라 버튼 전체를 뒤집어 칠해요","added":"2026-11-27","tags":["버튼","버튼세트","호버","색반전","클립패스"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"점 Buttons\",\"cat\":\"버튼\",\"desc\":\"버튼 끝의 작은 점이 마우스를 올리면 부풀어 올라 버튼 전체를 뒤집어 칠해요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e점 버튼 세트\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--bg:#e7e2da;--ink:#141414;--orange:#e2643a;--ease:cubic-bezier(.72,0,.18,1);--dur:450ms;--s:1}\n  *{box-sizing:border-box;margin:0}\n  html,body{min-height:100%}\n  body{display:grid;place-items:center;min-height:100vh;padding:16px;\n    background:radial-gradient(80% 70% at 50% 40%,#eeeae3,var(--bg));\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;color:var(--ink)}\n  .wrap{display:flex;flex-direction:column;align-items:center;gap:calc(16px * var(--s))}\n  .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(14px * var(--s))}\n  .hint{margin-top:calc(6px * var(--s));font-size:13px;color:#8b847a;letter-spacing:-.01em}\n\n  /* 기본 버튼 */\n  .dbtn{--h:52px;--fs:16px;--d:8px;--px:22px;\n    --H:calc(var(--h) * var(--s));--D:calc(var(--d) * var(--s));--P:calc(var(--px) * var(--s));\n    position:relative;display:inline-flex;align-items:center;height:var(--H);\n    padding:0 calc(var(--P) + var(--D) + 12px * var(--s)) 0 calc(var(--P) + 6px * var(--s));\n    border:0;border-radius:999px;cursor:pointer;white-space:nowrap;\n    background:var(--bg0);color:var(--fg0);\n    font:inherit;font-size:calc(var(--fs) * var(--s));font-weight:600;letter-spacing:-.02em;\n    box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 8px 18px -6px rgba(20,20,20,.28),0 2px 4px rgba(20,20,20,.08);\n    transition:transform .18s var(--ease),box-shadow .3s var(--ease);\n    -webkit-tap-highlight-color:transparent}\n  .dbtn:active{transform:scale(.97)}\n  .dbtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}\n\n  .lbl{position:relative;display:inline-block;transition:transform var(--dur) var(--ease)}\n  .dot{position:absolute;top:50%;right:var(--P);width:var(--D);height:var(--D);margin-top:calc(var(--D) / -2);\n    border-radius:50%;background:var(--dot0);transition:transform var(--dur) var(--ease)}\n\n  /* 뒤집힌 색이 칠해지는 레이어: 점 위치에서 시작해 알약 모양으로 퍼진다 */\n  /* inset:-1px — 원래 버튼의 둥근 가장자리가 얇은 선으로 비치지 않게 1px 더 크게 덮는다 */\n  .fill{position:absolute;inset:-1px;display:flex;align-items:center;padding:inherit;padding-left:calc(var(--P) + 6px * var(--s) + 1px);border-radius:inherit;\n    background:var(--bg1);color:var(--fg1);pointer-events:none;\n    /* 평소엔 점 한가운데에 크기 0으로 숨어 있다가, 마우스를 올리면 거기서부터 퍼진다 (1px 큰 레이어라 +1px 보정) */\n    clip-path:inset(50% calc(var(--P) + var(--D) / 2 + 1px) 50% calc(100% - var(--P) - var(--D) / 2 - 1px) round 999px);\n    transition:clip-path var(--dur) var(--ease)}\n  .fill .dot{right:auto;left:calc(var(--P) + 1px);background:var(--dot1);transform:scale(0);transition:transform 260ms var(--ease)}\n\n  .dbtn:is(:hover,:focus-visible) .fill{clip-path:inset(0 0 0 0 round 999px)}\n  .dbtn:is(:hover,:focus-visible) .lbl{transform:translateX(calc(var(--D) + 6px * var(--s)))}\n  .dbtn:is(:hover,:focus-visible) \u003e .dot{transform:translateX(calc(var(--D) * -1)) scale(.4)}\n  .dbtn:is(:hover,:focus-visible) .fill .dot{transform:scale(1);transition-delay:calc(var(--dur) * .45)}\n\n  /* 색 조합 */\n  .v-black{--bg0:#141414;--fg0:#fff;--dot0:#fff;--bg1:#fbf9f5;--fg1:#141414;--dot1:#141414}\n  .v-light{--bg0:#f8f5f0;--fg0:#141414;--dot0:#141414;--bg1:#141414;--fg1:#fff;--dot1:#fff}\n  .v-orange{--bg0:var(--orange);--fg0:#fff;--dot0:#fff;--bg1:#141414;--fg1:#fff;--dot1:var(--orange)}\n  .v-line{--bg0:transparent;--fg0:#141414;--dot0:var(--orange);--bg1:var(--orange);--fg1:#141414;--dot1:#141414;\n    box-shadow:inset 0 0 0 1.5px #141414}\n  .v-line .fill{box-shadow:inset 0 0 0 1.5px #141414}\n  .v-light{box-shadow:0 1px 0 #fff inset,0 8px 18px -8px rgba(20,20,20,.22),0 2px 4px rgba(20,20,20,.06)}\n\n  /* 크기 */\n  .sm{--h:40px;--fs:14px;--d:6px;--px:16px}\n  .lg{--h:62px;--fs:18px;--d:10px;--px:26px}\n\n  @media (max-width:460px),(max-height:400px){:root{--s:.82}}\n  @media (max-height:300px){:root{--s:.72}.hint{display:none}}\n  @media (prefers-reduced-motion:reduce){\n    :root{--dur:1ms}\n    .dbtn,.fill .dot{transition-duration:1ms!important;transition-delay:0s!important}\n    .dbtn:active{transform:none}\n  }\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cmain class=\"wrap\"\u003e\n    \u003cdiv class=\"row\"\u003e\n      \u003cbutton class=\"dbtn v-black\"\u003e\u003cspan class=\"lbl\"\u003e프로젝트 시작\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n      \u003cbutton class=\"dbtn v-light\"\u003e\u003cspan class=\"lbl\"\u003e작업 보기\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"row\"\u003e\n      \u003cbutton class=\"dbtn v-orange\"\u003e\u003cspan class=\"lbl\"\u003e소식 받기\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n      \u003cbutton class=\"dbtn v-line\"\u003e\u003cspan class=\"lbl\"\u003e인사하기\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"row\"\u003e\n      \u003cbutton class=\"dbtn v-black sm\"\u003e\u003cspan class=\"lbl\"\u003e작게\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n      \u003cbutton class=\"dbtn v-black\"\u003e\u003cspan class=\"lbl\"\u003e보통\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n      \u003cbutton class=\"dbtn v-black lg\"\u003e\u003cspan class=\"lbl\"\u003e크게\u003c/span\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e\u003c/button\u003e\n    \u003c/div\u003e\n    \u003cp class=\"hint\"\u003e버튼 위에 마우스를 올려 보세요\u003c/p\u003e\n  \u003c/main\u003e\n\u003cscript\u003e\n  // 각 버튼에 뒤집힌 색 레이어(같은 글자 + 반대편 점)를 붙인다\n  document.querySelectorAll(\u0027.dbtn\u0027).forEach(btn =\u003e {\n    const fill = document.createElement(\u0027span\u0027);\n    fill.className = \u0027fill\u0027;\n    fill.setAttribute(\u0027aria-hidden\u0027, \u0027true\u0027);\n    const dot = document.createElement(\u0027i\u0027); dot.className = \u0027dot\u0027;\n    const lbl = document.createElement(\u0027span\u0027); lbl.className = \u0027lbl\u0027;\n    lbl.textContent = btn.querySelector(\u0027.lbl\u0027).textContent;\n    fill.append(dot, lbl);\n    btn.append(fill);\n  });\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"eye-buttons","file":"components/eye-buttons.html","name":"눈동자 Button","cat":"버튼","desc":"버튼에 달린 눈동자가 마우스를 쳐다보고, 가끔 눈을 깜빡여요","added":"2026-11-27","tags":["버튼","마우스따라가기","깜빡임","클립보드"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"눈동자 Button\",\"cat\":\"버튼\",\"desc\":\"버튼에 달린 눈동자가 마우스를 쳐다보고, 가끔 눈을 깜빡여요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e눈 달린 버튼\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--bg:#f3f4f4;--ink:#141414;--orange:#e5673a;--pop:cubic-bezier(.3,1.6,.5,1);--s:1}\n  *{box-sizing:border-box;margin:0}\n  html,body{min-height:100%}\n  body{display:grid;place-items:center;min-height:100vh;padding:16px;\n    background:radial-gradient(70% 60% at 50% 45%,#fafbfb,var(--bg));\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;color:var(--ink)}\n  .wrap{display:flex;flex-direction:column;align-items:center;gap:calc(22px * var(--s))}\n  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(18px * var(--s))}\n  .hint{font-size:13px;color:#8e9393;letter-spacing:-.01em}\n\n  .eb{position:relative;display:inline-flex;align-items:center;gap:calc(14px * var(--s));\n    height:calc(60px * var(--s));padding:0 calc(14px * var(--s)) 0 calc(26px * var(--s));\n    border:0;border-radius:999px;cursor:pointer;color:#fff;white-space:nowrap;\n    font:inherit;font-size:calc(17px * var(--s));font-weight:600;letter-spacing:-.02em;\n    box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 4px rgba(0,0,0,.12) inset,\n               0 14px 28px -10px rgba(20,20,20,.35),0 3px 8px rgba(20,20,20,.08);\n    transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .25s;\n    -webkit-tap-highlight-color:transparent}\n  .eb:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 -2px 4px rgba(0,0,0,.12) inset,0 18px 32px -10px rgba(20,20,20,.4),0 4px 10px rgba(20,20,20,.08)}\n  .eb:active{transform:translateY(1px) scale(.97)}\n  .eb:focus-visible{outline:2px solid var(--ink);outline-offset:4px}\n  .dark{background:linear-gradient(180deg,#262626,#101010)}\n  .orange{background:linear-gradient(180deg,#ec7447,var(--orange) 60%,#d95c31)}\n\n  /* 바뀌는 글자: 두 글자를 겹쳐 놓고 너비는 긴 쪽에 맞춘다 */\n  .lbls{display:grid}\n  .lbls \u003e span{grid-area:1/1;text-align:left;transition:opacity .2s,transform .3s var(--pop)}\n  .lbls .b{opacity:0;transform:translateY(8px)}\n  .copied .lbls .a{opacity:0;transform:translateY(-8px)}\n  .copied .lbls .b{opacity:1;transform:none}\n\n  /* 눈 */\n  .eyes{display:flex;gap:calc(5px * var(--s))}\n  .eye{--e:calc(24px * var(--s));position:relative;width:var(--e);height:var(--e);transition:transform .3s var(--pop)}\n  .ball{position:absolute;inset:0;border-radius:50%;background:#fff;overflow:hidden;\n    box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);transition:transform .09s ease-in}\n  .pupil{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21%;border-radius:50%;background:#111;will-change:transform}\n  .pupil::after{content:\"\";position:absolute;left:22%;top:18%;width:30%;height:30%;border-radius:50%;background:rgba(255,255,255,.85)}\n  .happy{position:absolute;left:8%;top:22%;width:84%;height:56%;overflow:visible;opacity:0;transform:translateY(3px) scale(.5);\n    transition:opacity .15s,transform .3s var(--pop)}\n  .happy path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}\n\n  .eb:hover .eye{transform:scale(1.13)}\n  .blink .ball{transform:scaleY(.1)}\n  .one:hover .ball{transform:scaleY(.1);transition-duration:.14s}\n  .happyOn .ball{transform:scale(0);transition:transform .15s ease-in}\n  .happyOn .happy{opacity:1;transform:none}\n  .one.pop .eye{transform:scale(1.35)}\n  .one.pop .ball{transform:none;transition-duration:.12s}\n\n  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n  @media (max-width:440px),(max-height:300px){:root{--s:.84}}\n  @media (max-height:260px){.hint{display:none}}\n  @media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}.eb:hover,.eb:active{transform:none}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cmain class=\"wrap\"\u003e\n    \u003cdiv class=\"row\"\u003e\n      \u003cbutton class=\"eb dark\" id=\"copy\"\u003e\n        \u003cspan class=\"lbls\"\u003e\u003cspan class=\"a\"\u003e이메일 복사\u003c/span\u003e\u003cspan class=\"b\" aria-hidden=\"true\"\u003e복사했어요\u003c/span\u003e\u003c/span\u003e\n        \u003cspan class=\"eyes\" aria-hidden=\"true\"\u003e\n          \u003cspan class=\"eye\"\u003e\u003cspan class=\"ball\"\u003e\u003ci class=\"pupil\"\u003e\u003c/i\u003e\u003c/span\u003e\u003csvg class=\"happy\" viewBox=\"0 0 20 12\"\u003e\u003cpath d=\"M3 10 Q10 -1 17 10\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n          \u003cspan class=\"eye\"\u003e\u003cspan class=\"ball\"\u003e\u003ci class=\"pupil\"\u003e\u003c/i\u003e\u003c/span\u003e\u003csvg class=\"happy\" viewBox=\"0 0 20 12\"\u003e\u003cpath d=\"M3 10 Q10 -1 17 10\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n        \u003c/span\u003e\n      \u003c/button\u003e\n      \u003cbutton class=\"eb orange one\" id=\"one\"\u003e\n        \u003cspan class=\"lbls\"\u003e\u003cspan class=\"a\"\u003e한쪽 눈 뜨기\u003c/span\u003e\u003c/span\u003e\n        \u003cspan class=\"eyes\" aria-hidden=\"true\"\u003e\n          \u003cspan class=\"eye\"\u003e\u003cspan class=\"ball\"\u003e\u003ci class=\"pupil\"\u003e\u003c/i\u003e\u003c/span\u003e\u003c/span\u003e\n        \u003c/span\u003e\n      \u003c/button\u003e\n    \u003c/div\u003e\n    \u003cp class=\"hint\"\u003e눈동자가 마우스를 따라가요\u003c/p\u003e\n  \u003c/main\u003e\n  \u003cspan class=\"sr\" id=\"status\" aria-live=\"polite\"\u003e\u003c/span\u003e\n\u003cscript\u003e\n  const RM = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027);\n  const status = document.getElementById(\u0027status\u0027);\n  const eyes = [...document.querySelectorAll(\u0027.eye\u0027)].map(el =\u003e ({ el, p: el.querySelector(\u0027.pupil\u0027), x: 0, y: 0 }));\n\n  // 눈동자: 페이지 어디에 있든 마우스를 쳐다본다 (눈 안에서만 움직임)\n  let mx = 0, my = 0, has = false;\n  addEventListener(\u0027pointermove\u0027, e =\u003e { mx = e.clientX; my = e.clientY; has = true; });\n  document.documentElement.addEventListener(\u0027pointerleave\u0027, () =\u003e { has = false; });\n\n  function frame() {\n    for (const e of eyes) {\n      const r = e.el.getBoundingClientRect();\n      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;\n      const size = e.el.offsetWidth, max = size * .5 - size * .21 - 1.5;\n      let tx = 0, ty = 0;\n      if (has) {\n        const dx = mx - ex, dy = my - ey, d = Math.hypot(dx, dy) || 1;\n        const off = max * Math.min(1, d / 110);\n        tx = dx / d * off; ty = dy / d * off;\n      }\n      const f = RM.matches ? 1 : (has ? .28 : .06);\n      e.x += (tx - e.x) * f; e.y += (ty - e.y) * f;\n      e.p.style.transform = `translate(${e.x.toFixed(2)}px,${e.y.toFixed(2)}px)`;\n    }\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n\n  // 깜빡임: 2~5초마다, 가끔 두 번 연속\n  function blink(b) { b.classList.add(\u0027blink\u0027); setTimeout(() =\u003e b.classList.remove(\u0027blink\u0027), 120); }\n  function schedule(b) {\n    setTimeout(() =\u003e {\n      if (!RM.matches \u0026\u0026 !document.hidden) {\n        blink(b);\n        if (Math.random() \u003c .28) setTimeout(() =\u003e blink(b), 240);\n      }\n      schedule(b
