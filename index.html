copy.addEventListener(\u0027click\u0027, () =\u003e {\n    copy.classList.add(\u0027copied\u0027, \u0027happyOn\u0027);\n    status.textContent = \u0027이메일 주소를 복사했어요\u0027;\n    clearTimeout(tc);\n    tc = setTimeout(() =\u003e { copy.classList.remove(\u0027copied\u0027, \u0027happyOn\u0027); status.textContent = \u0027\u0027; }, 1700);\n    try {\n      const p = navigator.clipboard \u0026\u0026 navigator.clipboard.writeText(\u0027hello@example.com\u0027);\n      if (p \u0026\u0026 p.catch) p.catch(() =\u003e {});\n    } catch (_) {}\n  });\n\n  // 한쪽 눈 버튼: 올리면 윙크, 누르면 눈을 번쩍 뜬다\n  const one = document.getElementById(\u0027one\u0027);\n  let to;\n  one.addEventListener(\u0027click\u0027, () =\u003e {\n    one.classList.add(\u0027pop\u0027);\n    status.textContent = \u0027눈을 떴어요\u0027;\n    clearTimeout(to);\n    to = setTimeout(() =\u003e { one.classList.remove(\u0027pop\u0027); status.textContent = \u0027\u0027; }, 800);\n  });\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"ferro-slider","file":"components/ferro-slider.html","name":"자성 유체 스위치","cat":"스위치","desc":"검은 자성 액체 방울이 가시를 세우며 건너가면 방이 보랏빛 밤으로 바뀌어요","added":"2026-11-27","tags":["토글","스위치","다크모드","메타볼","구이필터","글로우"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"자성 유체 스위치\",\"cat\":\"스위치\",\"desc\":\"검은 자성 액체 방울이 가시를 세우며 건너가면 방이 보랏빛 밤으로 바뀌어요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e자성 유체 스위치\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--violet:#b07cff}\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{display:grid;place-items:center;overflow:hidden;background:#e9e9ea;color:#85858c;\n    font-family:\"Pretenda ener(\u0027lostpointercapture\u0027, release);\n\n  // 꼬리를 따라 방울 떨구기\n  function shed(len) {\n    if (len \u003c 40 || RM.matches) return;\n    const n = Math.min(7, Math.round(len / 40)), nx = tip.x / len, ny = tip.y / len;\n    for (let i = 0; i \u003c n; i++) {\n      const p = rand(.35, 1);\n      drop(cx + grab.x + tip.x * p, cy + tip.y * p, nx * rand(30, 160) + rand(-50, 50), ny * rand(30, 140) - rand(40, 140), rand(3, 7));\n    }\n    jig.vel += .9;\n  }\n\n  btn.addEventListener(\u0027click\u0027, () =\u003e {\n    const wasDrag = moved \u003e 10; moved = 0;\n    if (wasDrag) return;\n    lbl.classList.add(\u0027swap\u0027);\n    setTimeout(() =\u003e { lbl.textContent = \u0027반가워요!\u0027; lbl.classList.remove(\u0027swap\u0027); }, 160);\n    setTimeout(() =\u003e { lbl.classList.add(\u0027swap\u0027); setTimeout(() =\u003e { lbl.textContent = \u0027연락하기\u0027; lbl.classList.remove(\u0027swap\u0027); }, 160); }, 1700);\n    status.textContent = \u0027연락하기를 눌렀어요\u0027;\n    jig.vel -= 1.2;\n    if (RM.matches) return;\n    for (let i = 0; i \u003c 9; i++) {\n      const a = -Math.PI / 2 + rand(-1.1, 1.1);\n      drop(cx + Math.cos(a) * BW * .35, cy + Math.sin(a) * R * .8, Math.cos(a) * rand(90, 260), Math.sin(a) * rand(240, 420), rand(3, 7.5));\n    }\n  });\n\n  function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }\n  function ellipse(ctx, x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, Math.PI * 2); ctx.fill(); }\n  function pill(x, y, w, h) {\n    const r = h / 2, l = x - w / 2 + r, rr = x + w / 2 - r;\n    ic.beginPath(); ic.arc(l, y, r, Math.PI / 2, Math.PI * 1.5); ic.arc(rr, y, r, -Math.PI / 2, Math.PI / 2); ic.closePath(); ic.fill();\n  }\n\n  let last = performance.now();\n  function frame(now) {\n    const dt = Math.min(.033, (now - last) / 1000); last = now; t += dt;\n    const rm = RM.matches;\n\n    // 꼬리: 끄는 중엔 포인터를 따라가고, 놓으면 탄성 있게 되돌아감\n    if (dragging) {\n      tip.x += (aim.x - tip.x) * Math.min(1, dt * 22); tip.y += (aim.y - tip.y) * Math.min(1, dt * 22);\n      tip.vx = tip.vy = 0;\n      const len = Math.hypot(tip.x, tip.y);\n      if (len \u003e 280 \u0026\u0026 !broke \u0026\u0026 !rm) { // 너무 늘이면 끝이 떨어져 나감\n        broke = true;\n        drop(cx + grab.x + tip.x, cy + tip.y, tip.x * .4, tip.y * .4 - 60, 11);\n        for (let i = 0; i \u003c 3; i++) drop(cx + grab.x + tip.x * .8, cy + tip.y * .8, rand(-80, 80), rand(-160, -40), rand(2.5, 4.5), \u0027spl\u0027);\n        dragging = false; tip.x *= .5; tip.y *= .5; jig.vel += 1.2;\n      }\n    } else {\n      const k = 260, c = rm ? 2 * Math.sqrt(k) : 9;\n      tip.vx += (-k * tip.x - c * tip.vx) * dt; tip.vy += (-k * tip.y - c * tip.vy) * dt;\n      tip.x += tip.vx * dt; tip.y += tip.vy * dt;\n    }\n    sqV += ((dragging ? .07 : 0) - sq) * 320 * dt - sqV * 18 * dt; sq += sqV * dt;\n    jig.vel += (-300 * jig.v - 10 * jig.vel) * dt; jig.v = clamp(jig.v + jig.vel * dt, -.12, .12);\n\n    const wob = rm ? 0 : .011 * Math.sin(t * 2.1) * (1 - nearK * .5);\n    const wob2 = rm ? 0 : .016 * Math.sin(t * 2.1 + 1.9);\n    const sx = 1 + wob + jig.v + sq * .5, sy = 1 + wob2 - jig.v * .8 - sq;\n    const ox = tip.x * .05, oy = tip.y * .05;\n    btn.style.transform = `translate(${ox}px,${oy}px) scale(${sx},${sy})`;\n\n    // 가까이 오면 가장자리가 부풀어 방울이 떨어져 나감\n    const segX = clamp(ptr.x, cx - BW / 2 + R, cx + BW / 2 - R);\n    let dx = ptr.x - segX, dy = ptr.y - cy; const dist = Math.hypot(dx, dy) || 1; dx /= dist; dy /= dist;\n    const gap = dist - R;\n    const k = ptr.in \u0026\u0026 !dragging \u0026\u0026 !rm \u0026\u0026 gap \u003e 0 ? clamp(1 - gap / 150, 0, 1) : 0;\n    nearK += (k - nearK) * Math.min(1, dt * 5);\n    spawnT -= dt;\n    if (nearK \u003e .25 \u0026\u0026 spawnT \u003c= 0 \u0026\u0026 Math.hypot(tip.x, tip.y) \u003c 20) {\n      const v = 60 + 170 * nearK;\n      drop(segX + dx * (R + 4 + nearK * 10), cy + dy * (R + 4 + nearK * 10), dx * v + rand(-30, 30), dy * v - 30, rand(3.5, 8));\n      spawnT = (.55 - .42 * nearK) * rand(.7, 1.3);\n      jig.vel += .25;\n    }\n\n    // 방울 물리\n    for (let i = drops.length - 1; i \u003e= 0; i--) {\n      const d = drops[i];\n      if (!d.landed) {\n        d.vy += G * dt; d.vx *= 1 - dt * .3; d.x += d.vx * dt; d.y += d.vy * dt;\n        if (d.y \u003e= floor) {\n          d.y = floor; d.landed = true;\n          if (d.kind === \u0027drop\u0027 \u0026\u0026 d.vy \u003e 220) {\n            const n = 2 + (Math.random() * 3 | 0), f = Math.min(1, d.vy / 900);\n            for (let j = 0; j \u003c n; j++) drop(d.x + rand(-4, 4), floor - 3, rand(-130, 130), -rand(120, 300) * f, rand(1.4, 3), \u0027spl\u0027);\n          }\n          d.vx = d.vy = 0;\n        }\n      } else d.life -= dt * (d.kind === \u0027spl\u0027 ? 1.4 : .4);\n      if (d.life \u003c= 0 || d.x \u003c -50 || d.x \u003e W + 50) drops.splice(i, 1);\n    }\n\n    // 그리기 (잉크 캔버스는 goo 필터로 서로 붙는다)\n    ic.clearRect(0, 0, W, H); sc.clearRect(0, 0, W, H);\n    ic.fillStyle = INK;\n    const px = cx + ox, py = cy + oy;\n    pill(px, py, BW * sx, BH * sy);\n    if (nearK \u003e .02) circle(ic, segX + dx * (R - 6 + nearK * 12), cy + dy * (R - 6 + nearK * 12), 9 + 6 * nearK);\n\n    const len = Math.hypot(tip.x, tip.y);\n    if (len \u003e 3) {\n      const ax = px + grab.x, ay = py, n = Math.max(4, Math.ceil(len / 8)), st = Math.min(1, len / 260);\n      for (let i = 0; i \u003c= n; i++) {\n        const p = i / n;\n        const r = (R * .82 + (15 - R * .82) * p) * (1 - .45 * st * Math.sin(Math.PI * p)) + (i === n ? 3 : 0);\n        circle(ic, ax + tip.x * p, ay + tip.y * p, r);\n      }\n      if (len \u003e 40) {\n        sc.fillStyle = \u0027rgba(255,255,255,.55)\u0027;\n        ellipse(sc, ax + tip.x - 6, ay + tip.y - 7, 4.5, 2.6);\n      }\n    }\n\n    for (const d of drops) {\n      const life = Math.sqrt(Math.max(0, d.life));\n      const r = (d.r + 3.5) * life;\n      if (!d.landed) {\n        const s = Math.min(.7, Math.abs(d.vy) / 1400);\n        ellipse(ic, d.x, d.y, r * (1 - s * .25), r * (1 + s));\n        if (r \u003e 7.5) { sc.fillStyle = `rgba(255,255,255,${.55 * life})`; circle(sc, d.x - r * .28, d.y - r * .35, r * .2); }\n      } else {\n        ellipse(ic, d.x, d.y + 2, r * 1.7, r * .62);\n      }\n    }\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"keycap-switch","file":"components/keycap-switch.html","name":"픽셀 달 키캡","cat":"스위치","desc":"두툼한 키캡을 누르면 픽셀 달이 흩어져 해로 다시 모이며 배경이 밝아져요","added":"2026-11-27","tags":["토글","스위치","다크모드","파티클","도트매트릭스","스큐어모피즘"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"픽셀 달 키캡\",\"cat\":\"스위치\",\"desc\":\"두툼한 키캡을 누르면 픽셀 달이 흩어져 해로 다시 모이며 배경이 밝아져요\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e픽셀 달 키캡\u003c/title\u003e\n\u003cstyle\u003e\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{display:grid;place-items:center;overflow:hidden;background:#14161c;color:#6f7786;\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;\n    transition:background-color .8s ease,color .8s ease}\n  body.day{background:#6b6b6b;color:#e9e9e9}\n  .wrap{display:flex;flex-direction:column;align-items:center;gap:26px}\n\n  .slot{position:relative;width:216px;height:112px;border-radius:28px;cursor:pointer;outline:none;\n    background:#0b0c10;-webkit-tap-highlight-color:transparent;\n    box-shadow:inset 0 5px 12px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.06);\n    transition:background-color .8s ease,box-shadow .8s ease}\n  body.day .slot{background:#4e4e50;\n    box-shadow:inset 0 5px 12px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.18)}\n  .slot:focus-visible{outline:2px solid #5fe9ff;outline-offset:5px}\n  body.day .slot:focus-visible{outline-color:#fff4dc}\n\n  .key{position:absolute;left:10px;top:10px;width:92px;height:92px;border-radius:18px;will-change:transform;\n    background:\n      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 4px),\n      linear-gradient(160deg,#6e7b8d,#4b5564 55%,#3a424e);\n    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 3px rgba(0,0,0,.3),0 5px 0 #242932,0 10px 18px rgba(0,0,0,.6);\n    transition:box-shadow .12s ease}\n  .key.down{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 2px rgba(0,0,0,.35),0 1px 0 #242932,0 3px 6px rgba(0,0,0,.7)}\n  .face{position:absolute;inset:7px 8px 12px;border-radius:13px;\n    background:\n      repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),\n      linear-gradient(180deg,#647083,#4c5667);\n    box-shadow:inset 0 1px 1px rgba(255,255,255,.22),inset 0 -3px 5px rgba(0,0,0,.25)}\n  .under{position:absolute;left:16px;right:16px;bottom:3px;height:3px;border-radius:3px;background:#7ff7ff;\n    box-shadow:0 0 6px #3fe6ff,0 0 16px 2px rgba(63,230,255,.65),0 8px 22px 6px rgba(63,230,255,.3);\n    transition:background-color .7s ease,box-shadow .7s ease}\n  body.day .under{background:#fff6e4;\n    box-shadow:0 0 6px #ffe9c4,0 0 16px 2px rgba(255,236,200,.7),0 8px 22px 6px rgba(255,230,190,.35)}\n  canvas{position:absolute;left:-70px;top:-70px;pointer-events:none}\n\n  .cap{font-size:14px;font-weight:500;letter-spacing:-.01em;user-select:none}\n  .cap b{font-weight:700;color:#bfe9f2;transition:color .8s}\n  body.day .cap b{color:#fff3d6}\n  @media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cdiv class=\"slot\" id=\"slot\" role=\"switch\" aria-checked=\"false\" tabindex=\"0\" aria-label=\"낮 모드\"\u003e\n      \u003cdiv class=\"key\" id=\"key\"\u003e\u003cspan class=\"face\"\u003e\u003c/span\u003e\u003cspan class=\"under\"\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003ccanvas id=\"cv\" aria-hidden=\"true\"\u003e\u003c/canvas\u003e\n    \u003c/div\u003e\n    \u003cp class=\"cap\" aria-live=\"polite\"\u003e지금은 \u003cb id=\"word\"\u003e밤\u003c/b\u003e이에요 · 키를 눌러 보세요\u003c/p\u003e\n  \u003c/div\u003e\n\u003cscript\u003e\n  const slot = document.getElementById(\u0027slot\u0027), key = document.getElementById(\u0027key\u0027),\n        cv = document.getElementById(\u0027cv\u0027), ctx = cv.getContext(\u00272d\u0027), word = document.getElementById(\u0027word\u0027);\n  const reduce = matchMedia(\u0027(prefers-reduced-motion: reduce)\u0027);\n  const PAD = 70, SW = 216, SH = 112, KS = 92, TRAVEL = SW - 20 - KS, N = 13, CELL = 5, DOT = 4;\n  const W = SW + PAD * 2, H = SH + PAD * 2;\n\n  function sizeCanvas() {\n    const d = window.devicePixelRatio || 1;\n    cv.width = W * d; cv.height = H * d; cv.style.width = W + \u0027px\u0027; cv.style.height = H + \u0027px\u0027;\n    ctx.setTransform(d, 0, 0, d, 0, 0);\n  }\n\n  // 도트 패턴 (키 중심 기준 좌표, 색)\n  function pattern(test) {\n    const out = [];\n    for (let r = 0; r \u003c N; r++) for (let c = 0; c \u003c N; c++) {\n      const col = test(c, r);\n      if (col) out.push({ x: (c - 6) * CELL, y: (r - 6) * CELL, col });\n    }\n    return out;\n  }\n  const MOON = pattern((c, r) =\u003e {\n    if (Math.hypot(c - 6, r - 6.4) \u003c= 5.4 \u0026\u0026 Math.hypot(c - 8.7, r - 4.3) \u003e 4.4) return [214, 236, 255];\n    const sp = [[11, 1], [10, 1], [12, 1], [11, 0], [11, 2], [12, 5]];\n    if (sp.some(([a, b]) =\u003e a === c \u0026\u0026 b === r)) return [150, 245, 255];\n    return null;\n  });\n  const SUN = pattern((c, r) =\u003e {\n    const d = Math.hypot(c - 6, r - 6);\n    if (d \u003c= 3.3) return d \u003c 1.6 ? [255, 240, 170] : [255, 207, 72];\n    const rays = [[6, 0], [6, 1], [6, 11], [6, 12], [0, 6], [1, 6], [11, 6], [12, 6], [2, 2], [3, 3], [10, 2], [9, 3], [2, 10], [3, 9], [10, 10], [9, 9]];\n    if (rays.some(([a, b]) =\u003e a === c \u0026\u0026 b === r)) return [255, 168, 46];\n    return null;\n  });\n\n  let on = false, busy = false, kx = 0, ky = 0, parts = null;\n\n  function keyCenter() { return { x: PAD + 10 + kx + KS / 2, y: PAD + 10 + ky + KS / 2 - 3 }; }\n  function placeKey() { key.style.transform = `translate(${kx}px,${ky}px)`; }\n\n  function drawDots(list) {\n    ctx.clearRect(0, 0, W, H);\n    for (const p of list) {\n      if (p.a \u003c= .01) continue;\n      const [r, g, b] = p.col;\n      ctx.globalAlpha = p.a;\n      ctx.shadowColor = `rgba(${r},${g},${b},.75)`; ctx.shadowBlur = 5;\n      ctx.fillStyle = `rgb(${r},${g},${b})`;\n      const s = p.s || DOT;\n      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);\n    }\n    ctx.globalAlpha = 1; ctx.shadowBlur = 0;\n  }\n  function drawStatic() {\n    const c = keyCenter();\n    drawDots((on ? SUN : MOON).map(d =\u003e ({ x: c.x + d.x, y: c.y + d.y, col: d.col, a: 1 })));\n  }\n\n  const ease = q =\u003e q \u003c .5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2;\n  const lerp = (a, b, q) =\u003e a + (b - a) * q;\n\n  function toggle() {\n    if (busy) return;\n    on = !on;\n    slot.setAttribute(\u0027aria-checked\u0027, String(on));\n    word.textContent = on ? \u0027낮\u0027 : \u0027밤\u0027;\n    if (reduce.matches) {\n      kx = on ? TRAVEL : 0; ky = 0; placeKey();\n      document.body.classList.toggle(\u0027day\u0027, on); drawStatic(); return;\n    }\n    busy = true;\n    const from = on ? MOON : SUN, to = on ? SUN : MOON, n = Math.max(from.length, to.length);\n    parts = Array.from({ length: n }, (_, i) =\u003e {\n      const a = from[i % from.length], b = to[i % to.length], ang = Math.random() * Math.PI * 2, dist = 55 + Math.random() * 60;\n {state=\u0027open\u0027;rollBtn.tabIndex=0;page.focus({preventScroll:true});live.textContent=\u0027헌장이 펼쳐졌어요.\u0027;write()},1150);\n  }\n  function close(){\n    if(state===\u0027closed\u0027||state===\u0027closing\u0027)return;\n    state=\u0027closing\u0027;clear();\n    chars.forEach(c=\u003ec.classList.remove(\u0027on\u0027));\n    rollBtn.tabIndex=-1;\n    sc.classList.remove(\u0027open\u0027);\n    later(()=\u003esc.classList.remove(\u0027lift\u0027),700);\n    later(()=\u003e{\n      state=\u0027closed\u0027;sheet.setAttribute(\u0027aria-hidden\u0027,\u0027true\u0027);openBtn.setAttribute(\u0027aria-expanded\u0027,\u0027false\u0027);\n      document.body.classList.remove(\u0027is-open\u0027);openBtn.focus({preventScroll:true});live.textContent=\u0027다시 말았어요.\u0027;\n    },1150);\n  }\n  openBtn.addEventListener(\u0027click\u0027,open);\n  rollBtn.addEventListener(\u0027click\u0027,e=\u003e{e.stopPropagation();close()});\n  page.addEventListener(\u0027click\u0027,()=\u003e{if(state===\u0027open\u0027||state===\u0027opening\u0027)close()});\n  page.addEventListener(\u0027keydown\u0027,e=\u003e{if(e.key===\u0027Enter\u0027\u0026\u0026e.target===page){e.preventDefault();close()}});\n  addEventListener(\u0027keydown\u0027,e=\u003e{if(e.key===\u0027Escape\u0027)close()});\n})();\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"id":"sync-button","file":"components/sync-button.html","name":"동기화 버튼","cat":"버튼","desc":"누르면 버튼 안에 진행 막대가 차오르고, 다 끝나면 체크 표시로 바뀌었다가 돌아오는 버튼","added":"2026-11-27","tags":["버튼","로딩","프로그레스바","상태전환","뉴모피즘"],"html":"\u003c!doctype html\u003e\n\u003c!-- meta: {\"name\":\"동기화 버튼\",\"cat\":\"버튼\",\"desc\":\"누르면 버튼 안에 진행 막대가 차오르고, 다 끝나면 체크 표시로 바뀌었다가 돌아오는 버튼\",\"added\":\"2026-11-27\"} --\u003e\n\u003chtml lang=\"ko\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\"\u003e\n\u003ctitle\u003e동기화 버튼\u003c/title\u003e\n\u003cstyle\u003e\n  :root{--bg:#e5eae2;--ink:#1f2c26;--mute:#7c8780;--fill:#24392f;--ease:cubic-bezier(.65,0,.25,1)}\n  *{box-sizing:border-box;margin:0}\n  html,body{height:100%}\n  body{display:grid;place-items:center;\n    background:radial-gradient(70% 60% at 50% 45%,#eef2ec,var(--bg));\n    font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Malgun Gothic\",sans-serif;color:var(--ink)}\n  .wrap{display:flex;flex-direction:column;align-items:center;gap:22px}\n\n  .btn{position:relative;width:200px;height:68px;border:0;border-radius:999px;cursor:pointer;color:var(--ink);\n    background:linear-gradient(180deg,#fbfcfa,#eef1ec);\n    box-shadow:0 1px 0 #fff inset,0 -2px 3px rgba(31,44,38,.06) inset,\n               0 14px 28px rgba(31,44,38,.13),0 3px 6px rgba(31,44,38,.08);\n    font:inherit;font-size:18px;font-weight:600;letter-spacing:-.02em;\n    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}\n  .btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 #fff inset,0 -2px 3px rgba(31,44,38,.06) inset,0 18px 34px rgba(31,44,38,.15),0 4px 8px rgba(31,44,38,.08)}\n  .btn:active{transform:translateY(1px) scale(.98)}\n  .btn:focus-visible{outline:2px solid var(--fill);outline-offset:4px}\n  .btn[aria-busy=\"true\"]{cursor:default}\n\n  .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;\n    transition:opacity .3s var(--ease),transform .4s var(--ease),filter .3s}\n  .face.hide{opacity:0;transform:scale(.92);filter:blur(4px);pointer-events:none}\n\n  /* 진행 막대 */\n  .track{position:absolute;left:24px;right:24px;top:50%;height:7px;margin-top:-3.5px;border-radius:99px;\n    background:rgba(31,44,38,.09);box-shadow:0 1px 1px rgba(31,44,38,.12) inset;overflow:hidden}\n  .bar{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#1d3128,#2f4a3d)}\n  .face.load{transform:scaleX(.4)}\n  .face.load:not(.hide){transform:none}\n\n  .check{width:26px;height:26px;border-radius:50%;background:var(--fill);display:grid;place-items:center;\n    transform:scale(.3) rotate(-30deg);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}\n  .done:not(.hide) .check{transform:none}\n  .check path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .4s .15s ease}\n  .done:not(.hide) .check path{stroke-dashoffset:0}\n\n  .sub{font-size:14px;color:var(--mute);font-feature-settings:\"tnum\";min-height:1.4em;transition:opacity .2s}\n  .sub.fade{opacity:0}\n  @media (prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv class=\"wrap\"\u003e\n    \u003cbutton class=\"btn\" id=\"btn\" aria-live=\"polite\"\u003e\n      \u003cspan class=\"face idle\" id=\"idle\"\u003e노트 동기화\u003c/span\u003e\n      \u003cspan class=\"face load hide\" id=\"load\"\u003e\u003cspan class=\"track\"\u003e\u003cspan class=\"bar\" id=\"bar\"\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\n      \u003cspan class=\"face done hide\" id=\"done\"\u003e\n        \u003cspan class=\"check\"\u003e\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"\u003e\u003cpath d=\"M3 7.4 5.8 10 11 4.4\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n        완료\n      \u003c/span\u003e\n    \u003c/button\u003e\n    \u003cp class=\"sub\" id=\"sub\"\u003e노트 · 방금 동기화됨\u003c/p\u003e\n  \u003c/div\u003e\n\u003cscript\u003e\n  const TOTAL = 148;\n  const btn = document.getElementById(\u0027btn\u0027), sub = document.getElementById(\u0027sub\u0027), bar = document.getElementById(\u0027bar\u0027);\n  const face = { idle: idle, load: load, done: done };\n  const show = k =\u003e Object.entries(face).forEach(([n, el]) =\u003e el.classList.toggle(\u0027hide\u0027, n !== k));\n  const say = t =\u003e { sub.classList.add(\u0027fade\u0027); setTimeout(() =\u003e { sub.textContent = t; sub.classList.remove(\u0027fade\u0027); }, 160); };\n  let busy = false;\n\n  btn.addEventListener(\u0027click\u0027, () =\u003e {\n    if (busy) return;\n    busy = true; btn.setAttribute(\u0027aria-busy\u0027, \u0027true\u0027);\n    bar.style.width = \u00270%\u0027;\n    show(\u0027load\u0027); say(`노트 · 0 / ${TOTAL}`);\n    const start = performance.now(), D = 2600;\n    // 실제 동기화처럼 빨라졌다 느려졌다 하는 속도\n    const curve = p =\u003e p + Math.sin(p * Math.PI * 3) * .04 * (1 - p);\n    (function step(now) {\n      const p = Math.min(1, (now - start) / D), v = Math.max(0, Math.min(1, curve(p)));\n      bar.style.width = (v * 100) + \u0027%\u0027;\n      sub.textContent = `노트 · ${Math.round(v * TOTAL)} / ${TOTAL}`;\n      if (p \u003c 1) return requestAnimationFrame(step);\n      setTimeout(() =\u003e { show(\u0027done\u0027); say(\u0027노트 · 방금 동기화됨\u0027); }, 250);\n      setTimeout(() =\u003e { show(\u0027idle\u0027); busy = false; btn.removeAttribute(\u0027aria-busy\u0027); }, 2400);\n    })(start);\n  });\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"}];

  {"t":"Metaball","k":"메타볼","en":"메타볼","g":"움직임","d":"동그란 덩어리들이 가까워지면 물방울처럼 서로 붙고, 멀어지면 떨어지는 표현.","say":"\"Metaball처럼 붙었다 떨어지게\""},
  {"t":"Gooey","k":"구이필터","en":"구이 효과 · Goo filter","g":"움직임","d":"흐림과 선명하게 하기를 겹쳐서 모양들이 끈적하게 녹아 붙어 보이게 하는 기법. Metaball을 쉽게 만드는 방법이에요.","say":"\"끈적하게 Gooey 효과\""},
  {"t":"Spring","k":"물리","en":"스프링 · 물리 애니메이션","g":"움직임","d":"용수철이나 중력처럼 실제 물리 법칙을 흉내 내서 튕기거나 떨어지게 하는 움직임.","say":"\"Spring으로 튕기게\""},
  {"t":"Typewriter","k":"타이핑효과","en":"타이핑 효과","g":"움직임","d":"글자가 한 글자씩 써지듯 나타나는 효과.","say":"\"Typewriter처럼 한 글자씩\""},
  {"t":"Page curl","k":"페이지넘김","en":"페이지 넘김","g":"움직임","d":"화면 한쪽 모서리가 종이처럼 말리며 넘어가 다음 화면이 드러나는 전환.","say":"\"Page curl로 넘어가게\""},
  {"t":"Unfold","k":"펼치기","en":"펼치기 · Expand","g":"움직임","d":"작게 접혀 있던 것이 커지며 내용이 드러나는 움직임.","say":"\"누르면 Unfold되게\""},
  {"t":"Transition","k":"화면전환","en":"화면 전환","g":"움직임","d":"한 화면에서 다른 화면으로 바뀌는 순간의 움직임. 서서히 겹치는 건 Crossfade라고 해요.","say":"\"Crossfade로 전환\""},
  {"t":"Morphing","k":"상태전환","en":"모핑 · 상태 변형","g":"움직임","d":"버튼 하나가 대기 → 진행 → 완료처럼 모양을 바꿔 가며 지금 상태를 보여 주는 것.","say":"\"누르면 로딩으로 Morphing했다 체크로\""},
  {"t":"Theme switch","k":"테마전환","en":"테마 전환","g":"움직임","d":"색 조합 전체를 한 번에 바꾸는 것. Light ↔ Dark 테마가 대표적이에요.","say":"\"Theme switch\""},
  {"t":"Blink","k":"깜빡임","en":"깜빡임","g":"움직임","d":"눈 깜빡임처럼 짧게 닫혔다 열리는 움직임. 살아 있는 느낌을 줘요.","say":"\"가끔 Blink하게\""},
  {"t":"Caustics","k":"물결","en":"물빛 일렁임","g":"움직임","d":"수영장 바닥에 비치는 물결 모양 빛 무늬.","say":"\"수영장 Caustics\""},
  {"t":"타이머","k":"타이머","en":"Timer","g":"움직임","d":"시간이 흐르는 것을 숫자로 보여 주는 것.","say":"\"집중 시간 타이머\""},
  {"t":"Hover","k":"호버","en":"호버 · 마우스 올리기","g":"상호작용","d":"마우스를 올려놓기만 했을 때(누르기 전) 반응하는 것.","say":"\"Hover하면 ~하게\""},
  {"t":"Linked hover","k":"호버강조","en":"연동 강조","g":"상호작용","d":"한 곳에 마우스를 올리면 관련된 다른 곳도 같이 빛나는 것.","say":"\"표랑 도면이 같이 강조되게\""},
  {"t":"Cursor follow","k":"마우스따라가기","en":"커서 따라가기","g":"상호작용","d":"눈동자, 빛, 버튼 등이 마우스 위치를 따라 움직이는 것.","say":"\"Cursor follow로 쳐다보게\""},
  {"t":"Drag","k":"드래그","en":"드래그","g":"상호작용","d":"누른 채로 끌어서 옮기는 조작.","say":"\"Drag로 옮길 수 있게\""},
  {"t":"Long press","k":"길게누르기","en":"길게 누르기 · Press \u0026 hold","g":"상호작용","d":"잘못 누르는 걸 막으려고 몇 초 동안 누르고 있어야 실행되는 방식. 삭제처럼 되돌리기 어려운 일에 써요.","say":"\"Long press해야 실행되게\""},
  {"t":"Copy to clipboard","k":"클립보드","en":"복사 버튼","g":"상호작용","d":"누르면 글자가 복사되는 기능. 보통 \u0027복사했어요\u0027 같은 알림이 함께 떠요.","say":"\"누르면 이메일 복사\""},
  {"t":"Confirm","k":"확인버튼","en":"확인 단계","g":"상호작용","d":"되돌리기 어려운 일을 하기 전에 정말 할지 한 번 더 묻는 장치.","say":"\"한 번 더 Confirm받게\""},
  {"t":"SVG","k":"SVG","en":"벡터 그림","g":"만드는 법","d":"선과 도형을 수식으로 그리는 그림 형식. 아무리 키워도 깨지지 않아요. 아이콘과 도면에 많이 써요.","say":"\"SVG로 그려 줘\""},
  {"t":"Canvas","k":"캔버스","en":"캔버스","g":"만드는 법","d":"화면에 점 하나하나를 직접 그리는 도화지. 파티클이나 픽셀아트처럼 많이 움직이는 그림에 써요.","say":"\"Canvas로 그려 줘\""},
  {"t":"Clip-path","k":"클립패스","en":"클립 패스","g":"만드는 법","d":"모양대로 오려 내서 그 안만 보이게 하는 기법. 색이 쓸고 지나가는 효과에 자주 써요.","say":"\"Clip-path로 잘라 보이게\""},
  {"t":"Fill sweep","k":"색반전","en":"색 채우기 반전","g":"만드는 법","d":"마우스를 올리면 바탕색과 글자색이 서로 뒤바뀌며 칠해지는 효과.","say":"\"Hover하면 Fill sweep\""},
  {"t":"Lens","k":"돋보기","en":"돋보기 렌즈","g":"만드는 법","d":"유리구슬이나 렌즈 아래 부분만 크게 확대해 보여 주는 효과.","say":"\"구슬 아래가 Lens처럼 확대되게\""},
  {"t":"Specular","k":"반사광","en":"반사광 · Specular highlight","g":"만드는 법","d":"유리나 광택 표면에 맺히는 밝은 빛 반점. 마우스를 따라 움직이면 진짜 유리 같아져요.","say":"\"반짝이는 Specular\""}
];
// DATA-END
</script>
<script>
  const items = (window.LIBRARY || []).slice().sort((a, b) => (b.added || '').localeCompare(a.added || ''));
  const $ = id => document.getElementById(id);
  const cats = [...new Set(items.map(i => i.cat))];
  let cat = '전체', query = '', cur = null, showCode = false;
  // 용어사전
  const terms = window.GLOSSARY || [];
  const groups = [...new Set(terms.map(t => t.g))];
  let mode = 'items', curTerm = null;
  // 용어 → 그 용어의 한국어 태그(k)가 붙은 조각들
  const usedBy = term => items.filter(i => (i.tags || []).includes(term.k || term.t));

  $('count').textContent = `움직이는 조각 ${items.length}개, 용어 ${terms.length}개를 모아 뒀어요`;

  function shownTerms() {
    const q = query.replace(/^#/, '');
    return terms.filter(t => (cat === '전체' || t.g === cat) &&
      (!q || (t.t + ' ' + (t.k || '') + ' ' + t.en + ' ' + t.d).toLowerCase().includes(q)));
  }
  function drawTermList() {
    const list = shownTerms();
    if (!list.length) { $('list').innerHTML = `<li class="none">맞는 용어가 없어요. 다른 낱말로 찾아보세요.</li>`; return; }
    let html = '', g = null;
    for (const t of list) {
      if (t.g !== g) { g = t.g; html += `<li class="grp">${g}</li>`; }
      const n = usedBy(t).length;
      html += `<li><button class="item" data-term="${t.t}" aria-current="${!!curTerm && curTerm.t === t.t}"><b>${t.t}</b><small>${n ? n + '개' : ''}</small><span class="tl">${t.en}</span></button></li>`;
    }
    $('list').innerHTML = html;
  }
  function selectTerm(name) {
    const t = terms.find(x => x.t === name) || shownTerms()[0] || terms[0];
    if (!t) return;
    curTerm = t;
    document.querySelectorAll('.item[data-term]').forEach(b => b.setAttribute('aria-current', b.dataset.term === t.t));
    $('tGroup').textContent = t.g; $('tName').textContent = t.t; $('tEn').textContent = t.en;
    $('tDesc').textContent = t.d; $('tSay').textContent = t.say || '';
    const rel = usedBy(t);
    $('tRelHead').textContent = rel.length ? `#${t.k || t.t} 태그가 붙은 조각 ${rel.length}개` : `아직 #${t.k || t.t} 태그가 붙은 조각이 없어요`;
    $('tRel').innerHTML = rel.map(i => `<button class="tag" data-go="${i.id}">${i.name}</button>`).join('');
  }
  function setMode(m, keepQuery) {
    mode = m; cat = '전체';
    if (!keepQuery) { query = ''; $('q').value = ''; }
    document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
    $('view').classList.toggle('terms', m === 'terms');
    $('q').placeholder = m === 'terms' ? '용어 찾기 · 예: 유리, hover' : '찾기 · #토글처럼 태그로도';
    drawCats(); drawList();
    if (m === 'terms') selectTerm(curTerm ? curTerm.t : null);
  }
  // '용어사전'은 미리보기가 있는 용어사전 페이지로 넘어간다
  $('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.m === 'terms') location.href = 'glossary.html'; else setMode('items');
  });
  $('tRel').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    setMode('items'); select(b.dataset.go);
  });

  function shown() {
    // "#토글 #다크모드"처럼 #로 시작하는 낱말은 태그로, 나머지는 이름·설명에서 찾는다 (모두 맞아야 함)
    const words = query.split(/\s+/).filter(Boolean);
    return items.filter(i => {
      if (cat !== '전체' && i.cat !== cat) return false;
      const tags = (i.tags || []).map(t => t.toLowerCase());
      const text = (i.name + ' ' + i.desc + ' ' + i.cat + ' ' + tags.join(' ')).toLowerCase();
      return words.every(w => w.startsWith('#')
        ? (w.length === 1 || tags.some(t => t.startsWith(w.slice(1))))
        : text.includes(w));
    });
  }

  function drawCats() {
    const src = mode === 'terms' ? terms : items, key = mode === 'terms' ? 'g' : 'cat';
    $('cats').innerHTML = ['전체', ...(mode === 'terms' ? groups : cats)].map(c => {
      const n = c === '전체' ? src.length : src.filter(i => i[key] === c).length;
      return `<button class="cat" data-c="${c}" aria-pressed="${c === cat}">${c}<sup>${n}</sup></button>`;
    }).join('');
  }

  function drawList() {
    if (mode === 'terms') return drawTermList();
    const list = shown();
    $('list').innerHTML = list.length
      ? list.map(i => `<li><button class="item" data-id="${i.id}" aria-current="${!!cur && i.id === cur.id}"><b>${i.name}</b><small>${i.cat}</small><span class="tl">${(i.tags || []).map(t => '#' + t).join(' ')}</span></button></li>`).join('')
      : `<li class="none">맞는 게 없어요. 다른 낱말로 찾아보세요.</li>`;
  }

  function select(id, instant) {
    const it = items.find(i => i.id === id) || items[0];
    if (!it) return;
    cur = it;
    try { history.replaceState(null, '', '#' + it.id); } catch {}
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === it.id));
    const lab = $('label');
    const apply = () => {
      $('name').textContent = it.name; $('desc').textContent = it.desc;
      $('tags').innerHTML = (it.tags || []).map(t => `<button class="tag" data-tag="${t}">#${t}</button>`).join('');
      lab.classList.remove('out');
    };
    if (instant) apply(); else { lab.classList.add('out'); setTimeout(apply, 180); }
    drawCase();
  }

  function drawCase() {
    const box = $('case'); box.innerHTML = '';
    if (showCode) {
      const p = document.createElement('pre'); p.textContent = cur.html; box.append(p);
    } else {
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts'); f.title = cur.name; f.srcdoc = cur.html; box.append(f);
    }
  }

  $('cats').addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return;
    cat = b.dataset.c; drawCats(); drawList();
    if (mode === 'terms') { const l = shownTerms(); if (l.length && !l.includes(curTerm)) selectTerm(l[0].t); return; }
    const list = shown(); if (list.length && !list.includes(cur)) select(list[0].id);
  });
  $('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); drawList(); });
  // 태그를 누르면 그 태그로 찾기 (Shift+클릭하면 용어사전에서 뜻 보기)
  $('tags').addEventListener('click', e => {
    const b = e.target.closest('.tag'); if (!b) return;
    const term = terms.find(t => (t.k || t.t) === b.dataset.tag);
    if (e.shiftKey && term) { location.href = 'glossary.html#t-' + encodeURIComponent(term.t); return; }
    $('q').value = '#' + b.dataset.tag; query = $('q').value.toLowerCase();
    cat = '전체'; drawCats(); drawList(); $('q').focus();
  });
  $('list').addEventListener('click', e => {
    const b = e.target.closest('.item'); if (!b) return;
    if (b.dataset.term) return selectTerm(b.dataset.term);
    if (b.dataset.id !== cur?.id) select(b.dataset.id);
  });

  // 위·아래 화살표로 목록 넘기기
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    if (mode === 'terms') {
      const l = shownTerms(), n = l[l.indexOf(curTerm) + (e.key === 'ArrowDown' ? 1 : -1)];
      if (n) { e.preventDefault(); selectTerm(n.t); document.querySelector(`.item[data-term="${n.t}"]`)?.scrollIntoView({ block: 'nearest' }); }
      return;
    }
    const list = shown(), i = list.indexOf(cur), n = list[i + (e.key === 'ArrowDown' ? 1 : -1)];
    if (n) { e.preventDefault(); select(n.id); document.querySelector(`.item[data-id="${n.id}"]`)?.scrollIntoView({ block: 'nearest' }); }
  });

  $('codeBtn').onclick = () => {
    showCode = !showCode;
    $('codeBtn').setAttribute('aria-pressed', showCode);
    $('codeBtn').textContent = showCode ? '움직임 보기' : '코드 보기';
    drawCase();
  };
  $('newBtn').onclick = () => window.open(URL.createObjectURL(new Blob([cur.html], { type: 'text/html' })), '_blank');
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(cur.html); }
    catch { const t = document.createElement('textarea'); t.value = cur.html; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    toast(`${cur.name} 코드를 복사했어요`);
  };
  let tt;
  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

  drawCats(); drawList();
  select(decodeURIComponent(location.hash.slice(1)) || (items[0] && items[0].id), true);
</script>
</body>
