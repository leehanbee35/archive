<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>UI 용어사전</title>
<style>
  :root{--bg:#fff;--ink:#000;--mute:#767676;--rule:#e2e2e2;--soft:#f4f4f4}
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth;scroll-padding-top:120px}
  body{background:var(--bg);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid #000;outline-offset:2px}

  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}

  header{padding:64px 0 28px}
  .mode{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--soft);border:1px solid var(--rule)}
  .mode a{padding:7px 18px;border-radius:7px;font-size:13px;color:var(--mute);text-decoration:none}
  .mode a:hover{color:var(--ink)}
  .mode a[aria-current="page"]{background:#000;color:#fff;font-weight:600}
  h1{margin-top:18px;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .lede{margin-top:12px;max-width:56ch;color:var(--mute);font-size:16px;word-break:keep-all}

  /* 붙어 다니는 막대: 검색 + 분류 바로가기 */
  .bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
  .bar .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;padding-top:14px;padding-bottom:14px}
  .find{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--ink);padding:4px 0;min-width:240px;flex:0 1 320px}
  .find input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px}
  .find svg{width:16px;height:16px;flex:none}
  .jump{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
  .jump a{text-decoration:none;color:var(--mute)}
  .jump a:hover{color:var(--ink)}
  .jump sup{font-size:10px;margin-left:2px}

  /* 분류 */
  section{padding:40px 0 8px}
  section h2{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px;
    padding-bottom:14px;border-bottom:2px solid var(--ink)}
  section h2 small{font-size:13px;font-weight:400;color:var(--mute)}
  .sec-note{margin-top:10px;color:var(--mute);font-size:14px}

  /* 용어 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 24px;padding-top:24px}
  .term{display:flex;flex-direction:column;gap:6px;min-width:0}
  /* 미리보기 칸: 그 용어가 실제로 움직이는 작은 화면 */
  .pv{position:relative;height:180px;border-radius:12px;background:var(--soft);overflow:hidden;margin-bottom:8px;
    box-shadow:0 0 0 1px var(--rule)}
  .pv.none::after{content:"미리보기 준비 중";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--mute)}
  .term h3{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
  .term h3 span{margin-left:8px;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
  .term p{word-break:keep-all;font-size:14px}
  .say{margin-top:2px;font-size:13px;color:var(--mute)}
  .say b{color:var(--ink);font-weight:500}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;background:var(--soft)}
  a.chip:hover{border-color:var(--ink)}
  .chip.tag{background:#000;color:#fff;border-color:#000}
  button.chip{cursor:pointer;font:inherit;font-size:12px}
  .chip.play{background:#000;color:#fff;border-color:#000;padding:2px 8px}
  .vbox{display:block;width:100%;height:180px;padding:0;border:0;border-radius:12px;overflow:hidden;background:#111;cursor:zoom-in;margin-bottom:8px}
  .vbox video{width:100%;height:100%;object-fit:cover;display:block}
  .lb{width:min(1000px,94vw);padding:0;border:0;border-radius:14px;background:#000;color:#fff}
  .lb::backdrop{background:rgba(0,0,0,.7)}
  .lbh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px}
  .lbx{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  .lb video{display:block;width:100%;max-height:80vh;background:#000}
  .term.hit h3{background:linear-gradient(transparent 60%,#fff176 60%)}
  .empty{padding:60px 0;color:var(--mute);text-align:center;display:none}

  footer{padding:56px 0 80px;color:var(--mute);font-size:13px}

  @media (max-width:760px){
    .wrap{padding:0 16px}
    header{padding-top:40px}
    h1{font-size:30px}
    .grid{grid-template-columns:1fr}
    .find{flex:1 1 100%}
  }
  @media (min-width:761px) and (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
  <header class="wrap">
    <nav class="mode" aria-label="보기 바꾸기">
      <a href="index.html">조각</a>
      <a href="glossary.html" aria-current="page">용어사전</a>
    </nav>
    <h1>UI 용어사전</h1>
    <p class="lede" id="lede">버튼, 움직임, 질감을 부르는 이름들. 모르는 효과를 봤을 때 여기서 이름을 찾아 "이거 ○○로 만들어 줘"라고 말하면 돼요.</p>
  </header>

  <div class="bar">
    <div class="wrap">
      <label class="find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="용어 찾기 · 예: 유리, hover, 물방울" aria-label="용어 찾기">
      </label>
      <nav class="jump" id="jump" aria-label="분류 바로가기"></nav>
    </div>
  </div>

  <main class="wrap" id="main"></main>
  <p class="empty wrap" id="empty">맞는 용어가 없어요. 다른 낱말로 찾아보세요.</p>
  <dialog id="lb" class="lb">
    <div class="lbh"><b id="lbName"></b><button class="lbx" aria-label="닫기">×</button></div>
    <video id="lbVid" controls loop playsinline></video>
  </dialog>
  <footer class="wrap">새 용어가 생기면 Claude에게 "용어사전에 ○○ 추가해 줘"라고 하세요.</footer>

<script>
// DATA-START (build.ps1이 자동으로 채워요. 직접 고치지 마세요)
window.GLOSSARY = [
  {"t":"토글","k":"토글","en":"Toggle","g":"종류","d":"켜짐과 꺼짐, 두 상태만 오가는 조작. 누를 때마다 반대 상태로 바뀌어요.","say":"\"다크모드 토글 만들어 줘\""},
  {"t":"스위치","k":"스위치","en":"Switch","g":"종류","d":"토글을 실제 전등 스위치처럼 손잡이가 좌우로 미끄러지게 만든 모양. 토글과 거의 같은 말로 써요.","say":"\"손잡이가 미끄러지는 스위치\""},
  {"t":"버튼","k":"버튼","en":"Button","g":"종류","d":"한 번 눌러서 어떤 일을 하게 하는 것. 토글과 달리 상태를 계속 기억하지 않아요.","say":"\"누르면 ~하는 버튼\""},
  {"t":"로딩","k":"로딩","en":"Loader · Spinner","g":"종류","d":"기다리는 중이라는 걸 보여 주는 움직임. 빙글빙글 도는 건 Spinner라고 해요.","say":"\"로딩 스피너\""},
  {"t":"프로그레스 바","k":"프로그레스바","en":"Progress bar","g":"종류","d":"얼마나 진행됐는지를 막대가 차오르는 길이로 보여 주는 것.","say":"\"프로그레스 바가 차오르게\""},
  {"t":"내비게이션","k":"내비게이션","en":"Navigation · Nav","g":"종류","d":"홈, 검색, 설정처럼 다른 화면으로 옮겨 가는 메뉴 버튼 묶음.","say":"\"내비 버튼\", \"탭 바\""},
  {"t":"Dock","k":"메뉴","en":"독 · 떠 있는 메뉴","g":"종류","d":"여러 기능을 아이콘으로 모아 화면 위에 띄워 둔 막대. 맥의 아래쪽 아이콘 줄이 대표적이에요.","say":"\"아이콘 Dock\""},
  {"t":"대시보드","k":"대시보드","en":"Dashboard","g":"종류","d":"여러 숫자와 정보를 한 화면에 칸칸이 모아 보여 주는 화면.","say":"\"한눈에 보는 대시보드\""},
  {"t":"Variants","k":"버튼세트","en":"배리언트 · 버튼 세트","g":"종류","d":"같은 디자인을 색, 크기, 모양만 바꿔 여러 개 늘어놓은 묶음.","say":"\"크기별·색별 Variants\""},
  {"t":"다크모드","k":"다크모드","en":"Dark mode","g":"스타일","d":"어두운 바탕에 밝은 글자를 쓰는 화면. 낮/밤 전환 토글과 자주 짝을 이뤄요.","say":"\"다크모드로 바뀌게\""},
  {"t":"Neumorphism","k":"뉴모피즘","en":"뉴모피즘","g":"스타일","d":"바탕과 같은 색의 버튼이 살짝 튀어나오거나 눌려 들어간 것처럼 보이게, 밝은 그림자와 어두운 그림자를 함께 주는 방식.","say":"\"말랑하게 튀어나온 Neumorphism\""},
  {"t":"Glassmorphism","k":"글래스모피즘","en":"글래스모피즘","g":"스타일","d":"뒤가 뿌옇게 비치는 반투명 유리판 느낌. 뒤 배경을 흐리게(blur) 보여 주는 게 핵심이에요.","say":"\"뒤가 비치는 Glassmorphism\""},
  {"t":"Liquid Glass","k":"리퀴드글래스","en":"리퀴드 글래스","g":"스타일","d":"Glassmorphism에서 한 걸음 더 가서, 유리 가장자리가 빛을 굴절시키고 물방울처럼 늘어나거나 합쳐지는 느낌까지 주는 방식.","say":"\"물방울처럼 출렁이는 Liquid Glass\""},
  {"t":"Skeuomorphism","k":"스큐어모피즘","en":"스큐어모피즘","g":"스타일","d":"키캡, 종이, 금속처럼 실제 물건의 재질과 입체감을 그대로 흉내 내는 디자인.","say":"\"진짜 물건처럼 Skeuomorphic하게\""},
  {"t":"픽셀아트","k":"픽셀아트","en":"Pixel art","g":"스타일","d":"네모난 점(픽셀)을 크게 보이게 해서 옛날 게임처럼 그리는 그림.","say":"\"도트 그림으로\""},
  {"t":"Dot matrix","k":"도트매트릭스","en":"도트 매트릭스","g":"스타일","d":"작은 점을 바둑판처럼 배열해 글자나 그림을 만드는 표현. 전광판 느낌이에요.","say":"\"전광판 같은 Dot matrix\""},
  {"t":"Glow","k":"글로우","en":"글로우","g":"스타일","d":"물체 둘레에 빛이 번지는 효과. 네온사인 같은 느낌을 줘요.","say":"\"Glow가 번지게\""},
  {"t":"Iridescent","k":"무지갯빛","en":"무지갯빛","g":"스타일","d":"비눗방울이나 기름막처럼 보는 각도에 따라 무지개색이 일렁이는 표면.","say":"\"비눗방울처럼 Iridescent하게\""},
  {"t":"Conic gradient","k":"코닉그라데이션","en":"코닉 그라데이션","g":"스타일","d":"중심을 기준으로 시계방향으로 빙 돌며 색이 바뀌는 그라데이션. 빛 고리나 원형 진행 표시에 써요.","say":"\"빙 도는 Conic gradient 링\""},
  {"t":"Paper texture","k":"종이질감","en":"종이 질감","g":"스타일","d":"양피지나 오래된 종이처럼 얼룩과 결이 있는 바탕 표현.","say":"\"양피지 Paper texture\""},
  {"t":"Squash \u0026 Stretch","k":"스쿼시스트레치","en":"스쿼시 앤 스트레치","g":"움직임","d":"움직일 때 찌그러졌다 늘어났다 하며 말랑한 느낌을 주는 애니메이션 원칙.","say":"\"말랑하게 Squash \u0026 Stretch\""},
  {"t":"Particles","k":"파티클","en":"파티클","g":"움직임","d":"작은 점, 불티, 방울 같은 조각들을 잔뜩 뿌려서 흩어지거나 모이게 하는 효과.","say":"\"불티 Particles가 튀게\""},
  {"t":"Metaball","k":"메타볼","en":"메타볼","g":"움직임","d":"동그란 덩어리들이 가까워지면 물방울처럼 서로 붙고, 멀어지면 떨어지는 표현.","say":"\"Metaball처럼 붙었다 떨어지게\""},
  {"t":"Gooey","k":"구이필터","en":"구이 효과 · Goo filter","g":"움직임","d":"흐림과 선명하게 하기를 겹쳐서 모양들이 끈적하게 녹아 붙어 보이게 하는 기법. Metaball을 쉽게 만드는 방법이에요.","say":"\"끈적하게 Gooey 효과\""},
  {"t":"Spring","k":"물리","en":"스프링 · 물리 애니메이션","g":"움직임","d":"용수철이나 중력처럼 실제 물리 법칙을 흉내 내서 튕기거나 떨어지게 하는 움직임.","say":"\"Spring으로 튕기게\""},
  {"t":"Typewriter","k":"타이핑효과","en":"타이핑 효과","g":"움직임","d":"글자가 한 글자씩 써지듯 나타나는 효과.","say":"\"Typewriter처럼 한 글자씩\""},
  {"t":"Page curl","k":"페이지넘김","en":"페이지 넘김","g":"움직임","d":"화면 한쪽 모서리가 종이처럼 말리며 넘어가 다음 화면이 드러나는 전환.","say":"\"Page curl로 넘어가게\""},
  {"t":"Unfold","k":"펼치기","en":"펼치기 · Expand","g":"움직임","d":"작게 접혀 있던 것이 커지며 내용이 드러나는 움직임.","say":"\"누르면 Unfold되게\""},
  {"t":"Transition","k":"화면전환","en":"화면 전환","g":"움직임","d":"한 화면에서 다른 화면으로 바뀌는 순간의 움직임. 서서히 겹치는 건 Crossfade라고 해요.","say":"\"Crossfade로 전환\""},
  {"t":"Morphing","k":"상태전환","en":"모핑 · 상태 변형","g":"움직임","d":"버튼 하나가 대기 → 진행 → 완료처럼 모양을 바꿔 가며 지금 상태를 보여 주는 것.","say":"\"누르면 로딩으로 Morphing했다 체크로\""},
  {"t":"Theme switch","k":"테마전환","en":"테마 전환","g":"움직임","d":"색 조합 전체를 한 번에 바꾸는 것. Light ↔ Dark 테마가 대표적이에요.","say":"\"Theme switch\""},
  {"t":"Blink","k":"깜빡임","en":"깜빡임","g":"움직임","d":"눈 깜빡임처럼 짧게 닫혔다 열리는 움직임. 살아 있는 느낌을 줘요.","say":"\"가끔 Blink하게\""},
  {"t":"Caustics","k":"물결","en":"물빛 일렁임","g":"움직임","d":"수영장 바닥에 비치는 물결 모양 빛 무늬.","say":"\"수영장 Caustics\""},
  {"t":"타이머","k":"타이머","en":"Timer","g":"움직임","d":"시간이 흐르는 것을 숫자로 보여 주는 것.","say":"\"집중 시간 타이머\""},
  {"t":"Hover","k":"호버","en":"호버 · 마우스 올리기","g":"상호작용","d":"마우스를 올려놓기만 했을 때(누르기 전) 반응하는 것.","say":"\"Hover하면 ~하게\""},
  {"t":"Linked hover","k":"호버강조","en":"연동 강조","g":"상호작용","d":"한 곳에 마우스를 올리면 관련된 다른 곳도 같이 빛나는 것.","say":"\"표랑 도면이 같이 강조되게\""},
  {"t":"Cursor follow","k":"마우스따라가기","en":"커서 따라가기","g":"상호작용","d":"눈동자, 빛, 버튼 등이 마우스 위치를 따라 움직이는 것.","say":"\"Cursor follow로 쳐다보게\""},
  {"t":"Drag","k":"드래그","en":"드래그","g":"상호작용","d":"누른 채로 끌어서 옮기는 조작.","say":"\"Drag로 옮길 수 있게\""},

    function clip(c, less) {

<script>
  const terms = window.GLOSSARY || [], items = window.ITEMS || [];
  const NOTE = {
    '종류': '화면에 놓이는 물건의 이름이에요.',
    '스타일': '겉모습, 질감, 색을 부르는 말이에요.',
    '움직임': '어떻게 움직이고 바뀌는지를 부르는 말이에요.',
    '상호작용': '사람이 무엇을 했을 때 반응하는지를 부르는 말이에요.',
    '만드는 법': '만드는 사람끼리 쓰는 기술 이름이에요. 요청할 때 같이 말하면 더 정확해져요.'
  };
  const groups = [...new Set(terms.map(t => t.g))];
  const slug = g => 'g-' + groups.indexOf(g);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  document.getElementById('jump').innerHTML = groups.map(g =>
    `<a href="#${slug(g)}">${g}<sup>${terms.filter(t => t.g === g).length}</sup></a>`).join('') +
    `<a href="#g-ref">참고 영상<sup>${items.filter(i => i.video).length}</sup></a>`;
  document.getElementById('lede').textContent += ` 지금 ${terms.length}개가 있어요.`;

  function render(q) {
    q = (q || '').trim().toLowerCase().replace(/^#/, '');
    let shown = 0;
    document.getElementById('main').innerHTML = groups.map(g => {
      const list = terms.filter(t => t.g === g && (!q ||
        [t.t, t.k, t.en, t.d, t.say].join(' ').toLowerCase().includes(q)));
      shown += list.length;
      if (!list.length) return '';
      return `<section id="${slug(g)}">
        <h2>${g}<small>${list.length}개</small></h2>
        <p class="sec-note">${NOTE[g] || ''}</p>
        <div class="grid">${list.map(t => {
          const tag = t.k || t.t;
          const used = items.filter(i => (i.tags || []).includes(tag));
          return `<article class="term${q ? ' hit' : ''}" id="t-${encodeURIComponent(t.t)}">
            <div class="pv" data-k="${esc(tag)}" aria-hidden="true"></div>
            <h3>${esc(t.t)}<span>${esc(t.en)}</span></h3>
            <p>${esc(t.d)}</p>
            ${t.say ? `<p class="say">이렇게 말해 보세요 <b>${esc(t.say)}</b></p>` : ''}
            <div class="meta"><span class="chip tag">#${esc(tag)}</span>${used.map(i =>
              `<a class="chip" href="index.html#${i.id}">${esc(i.name)}</a>${i.video
                ? `<button class="chip play" data-v="${esc(i.video)}" data-n="${esc(i.name)}" title="보낸 참고 영상">▶</button>` : ''}`).join('')}</div>
          </article>`;
        }).join('')}</div>
      </section>`;
    }).join('');
    // 보낸 참고 영상 모음 (검색어가 있으면 이름·태그로 거른다)
    const vids = items.filter(i => i.video && (!q || (i.name + ' ' + (i.tags || []).join(' ')).toLowerCase().includes(q)));
    if (vids.length) {
      shown += vids.length;
      document.getElementById('main').insertAdjacentHTML('beforeend', `<section id="g-ref">
        <h2>참고 영상<small>${vids.length}개</small></h2>
        <p class="sec-note">보내 준 영상들이에요. 태그를 보면 어떤 용어로 부르면 되는지 알 수 있어요. 누르면 크게 봐요.</p>
        <div class="grid">${vids.map(i => `<article class="term">
          <button class="vbox" data-v="${esc(i.video)}" data-n="${esc(i.name)}" aria-label="${esc(i.name)} 영상 크게 보기">
            <video muted loop playsinline preload="none" data-src="${esc(i.video)}"></video></button>
          <h3>${esc(i.name)}</h3>
          <div class="meta">${(i.tags || []).map(t => `<span class="chip">#${esc(t)}</span>`).join('')}
            <a class="chip" href="index.html#${i.id}">내가 만든 것 보기</a></div>
        </article>`).join('')}</div></section>`);
    }
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
    document.querySelectorAll('.pv').forEach(pv => io.observe(pv));
    document.querySelectorAll('.vbox video').forEach(v => vio.observe(v));
  }

  // 참고 영상: 보일 때만 불러와서 재생
  const vio = new IntersectionObserver(entries => entries.forEach(en => {
    const v = en.target;
    if (en.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); }
    else v.pause();
  }), { rootMargin: '100px' });
  // 크게 보기
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const d = document.getElementById('lb');
    document.getElementById('lbName').textContent = b.dataset.n;
    const v = document.getElementById('lbVid'); v.src = b.dataset.v; v.play().catch(() => {});
    d.showModal();
  });
  document.getElementById('lb').addEventListener('close', () => { const v = document.getElementById('lbVid'); v.pause(); v.removeAttribute('src'); v.load(); });
  document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb' || e.target.closest('.lbx')) document.getElementById('lb').close(); });

  // 미리보기: 화면에 보일 때 처음 만들고, 보이는 동안만 움직이게(data-on)
  const DEMOS = window.DEMOS || {};
  const io = new IntersectionObserver(entries => entries.forEach(en => {
    const pv = en.target;
    pv.dataset.on = en.isIntersecting ? '1' : '0';
    if (en.isIntersecting && !pv.dataset.ready) {
      pv.dataset.ready = '1';
      const make = DEMOS[pv.dataset.k];
      if (!make) { pv.classList.add('none'); return; }
      try { make(pv); } catch (err) { pv.classList.add('none'); console.error('미리보기 오류:', pv.dataset.k, err); }
    }
  }), { rootMargin: '150px' });
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
  render('');
</script>
</body>
</html>
